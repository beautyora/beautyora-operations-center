# 브랜드 상품등록센터(partner.beautyora.kr) 정적 페이지. Cloudflare Pages도 같은 빌드 명령과 폴더를 쓴다.
# 화면은 src/의 Apps Script 화면을 그대로 묶고, 서버 호출은 브랜드용 웹앱(doPost)으로 보낸다.
# 보안 헤더는 빌드가 만드는 dist/partner/_headers에 있다(두 호스팅 공통).
# 브랜드용 웹앱 주소를 바꾸려면 환경 변수 BO_PARTNER_API_URL을 설정한다.
[build]
  command = "node scripts/build-partner-web.cjs dist/partner"
  publish = "dist/partner"
