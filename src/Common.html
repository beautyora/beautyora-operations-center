<script>
/* 공용: 서버 호출, 이스케이프, 서식, 알림, 모달, 아이콘. */
'use strict';
const App = {
  version: document.body.dataset.version || '',
  // ops.beautyora.kr 빌드가 넣는 Apps Script 웹앱 주소(doPost)와 Google 로그인 클라이언트 ID(공개값).
  apiUrl: document.body.dataset.api || '',
  clientId: document.body.dataset.clientId || ''
};
const $ = (s, root) => (root || document).querySelector(s);
const $$ = (s, root) => Array.from((root || document).querySelectorAll(s));
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => { const s = String(u || ''); return /^https?:\/\//i.test(s) ? s : ''; };

/* ---------- 서버 호출 (ops.beautyora.kr → Apps Script doPost) ----------
 * 요청마다 Google 로그인(ID 토큰)을 함께 보내고, 서버가 Google에 확인한 뒤 운영진 목록과 비교한다. */
const Api = {
  cache: new Map(),
  TIMEOUT_MS: 90000,
  call(action, payload, options) {
    options = options || {};
    const run = () => Api.signedPost(action, payload);
    // 네트워크 오류만 한 번 다시 시도한다.
    return run().catch((e) => (e.network && !options.noRetry ? new Promise((r) => setTimeout(r, 800)).then(run) : Promise.reject(e)));
  },
  /** 로그인을 먼저 확인하고, 서버가 만료되었다고 하면 다시 로그인한 뒤 한 번 더 보낸다. */
  async signedPost(action, payload) {
    await Auth.ensure();
    return Api.post(action, payload).catch(async (e) => {
      if (e.code !== 'NEED_LOGIN') throw e;
      Auth.clear();
      await Auth.ensure();
      return Api.post(action, payload);
    });
  },
  /** text/plain이라 브라우저의 사전 확인 요청 없이 보낸다. 쿠키는 보내지 않는다. */
  post(action, payload) {
    const network = (m) => { const e = new Error(m); e.network = true; return e; };
    if (!App.apiUrl) return Promise.reject(new Error('운영센터는 ops.beautyora.kr 주소에서 열어 주세요.'));
    // 서버가 오래 답하지 않으면 끝없이 기다리지 않고 알려 준다(다시 보내지는 않는다).
    const controller = window.AbortController ? new AbortController() : null;
    const timer = controller ? setTimeout(() => controller.abort(), Api.TIMEOUT_MS) : 0;
    return fetch(App.apiUrl, {
      method: 'POST', redirect: 'follow', credentials: 'omit', signal: controller ? controller.signal : undefined,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload: payload || {}, idToken: Auth.token || undefined })
    }).catch((e) => {
      clearTimeout(timer);
      if (e && e.name === 'AbortError') { const t = new Error('서버 응답이 ' + Math.round(Api.TIMEOUT_MS / 1000) + '초 넘게 없어 멈췄습니다. 잠시 후 다시 시도해 주세요.'); t.timeout = true; return Promise.reject(t); }
      return Promise.reject(network('인터넷 연결이 불안정합니다. 잠시 후 다시 시도해 주세요.'));
    })
      .then((r) => { clearTimeout(timer); return r; })
      .then((r) => r.json().catch(() => Promise.reject(network('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주세요.'))))
      .then((res) => {
        if (res && res.ok) return res.data;
        const e = new Error((res && res.message) || '응답을 받지 못했습니다.'); e.code = res && res.code;
        throw e;
      });
  },
  /** 읽기 요청은 짧게 캐시한다. 새로 고침 뒤에는 Api.invalidate(). */
  get(action, payload, ttl) {
    const key = action + JSON.stringify(payload || {});
    const hit = Api.cache.get(key);
    if (hit && Date.now() - hit.at < (ttl || 60000)) return hit.promise;
    const promise = Api.call(action, payload).catch((e) => { Api.cache.delete(key); throw e; });
    Api.cache.set(key, { at: Date.now(), promise });
    return promise;
  },
  invalidate() { Api.cache.clear(); }
};

/* ---------- Google 로그인 (Google Identity Services) ----------
 * 로그인하면 Google이 서명한 ID 토큰(약 1시간 유효)을 받아 요청마다 함께 보낸다.
 * 같은 브라우저 탭에서는 sessionStorage에 두고, 만료되면 자동 로그인(auto_select)으로 다시 받는다. */
const Auth = {
  token: '',
  key: 'bo.idToken',
  pending: null,
  expiresAt(token) {
    try { return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; }
  },
  email() {
    try { return String(JSON.parse(atob(Auth.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email || ''); } catch (e) { return ''; }
  },
  valid() { return !!Auth.token && Auth.expiresAt(Auth.token) > Date.now() + 60000; },
  clear() { Auth.token = ''; try { sessionStorage.removeItem(Auth.key); } catch (e) { /* 무시 */ } },
  /** 유효한 로그인이 있을 때까지 기다린다. 없으면 로그인 화면을 띄운다. */
  ensure() {
    if (!Auth.token) { try { Auth.token = sessionStorage.getItem(Auth.key) || ''; } catch (e) { /* 무시 */ } }
    if (Auth.valid()) return Promise.resolve(Auth.token);
    Auth.token = '';
    if (!Auth.pending) Auth.pending = Auth.signIn().finally(() => { Auth.pending = null; });
    return Auth.pending;
  },
  async clientId() {
    if (App.clientId) return App.clientId;
    const config = await Api.post('auth.config');
    App.clientId = String((config && config.clientId) || '');
    if (!App.clientId) throw new Error('운영센터 로그인이 아직 설정되지 않았습니다. (BO_GOOGLE_CLIENT_ID)');
    return App.clientId;
  },
  loadScript() {
    if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Google 로그인을 불러오지 못했습니다. 인터넷 연결이나 광고 차단 설정을 확인해 주세요.'));
      document.head.appendChild(s);
    });
  },
  screen(inner) {
    let box = $('#authScreen');
    if (!box) {
      box = document.createElement('div');
      box.id = 'authScreen';
      box.className = 'auth-screen';
      document.body.appendChild(box);
    }
    box.innerHTML = '<div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">' + LOGO_SVG + inner + '</div>';
    return box;
  },
  signIn() {
    const box = Auth.screen('<strong id="authTitle">운영센터 로그인</strong><p>운영진으로 등록된 Google 계정으로 로그인해 주세요.</p><div id="authButton" class="auth-button"><div class="spinner"></div></div>' +
      '<p class="small muted">등록되지 않은 계정은 들어올 수 없습니다. 운영진 추가는 설정 → 운영진 계정에서 합니다.</p>');
    return Promise.all([Auth.loadScript(), Auth.clientId()]).then(([, clientId]) => new Promise((resolve) => {
      google.accounts.id.initialize({
        client_id: clientId, auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true, itp_support: true,
        callback: (res) => {
          Auth.token = String((res && res.credential) || '');
          try { sessionStorage.setItem(Auth.key, Auth.token); } catch (e) { /* 무시 */ }
          box.remove();
          resolve(Auth.token);
        }
      });
      $('#authButton', box).innerHTML = '';
      google.accounts.id.renderButton($('#authButton', box), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ko' });
      google.accounts.id.prompt();
    })).catch((e) => {
      Auth.screen('<strong id="authTitle">로그인을 준비하지 못했습니다</strong><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">다시 시도</button>');
      return new Promise(() => {}); // 다시 시도할 때까지 기다린다.
    });
  },
  /** 등록되지 않은 계정으로 로그인했을 때: 자동 로그인을 끄고 다른 계정을 고르게 한다. */
  switchAccount() {
    Auth.clear();
    try { google.accounts.id.disableAutoSelect(); } catch (e) { /* 무시 */ }
    location.reload();
  },
  signOut() { Auth.switchAccount(); }
};

/* ---------- 서식 ---------- */
const Fmt = {
  num(n) { if (n === null || n === undefined || n === '') return '—'; const x = Number(n); return isFinite(x) ? x.toLocaleString('ko-KR') : String(n); },
  date(v) { if (!v) return '—'; const s = String(v); return s.slice(0, 10); },
  datetime(v) { if (!v) return '—'; const d = new Date(v); if (isNaN(d)) return String(v); return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); },
  ago(v) {
    if (!v) return '—'; const d = new Date(v); if (isNaN(d)) return String(v);
    const s = Math.round((Date.now() - d.getTime()) / 1000);
    if (s < 60) return '방금 전'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
    if (s < 86400 * 7) return Math.floor(s / 86400) + '일 전'; return Fmt.date(v);
  },
  list(v) { return Array.isArray(v) ? v.filter(Boolean).join(', ') : (v == null ? '' : String(v)); }
};

const STATUS_TONE = {
  '정상': 'ok', '확정': 'ok', '완료': 'ok',
  '주의': 'warn', '접수·검토': 'info',
  '오류': 'bad', '보류': ''
};

6.28V304.27H1528.89V176.91ZM1755.16 243.044L1647.43 144.894H1695.57L1774.32 214.767L1852.84 144.894H1900.28L1792.55 243.277V304.27H1755.16V243.044ZM2000.92 307.308C1912.35 307.308 1872.86 281.836 1872.86 224.582C1872.86 167.328 1912.35 141.856 2000.92 141.856C2089.49 141.856 2128.98 167.328 2128.98 224.582C2128.98 281.836 2089.49 307.308 2000.92 307.308ZM2000.92 275.059C2069.39 275.059 2091.13 260.336 2091.13 224.582C2091.13 188.828 2069.39 174.105 2000.92 174.105C1932.45 174.105 1910.25 188.828 1910.25 224.582C1910.25 260.336 1932.45 275.059 2000.92 275.059ZM2170.03 304.27H2132.64V144.894H2288.74C2328 144.894 2352.54 159.149 2352.54 198.643C2352.54 232.995 2332.91 249.587 2296.69 251.69L2282.43 251.924L2295.99 260.804L2350.2 304.27H2302.76L2241.3 253.793H2170.03V304.27ZM2170.03 176.91V225.517H2285.47C2305.8 225.517 2313.98 218.74 2313.98 201.447C2313.98 183.453 2305.8 176.91 2285.47 176.91H2170.03ZM2555.45 304.27L2533.25 270.385H2403.09L2380.89 304.27H2336.02L2443.51 144.894H2493.29L2600.79 304.27H2555.45ZM2420.61 243.978H2515.72L2468.29 171.535L2420.61 243.978Z"/></svg>';

function pill(text, tone) {
  if (!text) return '<span class="muted">—</span>';
  const t = tone != null ? tone : (STATUS_TONE[text] || '');
  return '<span class="pill' + (t ? ' pill-' + t : '') + '">' + esc(text) + '</span>';
}

/* ---------- 아이콘(선 아이콘, currentColor) ---------- */
const ICON_PATHS = {
  home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',

};
function icon(name, cls) {
  return '<svg class="' + (cls || 'icon') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (ICON_PATHS[name] || '') + '"/></svg>';
}

/* ---------- 알림 ---------- */
const Toast = {
  show(message, tone) {
    const el = document.createElement('div');
    el.className = 'toast' + (tone ? ' ' + tone : '');
    el.setAttribute('role', tone === 'bad' ? 'alert' : 'status');
    el.textContent = message;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), tone === 'bad' ? 6500 : 3200);
  },
  ok(m) { Toast.show(m, 'ok'); },
  error(e) { Toast.show(typeof e === 'string' ? e : (e && e.message) || '오류가 발생했습니다.', 'bad'); }
};

/* ---------- 버튼 처리 중 ---------- */
async function busy(button, task) {
  if (button && button.getAttribute('aria-busy') === 'true') return undefined;
  if (button) { button.setAttribute('aria-busy', 'true'); button.disabled = true; }
  try { return await task(); } finally { if (button) { button.removeAttribute('aria-busy'); button.disabled = false; } }
}

/* ---------- 모달 ---------- */
const Modal = {
  open(options) {
    Modal.close();
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.id = 'modal';
    wrap.innerHTML = '<div class="modal' + (options.wide ? ' modal-wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' +
      '<div class="modal-head"><h2 id="modalTitle">' + esc(options.title) + '</h2><button class="btn btn-ghost btn-icon" data-close aria-label="닫기">' + icon('x') + '</button></div>' +
      '<div class="modal-body">' + (options.body || '') + '</div>' +
      (options.foot === false ? '' : '<div class="modal-foot">' + (options.foot || '<button class="btn" data-close>닫기</button>') + '</div>') + '</div>';
    wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-close]')) Modal.close(); });
    document.body.appendChild(wrap);
    const first = wrap.querySelector('input, select, textarea, button.btn-primary');
    if (first) first.focus();
    return wrap;
  },
  close() { const m = $('#modal'); if (m) m.remove(); },
  confirm(title, message, okLabel, tone) {
    return new Promise((resolve) => {
      const m = Modal.open({ title, body: '<p>' + esc(message) + '</p>', foot: '<button class="btn" data-close>취소</button><button class="btn ' + (tone || 'btn-primary') + '" data-ok>' + esc(okLabel || '확인') + '</button>' });
      m.querySelector('[data-ok]').addEventListener('click', () => { Modal.close(); resolve(true); });
      m.addEventListener('click', (e) => { if (e.target.closest('[data-close]') || e.target === m) resolve(false); });
    });
  }
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#modal')) Modal.close(); });

/* ---------- 화면 조각 ---------- */
const UI = {
  empty(title, text, action) { return '<div class="empty"><strong>' + esc(title) + '</strong>' + (text ? '<span>' + esc(text) + '</span>' : '') + (action || '') + '</div>'; },
  error(e, retry) { return '<div class="empty"><strong>불러오지 못했습니다</strong><span>' + esc(e && e.message ? e.message : e) + '</span>' + (retry ? '<button class="btn" data-retry>' + icon('refresh') + '다시 시도</button>' : '') + '</div>'; },
  skeleton(rows) { let s = ''; for (let i = 0; i < (rows || 5); i++) s += '<div class="skeleton skeleton-line" style="width:' + (60 + ((i * 17) % 40)) + '%"></div>'; return '<div class="card card-pad" aria-busy="true">' + s + '</div>'; },
  options(list, selected, placeholder) {
    return (placeholder != null ? '<option value="">' + esc(placeholder) + '</option>' : '') + (list || []).map((o) => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o; return '<option value="' + esc(v) + '"' + (String(v) === String(selected == null ? '' : selected) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('');
  }
};
</script>
