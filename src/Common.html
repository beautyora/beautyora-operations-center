<script>
/* 공용: 서버 호출, 이스케이프, 서식, 알림, 모달, 서랍, 아이콘. */
'use strict';
const App = {
  view: document.body.dataset.view,
  // 브랜드 전용 주소(Netlify)에서는 토큰이 주소창에만 있다.
  token: document.body.dataset.token || String(new URLSearchParams(location.search).get('token') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 64),
  version: document.body.dataset.version || '',
  // 비어 있으면 google.script.run, 있으면 이 웹앱 주소로 fetch(브랜드 전용 주소).
  apiUrl: document.body.dataset.api || ''
};
const $ = (s, root) => (root || document).querySelector(s);
const $$ = (s, root) => Array.from((root || document).querySelectorAll(s));
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => { const s = String(u || ''); return /^(https?:\/\/|data:image\/)/i.test(s) ? s : ''; };
const uid = (p) => (p || 'R') + '-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 10).toUpperCase();

/* ---------- 서버 호출 ---------- */
const Api = {
  cache: new Map(),
  call(action, payload, options) {
    options = options || {};
    const run = () => (App.apiUrl ? Api.post(action, payload) : new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) { reject(new Error('Google Apps Script 환경에서만 동작합니다.')); return; }
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.ok) resolve(res.data);
          else { const e = new Error((res && res.message) || '응답을 받지 못했습니다.'); e.code = res && res.code; reject(e); }
        })
        .withFailureHandler((err) => { const e = new Error(Api.friendly(err)); e.network = true; reject(e); })
        .api({ action, payload: payload || {}, token: App.token });
    }));
    // 네트워크 오류만 한 번 다시 시도한다(쓰기 요청은 요청 ID로 중복 저장을 막는다).
    return run().catch((e) => (e.network && !options.noRetry ? new Promise((r) => setTimeout(r, 800)).then(run) : Promise.reject(e)));
  },
  /** 브랜드 전용 주소에서 Apps Script 웹앱(doPost)을 부른다. text/plain이라 사전 확인 요청이 없다. */
  post(action, payload) {
    const network = (m) => { const e = new Error(m); e.network = true; return e; };
    return fetch(App.apiUrl, {
      method: 'POST', redirect: 'follow', credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload: payload || {}, token: App.token })
    }).catch(() => Promise.reject(network('인터넷 연결이 불안정합니다. 잠시 후 다시 시도해 주세요.')))
      .then((r) => r.json().catch(() => Promise.reject(network('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주세요.'))))
      .then((res) => {
        if (res && res.ok) return res.data;
        const e = new Error((res && res.message) || '응답을 받지 못했습니다.'); e.code = res && res.code; throw e;
      });
  },
  friendly(err) {
    const m = String((err && err.message) || err || '');
    if (/NetworkError|HTTP 0|Failed to fetch/i.test(m)) return '인터넷 연결이 불안정합니다. 잠시 후 다시 시도해 주세요.';
    if (/authorization|권한/i.test(m)) return '로그인이 필요하거나 권한이 없습니다. 페이지를 새로 고쳐 주세요.';
    if (/exceeded maximum execution time|시간/i.test(m)) return '처리 시간이 길어져 중단되었습니다. 잠시 후 결과를 확인해 주세요.';
    return m || '요청을 처리하지 못했습니다.';
  },
  /** 읽기 요청은 짧게 캐시한다. 쓰기 뒤에는 Api.invalidate(). */
  get(action, payload, ttl) {
    const key = action + JSON.stringify(payload || {});
    const hit = Api.cache.get(key);
    if (hit && Date.now() - hit.at < (ttl || 60000)) return hit.promise;
    const promise = Api.call(action, payload).catch((e) => { Api.cache.delete(key); throw e; });
    Api.cache.set(key, { at: Date.now(), promise });
    return promise;
  },
  invalidate() { Api.cache.clear(); }
};

/* ---------- 서식 ---------- */
const Fmt = {
  won(n) { if (n === null || n === undefined || n === '') return '—'; const x = Number(n); return isFinite(x) ? x.toLocaleString('ko-KR') + '원' : esc(n); },
  num(n) { if (n === null || n === undefined || n === '') return '—'; const x = Number(n); return isFinite(x) ? x.toLocaleString('ko-KR') : String(n); },
  date(v) { if (!v) return '—'; const s = String(v); return s.slice(0, 10); },
  datetime(v) { if (!v) return '—'; const d = new Date(v); if (isNaN(d)) return String(v); return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); },
  ago(v) {
    if (!v) return '—'; const d = new Date(v); if (isNaN(d)) return String(v);
    const s = Math.round((Date.now() - d.getTime()) / 1000);
    if (s < 60) return '방금 전'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
    if (s < 86400 * 7) return Math.floor(s / 86400) + '일 전'; return Fmt.date(v);
  },
  list(v) { return Array.isArray(v) ? v.filter(Boolean).join(', ') : (v == null ? '' : String(v)); },
  bytes(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; },
  today() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
};

function pill(text, tone) {
  if (!text) return '<span class="muted">—</span>';
  const t = tone != null ? tone : (STATUS_TONE[text] || '');
  return '<span class="pill' + (t ? ' pill-' + t : '') + '">' + esc(text) + '</span>';
}

function icon(name, cls) {
  return '<svg class="' + (cls || 'icon') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (ICON_PATHS[name] || '') + '"/></svg>';
}

/* ---------- 알림 ---------- */
const Toast = {
  show(message, tone) {
    const el = document.createElement('div');
    el.className = 'toast' + (tone ? ' ' + tone : '');
    el.setAttribute('role', tone === 'bad' ? 'alert' : 'status');
    el.textContent = message;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), tone === 'bad' ? 6500 : 3200);
  },
  ok(m) { Toast.show(m, 'ok'); },
  error(e) { Toast.show(typeof e === 'string' ? e : (e && e.message) || '오류가 발생했습니다.', 'bad'); }
};

/* ---------- 버튼 처리 중 ---------- */
async function busy(button, task) {
  if (button && button.getAttribute('aria-busy') === 'true') return undefined;
  if (button) { button.setAttribute('aria-busy', 'true'); button.disabled = true; }
  try { return await task(); } finally { if (button) { button.removeAttribute('aria-busy'); button.disabled = false; } }
}

/* ---------- 모달 ---------- */
const Modal = {
  open(options) {
    Modal.close();
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.id = 'modal';
    wrap.innerHTML = '<div class="modal' + (options.wide ? ' modal-wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' +
      '<div class="modal-head"><h2 id="modalTitle">' + esc(options.title) + '</h2><button class="btn btn-ghost btn-icon" data-close aria-label="닫기">' + icon('x') + '</button></div>' +
      '<div class="modal-body">' + (options.body || '') + '</div>' +
      (options.foot === false ? '' : '<div class="modal-foot">' + (options.foot || '<button class="btn" data-close>닫기</button>') + '</div>') + '</div>';
    wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-close]')) Modal.close(); });
    document.body.appendChild(wrap);
    const first = wrap.querySelector('input, select, textarea, button.btn-primary');
    if (first) first.focus();
    return wrap;
  },
  close() { const m = $('#modal'); if (m) m.remove(); },
  confirm(title, message, okLabel, tone) {
    return new Promise((resolve) => {
      const m = Modal.open({ title, body: '<p>' + esc(message) + '</p>', foot: '<button class="btn" data-close>취소</button><button class="btn ' + (tone || 'btn-primary') + '" data-ok>' + esc(okLabel || '확인') + '</button>' });
      m.querySelector('[data-ok]').addEventListener('click', () => { Modal.close(); resolve(true); });
      m.addEventListener('click', (e) => { if (e.target.closest('[data-close]') || e.target === m) resolve(false); });
    });
  }
};

/* ---------- 서랍(상세 패널) ---------- */
const Drawer = {
  onClose: null,
  open(html, onClose) {
    Drawer.close(true);
    const back = document.createElement('div');
    back.className = 'drawer-backdrop';
    back.id = 'drawerBack';
    const panel = document.createElement('aside');
    panel.className = 'drawer';
    panel.id = 'drawer';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.innerHTML = html;
    back.addEventListener('click', () => Drawer.close());
    panel.addEventListener('click', (e) => { if (e.target.closest('[data-drawer-close]')) Drawer.close(); });
    document.body.appendChild(back);
    document.body.appendChild(panel);
    Drawer.onClose = onClose || null;
    return panel;
  },
  close(silent) {
    const panel = $('#drawer'); const back = $('#drawerBack');
    if (panel) panel.remove(); if (back) back.remove();
    const cb = Drawer.onClose; Drawer.onClose = null;
    if (!silent && cb) cb();
  },
  body() { return $('#drawer .drawer-body'); }
};
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('#modal')) Modal.close(); else if ($('#drawer')) Drawer.close();
});

/* ---------- 화면 조각 ---------- */
const UI = {
  empty(title, text, action) { return '<div class="empty"><strong>' + esc(title) + '</strong>' + (text ? '<span>' + esc(text) + '</span>' : '') + (action || '') + '</div>'; },
  error(e, retry) { return '<div class="empty"><strong>불러오지 못했습니다</strong><span>' + esc(e && e.message ? e.message : e) + '</span>' + (retry ? '<button class="btn" data-retry>' + icon('refresh') + '다시 시도</button>' : '') + '</div>'; },
  skeleton(rows) { let s = ''; for (let i = 0; i < (rows || 5); i++) s += '<div class="skeleton skeleton-line" style="width:' + (60 + ((i * 17) % 40)) + '%"></div>'; return '<div class="card card-pad" aria-busy="true">' + s + '</div>'; },
  field(label, control, opts) {
    opts = opts || {};
    return '<div class="field' + (opts.full ? ' full' : '') + '">' + '<label' + (opts.for ? ' for="' + esc(opts.for) + '"' : '') + '>' + esc(label) + (opts.required ? '<span class="req" aria-hidden="true">*</span>' : '') + '</label>' + control + (opts.help ? '<span class="field-help">' + esc(opts.help) + '</span>' : '') + '<span class="field-error" data-error-for="' + esc(opts.for || '') + '"></span></div>';
  },
  options(list, selected, placeholder) {
    return (placeholder != null ? '<option value="">' + esc(placeholder) + '</option>' : '') + (list || []).map((o) => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o; return '<option value="' + esc(v) + '"' + (String(v) === String(selected == null ? '' : selected) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('');
  },
  thumb(url, cls) { const u = safeUrl(url); return '<span class="thumb' + (cls ? ' ' + cls : '') + '">' + (u ? '<img src="' + esc(u) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : icon('box')) + '</span>'; },
  driveThumb(fileId) { return fileId ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(fileId) + '&sz=w240' : ''; }
};

/** Notion 속성 한 개를 편집 컨트롤로 그린다. */
function propertyControl(p, id) {
  const v = p.value;
  const name = 'prop-' + id;
  if (!p.editable) return '<div class="pre">' + (p.display ? esc(p.display) : '<span class="muted">—</span>') + '</div>';
  switch (p.type) {
    case 'select': return '<select class="select" id="' + name + '" data-prop="' + esc(p.id) + '">' + UI.options(p.options, v || '', '선택 안 함') + '</select>';
    case 'multi_select': return '<div class="chips-select" data-prop="' + esc(p.id) + '" data-multi>' + p.options.map((o) => '<label><input type="checkbox" value="' + esc(o) + '"' + ((v || []).indexOf(o) >= 0 ? ' checked' : '') + '>' + esc(o) + '</label>').join('') + '</div>';
    case 'checkbox': return '<label class="check"><input type="checkbox" id="' + name + '" data-prop="' + esc(p.id) + '"' + (v ? ' checked' : '') + '> 예</label>';
    case 'number': return '<input class="input num" id="' + name + '" inputmode="decimal" data-prop="' + esc(p.id) + '" value="' + esc(v == null ? '' : v) + '">';
    case 'date': return '<input class="input" type="date" id="' + name + '" data-prop="' + esc(p.id) + '" value="' + esc(String(v || '').slice(0, 10)) + '">';
    case 'rich_text': return isLongText(p) ? '<textarea class="textarea" id="' + name + '" rows="3" data-prop="' + esc(p.id) + '">' + esc(v || '') + '</textarea>' : '<input class="input" id="' + name + '" data-prop="' + esc(p.id) + '" value="' + esc(v || '') + '">';
    case 'url': return '<div class="row"><input class="input" type="url" id="' + name + '" data-prop="' + esc(p.id) + '" value="' + esc(v || '') + '">' + (safeUrl(v) ? '<a class="btn btn-icon" href="' + esc(v) + '" target="_blank" rel="noopener" aria-label="열기">' + icon('external') + '</a>' : '') + '</div>';
    default: return '<input class="input" id="' + name + '" data-prop="' + esc(p.id) + '" value="' + esc(v == null ? '' : v) + '">';
  }
}

/** 긴 글 속성인지(메모·내용·설명 등) 판단한다. 짧은 글은 한 줄 입력으로 그린다. */
function isLongText(p) {
  return p.type === 'rich_text' && (/메모|내용|특장점|설명|행동|자료|채널|주소|비고|특이/.test(p.name) || String(p.value || '').length > 60 || /\n/.test(String(p.value || '')));
}
const TYPE_LABEL = { title: '제목', rich_text: '텍스트', number: '숫자', select: '선택', multi_select: '여러 개 선택', url: '링크', checkbox: '체크', date: '날짜', email: '이메일', phone_number: '전화번호' };

/** 편집 폼에서 바뀐 속성만 모은다. */
function collectPropertyChanges(root, properties) {
  const byId = {};
  properties.forEach((p) => { byId[p.id] = p; });
  const changes = [];
  $$('[data-prop]', root).forEach((el) => {
    const p = byId[el.dataset.prop];
    if (!p || !p.editable) return;
    let value;
    if (el.hasAttribute('data-multi')) value = $$('input:checked', el).map((i) => i.value);
    else if (el.type === 'checkbox') value = el.checked;
    else value = el.value.trim();
    const before = p.type === 'multi_select' ? (p.value || []).slice().sort().join('|') : p.type === 'checkbox' ? !!p.value : p.type === 'date' ? String(p.value || '').slice(0, 10) : String(p.value == null ? '' : p.value);
    const after = p.type === 'multi_select' ? value.slice().sort().join('|') : value;
    if (String(before) !== String(after)) changes.push({ id: p.id, value });
  });
  return changes;
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => Toast.ok('복사했습니다.'), () => fallbackCopy(text));
  fallbackCopy(text);
  return Promise.resolve();
}
function fallbackCopy(text) {
  const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); Toast.ok('복사했습니다.'); } catch (e) { Toast.error('복사하지 못했습니다. 직접 선택해 복사해 주세요.'); }
  t.remove();
}

/** 저장소 접근이 막힌 브라우저에서도 동작하도록 감싼다. */
const Store = {
  get(key, fallback) { try { const v = window.localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
  set(key, value) { try { window.localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } },
  remove(key) { try { window.localStorage.removeItem(key); } catch (e) { /* 무시 */ } }
};

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    reader.readAsDataURL(file);
  });
}

/** 큰 이미지는 올리기 전에 줄인다(긴 변 2400px, JPEG). 8MB 제한을 넘지 않도록. */
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5 * 1048576) return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, 2400 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale); canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.88));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}
