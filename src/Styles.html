/* 2026-09 responsive workspace polish */
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
.app-shell,.main,.content,#content,.panel,.partner-main,.workspace,.page-body{min-width:0;max-width:100%}
.main,.content,#content{width:100%}
.content{max-width:none;padding-left:clamp(14px,2.4vw,36px);padding-right:clamp(14px,2.4vw,36px)}
.panel{width:100%;overflow:hidden}
.panel-head,.toolbar,.filter-bar,.page-actions,.modal-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel-head{justify-content:space-between}
.toolbar>* , .filter-bar>*{min-width:0}
.data-table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table{width:100%}
.metric-grid,.dashboard-grid,.card-grid,.product-card-grid{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.form-grid,.two-column,.detail-grid{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.field-group.full{grid-column:1/-1}
.modal-card,.modal-panel,.modal-content{width:min(920px,calc(100vw - 24px));max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto}
.modal-heading{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.modal-heading>.product-image-placeholder,.modal-heading>div:first-child img{width:56px;height:56px;border-radius:14px}
.checkbox-line{display:flex;gap:8px;align-items:center;min-height:42px}
.product-thumb{display:flex!important;align-items:center;justify-content:center;width:52px;height:52px;min-width:52px;overflow:hidden;border-radius:12px;background:#f5f6f8}
.product-thumb img,.product-card-image img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:cover}
.product-card-image{overflow:hidden;isolation:isolate}
.product-image-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;height:100%;min-height:52px;padding:6px;color:#8a94a3;background:linear-gradient(135deg,#f7f8fa,#eef1f5);text-align:center}
.product-image-placeholder>span{font-size:20px;line-height:1;color:#a6afbb}
.product-image-placeholder small{font-size:10px;line-height:1.15;white-space:nowrap}
.file-title{display:flex;align-items:center;gap:10px;min-width:220px}
.file-type{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:32px;padding:0 8px;border-radius:8px;background:#eef2ff;color:#4b5fcc;font-size:10px;font-weight:800;letter-spacing:.04em}
.file-friendly-name{max-width:340px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files-table td:first-child{max-width:420px}
@media (max-width:1100px){
 .content{padding-top:20px}.panel{padding:20px}.topbar{padding-left:20px;padding-right:20px}
 .data-table{min-width:860px}
}
@media (max-width:768px){
 .content{padding:14px}.panel{padding:16px;border-radius:16px}
 .topbar{padding:12px 14px}.topbar h1{font-size:18px}
 .panel-head,.toolbar,.filter-bar,.page-actions{align-items:stretch}
 .toolbar>input,.toolbar>select,.toolbar>button,.filter-bar>input,.filter-bar>select,.filter-bar>button{flex:1 1 180px;width:auto}
 .form-grid,.two-column,.detail-grid,.product-edit-grid{grid-template-columns:1fr}
 .metric-grid,.dashboard-grid,.card-grid,.product-card-grid{grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))}
 .modal-actions{position:sticky;bottom:0;margin:18px -16px -16px;padding:12px 16px;background:rgba(255,255,255,.96);border-top:1px solid #e9edf2}
 .modal-actions button{flex:1}
}
@media (max-width:520px){
 .content{padding:10px}.panel{padding:13px;border-radius:14px}
 .toolbar>*,.filter-bar>*,.page-actions>*{flex-basis:100%;width:100%}
 .metric-grid,.dashboard-grid,.card-grid,.product-card-grid{grid-template-columns:1fr}
 .modal-card,.modal-panel,.modal-content{width:calc(100vw - 12px);max-width:calc(100vw - 12px);max-height:calc(100vh - 12px);border-radius:16px}
