<style>
/* 뷰티오라 운영센터 디자인 시스템 v2 — 하나의 토큰 세트, 두 개의 기준 화면 폭(1024px, 720px). */
:root {
  --bg: #f6f5f3; --surface: #ffffff; --surface-2: #faf9f7; --surface-3: #f1efec;

  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -0.02em; line-height: 1.3; }
p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.grow { flex: 1; min-width: 0; }

.stack-lg { display: grid; gap: 20px; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; text-decoration: none; }

.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }

.textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand); box-shadow: var(--focus); }

.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .field-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }

.field-help { font-size: 12px; color: var(--muted); }

.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--brand); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }

.chips-select { display: flex; flex-wrap: wrap; gap: 6px; }

/* 상태 표시 */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }

.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-brand { background: var(--brand-soft); color: var(--brand); }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; }
.count.quiet { background: var(--surface-3); color: var(--ink-2); }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); background: var(--info-soft); color: #173f7a; font-size: 13px; }
.notice.warn { background: var(--warn-soft); color: #6b4300; }
.notice.bad { background: var(--bad-soft); color: #7d1a12; }
.notice.ok { background: var(--ok-soft); color: #145334; }

/* 카드·표 */
.card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.card-pad { padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-head h2, .card-head h3 { font-size: 15px; }
.card-body { padding: 16px 18px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 4px 0 8px; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr.clickable { cursor: pointer; }
.table tbody tr.clickable:hover { background: var(--surface-2); }
.table tbody tr.selected { background: var(--brand-soft); }
.table .right { text-align: right; }
.cell-title { font-weight: 600; }
.cell-sub { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); }
.list-item { display: flex; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }

.thumb { width: 44px; height: 44px; border-radius: var(--r-sm); background: var(--surface-3); object-fit: cover; flex: none; display: grid; place-items: center; color: var(--faint); font-size: 10px; overflow: hidden; }
.thumb > svg { width: 40%; height: 40%; max-width: 28px; max-height: 28px; opacity: .7; }

.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb-lg { width: 96px; height: 96px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.gallery a { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); color: inherit; font-size: 12px; background: var(--surface); }
.gallery a:hover { border-color: var(--line-strong); text-decoration: none; }
.gallery .thumb { width: 100%; height: 86px; }

/* 통계 타일 */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }

.stat .label { font-size: 13px; color: var(--muted); font-weight: 600; }
.stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stat .hint { font-size: 12px; color: var(--faint); }
.stat.attention .value { color: var(--brand); }
.stat.zero .value { color: var(--faint); }

/* 탭 */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { padding: 10px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.segmented { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-3); border-radius: var(--r-sm); }
.segmented button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-weight: 600; color: var(--muted); cursor: pointer; }

/* 빈 상태·로딩 */
.empty { display: grid; justify-items: center; gap: 6px; padding: 40px 20px; text-align: center; color: var(--muted); }
.empty strong { color: var(--ink); font-size: 15px; }
.skeleton { border-radius: 6px; background: linear-gradient(90deg, var(--surface-3) 25%, #ebe8e4 37%, var(--surface-3) 63%); background-size: 400% 100%; animation: shimmer 1.2s ease infinite; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.skeleton-line { height: 14px; margin: 10px 0; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted); text-align: center; padding: 24px; }

/* 앱 틀(관리자) */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 20px 12px; background: var(--surface); border-right: 1px solid var(--line); }

.logo strong { font-size: 15px; letter-spacing: .14em; }
.logo span { font-size: 12px; color: var(--muted); }
.nav { display: grid; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-sm); color: var(--ink-2); font-weight: 600; text-decoration: none; }
.nav-item:hover { background: var(--surface-3); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
.nav-item .count { margin-left: auto; }
.sidebar-foot { margin-top: auto; display: grid; gap: 6px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: rgba(246, 245, 243, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: 20px; }
.topbar .sub { font-size: 13px; color: var(--muted); }
.content { padding: 24px 28px 48px; display: grid; gap: 18px; align-content: start; max-width: 1480px; width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.toolbar .input, .toolbar .select { width: auto; min-width: 150px; }
.toolbar .search { flex: 1 1 240px; max-width: 360px; }
.menu-toggle { display: none; }
.split { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }

/* 서랍(상세) */
.drawer-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(31, 27, 24, .28); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(880px, 100vw); display: flex; flex-direction: column; background: var(--bg); box-shadow: var(--shadow-2); animation: slidein .18s ease; }
@keyframes slidein { from { transform: translateX(24px); } }
.drawer-head { display: flex; gap: 12px; align-items: flex-start; padding: 18px 22px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 19px; }
.drawer-tabs { padding: 0 22px; background: var(--surface); }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 40px; display: grid; gap: 16px; align-content: start; }

/* 모달·토스트 */
.modal-backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(31, 27, 24, .38); }
.modal { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-2); }
.modal-wide { width: min(760px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 16px; }
.modal-body { padding: 18px 20px; display: grid; gap: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 80; display: grid; gap: 8px; max-width: min(420px, calc(100vw - 36px)); }
.toast { padding: 12px 14px; border-radius: var(--r); background: var(--ink); color: #fff; box-shadow: var(--shadow-2); font-size: 13px; animation: slidein .18s ease; }
.toast.bad { background: var(--bad); }
.toast.ok { background: var(--ok); }

/* 업로드 */
.dropzone { display: grid; place-items: center; gap: 6px; padding: 18px; border: 1.5px dashed var(--line-strong); border-radius: var(--r); background: var(--surface-2); color: var(--muted); text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
.dropzone:hover, .dropzone.over { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.files { display: grid; gap: 6px; }
.file-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 13px; }
.progress { height: 4px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--brand); transition: width .2s; }

/* 비교(변경 요청) */
.diff td.before { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(180, 35, 24, .4); }
.diff td.after { color: var(--ink); font-weight: 600; background: var(--ok-soft); }
.timeline { display: grid; gap: 0; }
.timeline-item { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.timeline-item:last-child { border-bottom: 0; }
.timeline-dot { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--line-strong); }
.timeline-dot.open { background: var(--warn); }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }

/* 파트너 틀 */
.p-shell { min-height: 100vh; }
.p-top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.p-top-inner { max-width: 1120px; margin: 0 auto; padding: 14px 24px 0; display: grid; gap: 10px; }
.p-main { max-width: 1120px; margin: 0 auto; padding: 22px 24px 64px; display: grid; gap: 18px; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.steps span { display: inline-flex; align-items: center; gap: 6px; }
.steps b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-3); color: var(--ink-2); font-size: 11px; }
.editor { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.draft-list { position: sticky; top: 118px; }
.sticky-actions { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; background: rgba(255, 255, 255, .96); border-top: 1px solid var(--line); border-radius: 0 0 var(--r-lg) var(--r-lg); }

/* 반응형: 1024px 이하는 사이드바를 서랍으로, 720px 이하는 한 줄 배치 */
@media (max-width: 1024px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; z-index: 50; width: 260px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-2); }
  .sidebar.open { transform: none; }
  .menu-toggle { display: inline-flex; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .editor { grid-template-columns: minmax(0, 1fr); }
  .draft-list { position: static; }
}
@media (max-width: 720px) {
  .topbar { padding: 12px 16px; }
  .content { padding: 16px 16px 40px; }
  .form-grid, .two-col { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .kv dd { margin-bottom: 8px; }
  .drawer-head, .drawer-body { padding-left: 16px; padding-right: 16px; }
  .drawer-tabs { padding: 0 8px; }
  .p-top-inner, .p-main { padding-left: 16px; padding-right: 16px; }
  .toolbar .input, .toolbar .select { flex: 1 1 140px; min-width: 0; }
  .toolbar .search { max-width: none; }
  .hide-sm { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat .value { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
