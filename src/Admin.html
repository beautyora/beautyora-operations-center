<script>
/* 운영센터 화면. 브랜드 정보는 Notion에서 읽기만 하고, 수정은 Notion에서 한다. */
'use strict';
const Admin = { user: null, route: { path: 'home', query: {} }, state: {} };

const NAV = [
  { path: 'home', label: '홈', icon: 'home', title: '홈', sub: 'Notion 브랜드 목록의 진행 현황과 최근 수정입니다.' },
  { path: 'brands', label: '브랜드', icon: 'store', title: '브랜드', sub: 'Notion 브랜드 목록을 찾아봅니다. 이름을 누르면 Notion 페이지가 열립니다.' },
  { path: 'settings', label: '설정', icon: 'settings', title: '설정', sub: '연결 상태, 초기 설정, 메인 상품목록.' }
];

/* ---------- 이동 ---------- */
const Nav = {
  parse(hash) {
    const raw = String(hash || '').replace(/^#?\/?/, '');
    const [pathPart, queryPart] = raw.split('?');
    const parts = pathPart.split('/').filter(Boolean).map(decodeURIComponent);
    const query = {};
    (queryPart || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); query[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return { path: NAV.some((n) => n.path === parts[0]) ? parts[0] : 'home', query };
  },
  go(hash) {
    const target = '#/' + String(hash).replace(/^#?\/?/, '');
    if (window.google && google.script && google.script.history) {
      google.script.history.push(null, null, target.slice(1));
      Nav.apply(target);
    } else { location.hash = target; }
  },
  apply(hash) {
    Admin.route = Nav.parse(hash);
    renderNav();
    renderPage();
  }
};

/* ---------- 틀 ---------- */
function renderShell() {
  $('#root').innerHTML =
    '<div class="shell">' +
      '<aside class="sidebar" id="sidebar" aria-label="메뉴">' +
        '<div class="logo">' + LOGO_SVG + '<span>운영센터</span></div>' +
        '<nav class="nav" id="nav"></nav>' +
        '<div class="sidebar-foot"><span class="ellipsis" title="' + esc(Admin.user.email) + '">' + esc(Admin.user.email) + '</span><span>v' + esc(App.version) + ' · 브랜드 원본: Notion</span></div>' +
      '</aside>' +
      '<div class="main">' +
        '<header class="topbar"><button class="btn btn-ghost btn-icon menu-toggle" id="menuToggle" aria-label="메뉴 열기">' + icon('menu') + '</button>' +
          '<div class="grow"><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>' +
          '<button class="btn btn-sm" id="refreshBtn" title="Notion에서 최신 내용 다시 읽기">' + icon('refresh') + '<span class="hide-sm">새로 고침</span></button>' +
        '</header>' +
        '<main class="content" id="view" tabindex="-1"></main>' +
      '</div>' +
    '</div>';
  $('#menuToggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $('#refreshBtn').addEventListener('click', (e) => busy(e.currentTarget, async () => {
    await Api.call('system.refresh');
    Api.invalidate();
    renderPage();
    Toast.ok('Notion에서 최신 내용을 다시 읽었습니다.');
  }));
  $('#nav').addEventListener('click', (e) => {
    const a = e.target.closest('a[data-path]');
    if (!a) return;
    e.preventDefault();
    $('#sidebar').classList.remove('open');
    Nav.go('/' + a.dataset.path);
  });
}

function renderNav() {
  $('#nav').innerHTML = NAV.map((n) => '<a class="nav-item" href="#/' + n.path + '" data-path="' + n.path + '"' + (Admin.route.path === n.path ? ' aria-current="page"' : '') + '>' + icon(n.icon) + '<span>' + esc(n.label) + '</span></a>').join('');
  const current = NAV.find((n) => n.path === Admin.route.path);
  $('#pageTitle').textContent = current.title;
  $('#pageSub').textContent = current.sub;
  document.title = current.title + ' · 뷰티오라 운영센터';
}

const PAGES = { home: pageHome, brands: pageBrands, settings: pageSettings };

function renderPage() {
  Admin.state = { page: Admin.route.path };
  // 화면마다 새 컨테이너를 써서 이전 화면의 이벤트 처리기가 남지 않게 한다.
  const old = $('#view');
  const view = old.cloneNode(false);
  old.replaceWith(view);
  view.innerHTML = UI.skeleton(6);
  Promise.resolve(PAGES[Admin.route.path](view)).catch((e) => {
    view.innerHTML = UI.error(e, true);
    const retry = $('[data-retry]', view);
    if (retry) retry.addEventListener('click', renderPage);
  });
}

function queryString(q) { const keys = Object.keys(q || {}).filter((k) => q[k]); return keys.length ? '?' + keys.map((k) => encodeURIComponent(k) + '=' + encodeURIComponent(q[k])).join('&') : ''; }

/** Notion 페이지 링크(새 탭). */
function notionLink(url, text) {
  const u = safeUrl(url);
  return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(text) + '</a>' : esc(text);
}

/* ---------- 홈 ---------- */
async function pageHome(view) {
  const d = await Api.get('dashboard', {}, 30000);
  const tile = (s) => { const href = '/brands' + queryString({ stage: s.stage === '단계 없음' ? '' : s.stage }); return '<a class="stat" href="#' + esc(href) + '" data-link="' + esc(href) + '"><span class="label">' + esc(s.stage) + '</span><span class="value">' + Fmt.num(s.count) + '</span><span class="hint">곳</span></a>'; };
  view.innerHTML =
    (d.warnings && d.warnings.length ? '<div class="notice warn">' + icon('alert') + '<div>일부 정보를 불러오지 못했습니다: ' + esc(d.warnings.join(' / ')) + ' <a href="#/settings" data-link="/settings">연결 상태 확인</a></div></div>' : '') +
    '<section class="stats" aria-label="진행 단계별 브랜드">' + (d.stages.length ? d.stages.map(tile).join('') : '') + '</section>' +
    '<section class="card"><div class="card-head"><h2>최근 수정된 브랜드</h2><span class="small muted">Notion 기준</span></div><div class="list">' +
      (d.recent.length ? d.recent.map((r) => '<div class="list-item"><div class="grow"><div class="cell-title ellipsis">' + notionLink(r.url, r.name || '(이름 없음)') + '</div><div class="cell-sub">' + esc([r.code, r.company].filter(Boolean).join(' · ') || '—') + '</div></div>' + pill(r.stage) + '<span class="small muted nowrap">' + esc(Fmt.ago(r.edited)) + '</span></div>').join('') : UI.empty('브랜드가 없습니다')) +
    '</div></section>' +
    '<p class="small muted">브랜드 ' + Fmt.num(d.totals.brands) + '곳 · ' + esc(Fmt.datetime(d.generatedAt)) + ' 기준</p>';
}

/* ---------- 브랜드 ---------- */
async function pageBrands(view) {
  const data = await Api.get('brands.list', {}, 15000);
  const q = Admin.route.query;
  view.innerHTML =
    '<div class="toolbar">' +
      '<input class="input search" id="bq" type="search" placeholder="브랜드·회사·브랜드 ID·담당자 검색" value="' + esc(q.q || '') + '" aria-label="검색">' +
      '<select class="select" id="bstage" aria-label="진행 단계">' + UI.options(data.options.stage, q.stage || '', '모든 진행 단계') + '</select>' +
      '<select class="select" id="bpriority" aria-label="우선순위">' + UI.options(data.options.priority, q.priority || '', '모든 우선순위') + '</select>' +
      '<span class="grow"></span><span class="small muted" id="bcount"></span>' +
    '</div><section class="card table-wrap" id="btable"></section>';
  const paint = () => {
    const text = $('#bq').value.trim().toLowerCase();
    const stage = $('#bstage').value, priority = $('#bpriority').value;
    const list = data.brands.filter((b) => (!text || [b.name, b.company, b.code, b.contactName, b.email].join(' ').toLowerCase().includes(text)) && (!stage || b.stage === stage) && (!priority || b.priority === priority));
    $('#bcount').textContent = list.length + ' / ' + data.brands.length + '곳';
    $('#btable').innerHTML = list.length ? '<table class="table"><thead><tr><th>브랜드</th><th>진행 단계</th><th class="hide-sm">우선순위</th><th class="hide-sm">담당자</th><th class="hide-sm">구글 드라이브</th><th class="hide-sm">최근 수정</th></tr></thead><tbody>' +
      list.slice(0, 500).map((b) => '<tr data-code="' + esc(b.code) + '"><td><div class="cell-title">' + notionLink(b.url, b.name || '(이름 없음)') + (b.issue ? ' ' + pill(b.issue, 'bad') : '') + '</div><div class="cell-sub">' + esc(b.code) + (b.company ? ' · ' + esc(b.company) : '') + '</div></td><td>' + pill(b.stage) + '</td><td class="hide-sm">' + esc(b.priority || '—') + '</td><td class="hide-sm small">' + esc([b.contactName, b.email].filter(Boolean).join(' · ') || '—') + '</td><td class="hide-sm">' + (safeUrl(b.drive) ? '<a class="btn btn-sm" href="' + esc(b.drive) + '" target="_blank" rel="noopener">' + icon('external') + '열기</a>' : '<button class="btn btn-sm" data-folder="' + esc(b.code) + '">폴더 만들기</button>') + '</td><td class="hide-sm small muted nowrap">' + esc(Fmt.ago(b.edited)) + '</td></tr>').join('') +
      '</tbody></table>' : UI.empty('조건에 맞는 브랜드가 없습니다');
  };
  ['bq', 'bstage', 'bpriority'].forEach((id) => $('#' + id).addEventListener(id === 'bq' ? 'input' : 'change', paint));
  $('#btable').addEventListener('click', (e) => {
    const button = e.target.closest('[data-folder]');
    if (!button) return;
    const brand = data.brands.find((b) => b.code === button.dataset.folder);
    busy(button, async () => {
      if (!await Modal.confirm('드라이브 폴더 만들기', brand.name + ' 폴더를 만들고(하위 폴더·취합 엑셀 양식 포함) Notion "구글 드라이브"에 주소를 넣습니다.', '만들기')) return;
      try {
        const r = await Api.call('brands.folder', { code: brand.code }, { noRetry: true });
        brand.drive = r.url;
        Api.invalidate();
        paint();
        Toast.ok('폴더를 만들고 Notion에 주소를 넣었습니다.');
      } catch (err) { Toast.error(err); }
    });
  });
  paint();
}

/* ---------- 설정 ---------- */
async function pageSettings(view) {
  view.innerHTML =
    '<section class="card"><div class="card-head"><h2>연결 상태</h2><div class="row"><button class="btn btn-sm" id="sHealth">' + icon('refresh') + '다시 점검</button><button class="btn btn-sm btn-primary" id="sSetup">초기 설정 실행</button></div></div><div class="card-body" id="sHealthBox">' + UI.skeleton(4) + '</div></section>';
  view.insertAdjacentHTML('beforeend', '<section class="card"><div class="card-head"><h2>메인 상품목록</h2><span class="small muted">상품의 원본(Google 시트)</span></div><div class="card-body stack" id="mBox">' + UI.skeleton(2) + '</div></section>');
  mainProductsCard();
  view.insertAdjacentHTML('beforeend', '<section class="card"><div class="card-head"><h2>브랜드 드라이브 폴더</h2><button class="btn btn-sm" id="fSync">지금 처리</button></div><div class="card-body stack"><p class="small muted">초기 설정 이후 새로 등록된 브랜드는 BO ID가 확정되면 1분 주기로 자료 폴더를 준비하고 "구글 드라이브"에 주소를 기록합니다. 기존 브랜드는 자동 생성하지 않습니다. 기존 폴더와 공유 설정을 유지하며, 브랜드 화면의 "폴더 만들기" 버튼으로 개별 처리할 수 있습니다.</p><div id="fOut"></div></div></section>');
  $('#fSync').addEventListener('click', (e) => busy(e.currentTarget, async () => {
    try {
      const r = await Api.call('brands.foldersSync', {}, { noRetry: true });
      $('#fOut').innerHTML = r.skipped ? '<div class="notice warn">' + icon('alert') + '<div>' + esc(r.skipped) + '</div></div>' : '<div class="notice ' + (r.failed.length ? 'warn' : 'ok') + '"><div>만든 폴더 ' + r.created.length + '개' + (r.created.length ? ': ' + esc(r.created.map((c) => c.name).join(', ')) : '') + (r.failed.length ? '<br>실패 ' + r.failed.length + '개: ' + esc(r.failed.map((f) => f.name + ' — ' + f.message).join(' / ')) : '') + '</div></div>';
      if (r.created && r.created.length) Api.invalidate();
    } catch (err) { $('#fOut').innerHTML = UI.error(err); }
  }));
  const paintHealth = (h) => {
    $('#sHealthBox').innerHTML = '<div class="table-wrap"><table class="table"><tbody>' + h.results.map((r) => '<tr><td class="nowrap cell-title">' + esc(r.target) + '</td><td>' + pill(r.status) + '</td><td class="small">' + esc(r.message) + '</td></tr>').join('') + '</tbody></table></div><p class="small muted" style="margin-top:8px">' + esc(Fmt.datetime(h.checkedAt)) + ' 점검</p>';
  };
  Api.call('system.health').then(paintHealth).catch((e) => { $('#sHealthBox').innerHTML = UI.error(e); });
  $('#sHealth').addEventListener('click', (e) => busy(e.currentTarget, async () => { try { paintHealth(await Api.call('system.health')); } catch (err) { Toast.error(err); } }));
  $('#sSetup').addEventListener('click', (e) => busy(e.currentTarget, async () => {
    if (!await Modal.confirm('초기 설정', 'Notion 연결을 확인하고 정기 점검 트리거를 준비합니다. 예전 트리거는 정리합니다. Notion 데이터는 바꾸지 않습니다.', '실행')) return;
    try {
      const r = await Api.call('system.setup');
      paintHealth(r.health);
      Modal.open({ title: r.ok === false ? '초기 설정 — 일부 단계 실패' : '초기 설정 결과', body: (r.ok === false ? '<div class="notice bad">' + icon('alert') + '<div>실패한 단계의 안내를 따른 뒤 초기 설정을 다시 실행해 주세요.</div></div>' : '') + '<ul>' + r.report.map((l) => '<li' + (/^실패/.test(l) ? ' style="color:var(--bad)"' : '') + '>' + esc(l) + '</li>').join('') + '</ul>' });
      Api.invalidate();
    } catch (err) { Toast.error(err); }
  }));
}

/** 설정 → 메인 상품목록: 통합 상품리스트에서 한 번 만든다. 다시 만들면 새 파일이 생기고 이전 파일은 그대로 남는다. */
async function mainProductsCard() {
  const box = $('#mBox');
  let status;
  try { status = await Api.call('products.main'); } catch (e) { box.innerHTML = UI.error(e); return; }
  box.innerHTML =
    (status.url ? '<div class="notice ok">' + icon('external') + '<div>현재 메인 상품목록: <a href="' + esc(safeUrl(status.url)) + '" target="_blank" rel="noopener">시트 열기</a></div></div>' : '<p class="muted">아직 만들지 않았습니다. 통합 상품리스트(벤더별 운영본)의 정리 탭을 바탕으로 만듭니다. 원본은 바꾸지 않습니다.</p>') +
    '<div class="form-grid">' +
      '<div class="field full"><label for="mSource">통합 상품리스트 주소</label><input class="input" id="mSource" placeholder="https://docs.google.com/spreadsheets/d/…"></div>' +
      '<div class="field"><label for="mTab">탭 이름</label><input class="input" id="mTab" value="뷰티오라"></div>' +
      '<div class="field"><label for="mLegacy">기존 브랜드 자료 폴더 (제품 링크 찾기, 선택)</label><input class="input" id="mLegacy" placeholder="https://drive.google.com/drive/folders/…"></div>' +
    '</div>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn' + (status.url ? '' : ' btn-primary') + '" id="mBuild">' + (status.url ? '새로 만들기' : '메인 상품목록 만들기') + '</button></div><div id="mOut"></div>' +
    (status.url ? '<h3 class="section-title">섬네일 넣기</h3><p class="small muted">이미지 목록 시트(IMAGE 함수로 된 상품 사진)에서 바코드·상품명으로 찾아, 사진 파일을 "메인 상품목록 이미지" 폴더로 복사하고 IMAGE 함수로 넣습니다. 비어 있는 칸만 채우고, 오래 걸리면 멈춘 뒤 다시 누르면 이어서 합니다.</p>' +
      '<div class="form-grid"><div class="field full"><label for="iSheet">이미지 목록 시트 주소</label><input class="input" id="iSheet" placeholder="https://docs.google.com/spreadsheets/d/…"></div></div>' +
      '<div class="row" style="justify-content:flex-end"><button class="btn btn-primary" id="iRun">섬네일 넣기</button></div><div id="iOut"></div>' : '');
  $('#mBuild').addEventListener('click', (e) => busy(e.currentTarget, async () => {
    const sourceUrl = $('#mSource').value.trim();
    if (!sourceUrl) { Toast.error('통합 상품리스트 주소를 넣어 주세요.'); return; }
    if (!await Modal.confirm('메인 상품목록 만들기', '새 Google 시트를 만들어 상품을 옮기고 제품 링크를 찾아 채웁니다. 상품이 많으면 1~2분 걸립니다.' + (status.url ? ' 이전 메인 상품목록은 그대로 남습니다.' : ''), '만들기')) return;
    $('#mOut').innerHTML = '<div class="notice"><div>만드는 중입니다. 창을 닫지 마세요.</div></div>';
    try {
      const r = await Api.call('products.mainBuild', { sourceUrl, sheetName: $('#mTab').value.trim(), legacyFolderUrl: $('#mLegacy').value.trim() }, { noRetry: true });
      const s = r.stats;
      $('#mOut').innerHTML = '<div class="notice ok"><div><a href="' + esc(safeUrl(r.url)) + '" target="_blank" rel="noopener"><strong>메인 상품목록 열기</strong></a><br>상품 ' + Fmt.num(s.products) + '개 (벤더 상품 ' + Fmt.num(s.vendor) + '개) · 제품 링크: Notion ' + Fmt.num(s.linkNotion) + '개, 기존 엑셀 ' + Fmt.num(s.linkWorkbook) + '개, 못 찾음 ' + Fmt.num(s.noLink) + '개' + (s.storeMain ? ' · 상품 개별 링크가 아닌 것 ' + Fmt.num(s.storeMain) + '개' : '') + (r.report.length ? '<ul>' + r.report.map((l) => '<li>' + esc(l) + '</li>').join('') + '</ul>' : '') + '</div></div>';
    } catch (err) { $('#mOut').innerHTML = UI.error(err); }
  }));
  if ($('#iRun')) $('#iRun').addEventListener('click', (e) => busy(e.currentTarget, async () => {
    const imageSheetUrl = $('#iSheet').value.trim();
    if (!imageSheetUrl) { Toast.error('이미지 목록 시트 주소를 넣어 주세요.'); return; }
    $('#iOut').innerHTML = '<div class="notice"><div>섬네일을 넣는 중입니다. 최대 5분쯤 걸립니다.</div></div>';
    try {
      const r = await Api.call('products.mainImages', { imageSheetUrl }, { noRetry: true });
      $('#iOut').innerHTML = '<div class="notice ' + (r.remaining ? 'warn' : 'ok') + '"><div><a href="' + esc(safeUrl(r.url)) + '" target="_blank" rel="noopener"><strong>메인 상품목록 열기</strong></a><br>이번에 넣음 ' + Fmt.num(r.filled) + '개 · 이미 있음 ' + Fmt.num(r.already) + '개 · 이미지 목록에서 못 찾음 ' + Fmt.num(r.unmatched) + '개' + (r.failed ? ' · 실패 ' + Fmt.num(r.failed) + '개' : '') + (r.remaining ? '<br><strong>시간이 모자라 ' + Fmt.num(r.remaining) + '개가 남았습니다. 한 번 더 눌러 주세요.</strong>' : '') + (r.unmatchedSamples.length ? '<br><span class="small">못 찾은 예: ' + esc(r.unmatchedSamples.join(' / ')) + '</span>' : '') + '</div></div>';
    } catch (err) { $('#iOut').innerHTML = UI.error(err); }
  }));
}

/* ---------- 공통 ---------- */
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-link]');
  if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  Nav.go(a.dataset.link);
});

async function bootAdmin() {
  try {
    const data = await Api.call('admin.bootstrap');
    Admin.user = data.user;
    renderShell();
    Api.cache.set('dashboard{}', { at: Date.now(), promise: Promise.resolve(data.dashboard) });
    const start = (hash) => Nav.apply(hash || '#/home');
    if (window.google && google.script && google.script.url) {
      google.script.url.getLocation((loc) => start(loc.hash ? '#' + loc.hash.replace(/^#/, '') : ''));
      if (google.script.history) google.script.history.setChangeHandler((ev) => Nav.apply(ev.location.hash ? '#' + ev.location.hash.replace(/^#/, '') : '#/home'));
    } else {
      start(location.hash);
      window.addEventListener('hashchange', () => Nav.apply(location.hash));
    }
  } catch (e) {
    $('#root').innerHTML = '<div class="boot"><strong style="color:var(--ink);font-size:17px">운영센터를 열 수 없습니다</strong><p>' + esc(e.message) + '</p>' + (e.code === 'NOT_ADMIN' || e.code === 'NO_EMAIL' ? '<p class="small">관리자 이메일은 Apps Script 스크립트 속성 BO_ADMIN_EMAILS에서 관리합니다.</p>' : '') + '<button class="btn" onclick="location.reload()">다시 시도</button></div>';
  }
}
bootAdmin();
</script>
