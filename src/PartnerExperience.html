<script>(function partnerExperience(){
'use strict';
const MAX=8*1024*1024, CATEGORIES=['대표 이미지','추가 이미지','상세페이지','기타'];
const P={draft:null,step:0,active:0,busy:false,files:new Map(),previews:new Map(),errors:[],saved:'',notice:'',storage:true,importing:false,filter:''};
const uid=()=>crypto.randomUUID();
const safeUrl=v=>/^https?:\/\/[^\s]+$/i.test(String(v||''))?String(v):'';
const key=()=> 'beautyora-draft-v2:'+State.token;
const fresh=()=>({version:2,requestId:uid(),products:[],contactName:'',contactPhone:''});
const makeProduct=(data={})=>({id:'PRD-'+uid(),data:{...data},assets:[],detailUrl:data.detail_page_url||'',sourceSubmissionId:''});
const current=()=>P.draft.products[P.active];
const productName=(p,i)=>p.data.product_name||`상품 ${i+1}`;
function latest(){const seen=new Set();return (State.bootstrap.submissions||[]).filter(s=>{const k=s.productId||s.submissionId;if(seen.has(k))return false;seen.add(k);return true;});}
function save(){try{localStorage.setItem(key(),JSON.stringify(P.draft));P.saved=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});P.storage=true;}catch(e){P.storage=false;}const el=$('#uxSave');if(el)el.textContent=P.storage?`${P.saved} · 이 브라우저에 임시 저장됨`:'임시 저장을 사용할 수 없습니다. 창을 닫지 마세요.';}
function restore(){P.draft=fresh();try{const d=JSON.parse(localStorage.getItem(key())||'null');if(d&&d.version===2&&Array.isArray(d.products)){P.draft=d;P.draft.products.forEach(p=>p.assets.forEach(a=>{if(a.status!=='done'){a.status='missing';a.error='파일을 다시 선택해 주세요.';}}));}}catch(e){P.storage=false;}}
renderPartner=function(data){State.bootstrap=data;document.title='뷰티오라 · 브랜드 상품등록';$('#app').className='ux-app';$('#sidebar')?.remove();$('.topbar')?.remove();$('.main').className='ux-main';$('#content').className='ux-content';restore();paint();};
function action(label,act,cls='ux-button',extra=''){return `<button type="button" class="${cls}" data-action="${act}" ${extra}>${label}</button>`;}
function paint(){
 const brand=State.bootstrap.brand;const rows=latest();
 $('#content').innerHTML=`<div class="ux-wrap"><header class="ux-header"><div class="brand-lockup"><span class="brand-mark">B</span><div><strong>BEAUTYORA</strong><small>상품등록센터</small></div></div><span class="ux-brand">${esc(brand.brandName)}</span></header><section class="ux-hero"><div><h1>상품등록센터</h1><p>상품정보와 이미지를 등록하고 제출 현황을 확인하세요. 작성 내용은 이 브라우저에 자동 저장됩니다.</p></div></section><div class="ux-stats">${[['등록 상품',rows.length],['검수 중',rows.filter(s=>['신규 제출','검수 중'].includes(s.status)).length],['보완 필요',rows.filter(s=>s.status==='보완 필요').length],['승인 완료',rows.filter(s=>s.status==='승인 완료').length]].map(([l,n])=>`<div><strong>${n}</strong><span>${l}</span></div>`).join('')}</div>${P.notice?`<div class="ux-success" role="status">${esc(P.notice)}</div>`:''}<section class="ux-workspace"><div class="ux-section-title"><div><span class="ux-eyebrow">REGISTER PRODUCTS</span><h2>상품 등록하기</h2></div><span id="uxSave" class="ux-muted">${P.storage?'작성 내용은 이 브라우저에 저장됩니다.':'임시 저장을 사용할 수 없습니다.'}</span></div><div class="ux-steps">${['상품정보','이미지·상세페이지','제출 확인'].map((s,i)=>`<button type="button" data-action="step" data-index="${i}" class="${P.step===i?'active':''}" aria-current="${P.step===i?'step':'false'}"><b>${i+1}</b>${s}</button>`).join('')}</div><div id="uxEditor"></div></section><section class="ux-history"><div class="ux-section-title"><div><span class="ux-eyebrow">SUBMISSIONS</span><h2>제출 현황</h2></div>${action('새로고침','refresh','ux-button ux-secondary')}</div><div class="ux-history-list">${rows.length?rows.map((s,i)=>`<article><div><strong>${esc(s.data.product_name||'상품명 없음')}</strong><p>${esc(s.data.option_name||'기본 옵션')} · ${esc(s.updatedAt||'')}</p>${s.reviewNote?`<p class="ux-review-note">검수 안내: ${esc(s.reviewNote)}</p>`:''}</div><div class="ux-history-actions">${UI.status(s.status)}${action('내용 보기','view','ux-button ux-secondary',`data-index="${i}"`)}${s.status==='보완 필요'?action('보완 작성','revise','ux-button',`data-index="${i}"`):s.status==='승인 완료'?action('정보 수정','revise','ux-button',`data-index="${i}"`):''}</div></article>`).join(''):'<div class="ux-empty">아직 제출한 상품이 없습니다. 위에서 첫 상품을 등록해 주세요.</div>'}</div></section><footer class="ux-footer">BEAUTYORA · 상품정보를 제출하면 담당자가 확인 후 안내해 드립니다.</footer></div>`;
 const root=$('#content');root.onclick=onAction;root.oninput=onInput;root.onchange=onChange;root.ondragover=e=>{if(e.target.closest('[data-drop]')){e.preventDefault();e.target.closest('[data-drop]').classList.add('dragover');}};root.ondragleave=e=>e.target.closest('[data-drop]')?.classList.remove('dragover');root.ondrop=e=>{const box=e.target.closest('[data-drop]');if(box){e.preventDefault();box.classList.remove('dragover');if(!P.busy)addFiles([...e.dataTransfer.files],box.dataset.drop);}};
 paintEditor();
}
function paintEditor(){
 const mount=$('#uxEditor');if(!mount)return;
 if(!P.draft.products.length){mount.innerHTML=`<div class="ux-start"><div><span class="ux-start-icon">＋</span><h3>첫 상품을 추가해 주세요</h3><p>소수의 상품은 직접 입력하고,<br>상품이 많다면 엑셀·CSV로 한 번에 가져오세요.</p><div class="ux-inline">${action('상품 직접 입력','add')}${action('엑셀·CSV 가져오기','import','ux-button ux-secondary')}</div></div><aside><strong>미리 준비하면 더 빨라요</strong><ul><li>상품명, 카테고리, 바코드와 가격</li><li>대표 이미지와 상세페이지 이미지 또는 링크</li><li>여러 상품은 기존 엑셀 상품표</li></ul><small>파일은 한 개당 최대 8MB · JPG, PNG, WEBP, PDF</small></aside></div>${P.importing?importPanel():''}${P.errors.length?'<div class="ux-errors" role="alert">'+P.errors.map(esc).join('<br>')+'</div>':''}`;return;}
 const p=current();
 mount.innerHTML=`<div class="ux-work-grid"><aside class="ux-products"><div class="ux-list-heading">작성 중 <b>${P.draft.products.length}</b></div>${P.draft.products.map((p,i)=>`<button type="button" data-action="select" data-index="${i}" class="ux-product-tab ${P.active===i?'selected':''}"><span>${String(i+1).padStart(2,'0')}</span><div><strong>${esc(productName(p,i))}</strong><small>${p.changeRequest?'변경 요청 작성 중':p.sourceSubmissionId?'보완 작성 중':p.assets.length+'개 첨부'}</small></div></button>`).join('')}<div class="ux-list-tools">${action('+ 상품 추가','add','ux-button ux-secondary')}${action('엑셀·CSV 가져오기','import','ux-text-button')}</div></aside><div class="ux-detail">${P.importing?importPanel():''}${P.errors.length?`<div class="ux-errors" role="alert"><strong>다음 내용을 확인해 주세요.</strong><ul>${P.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}${P.step===0?infoPanel(p):P.step===1?assetPanel(p):reviewPanel()}<div class="ux-bottom"><span>${P.step<2?`${P.active+1} / ${P.draft.products.length}개 상품`:'등록 전 내용을 확인해 주세요.'}</span><div class="ux-inline">${P.step? action('이전','previous','ux-button ux-secondary'):action('임시 저장','save','ux-button ux-secondary')}${P.step<2?action('다음 단계','next'):action(P.busy?'제출 중…':'상품 '+P.draft.products.length+'개 제출','submit','ux-button',P.busy?'disabled':'')}</div></div></div></div>`;
 if(P.busy)mount.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=true);
}
function field(f,p){const value=p.data[f.id]??'';const attrs=`id="ux-field-${esc(f.id)}" data-field="${esc(f.id)}" ${f.required?'aria-required="true"':''}`;let control;
 if(f.type==='select')control=`<select ${attrs}><option value="">선택해 주세요</option>${String(f.options||'').split('|').filter(Boolean).map(o=>`<option value="${esc(o)}" ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 else if(f.type==='textarea')control=`<textarea ${attrs} rows="4" placeholder="${esc(f.help||'')}">${esc(value)}</textarea>`;
 else control=`<input ${attrs} type="${f.type==='url'?'url':'text'}" ${f.type==='number'?'inputmode="decimal"':''} value="${esc(value)}" placeholder="${f.type==='number'?'숫자만 입력':esc(f.help||'')}" autocomplete="off">`;
 return `<div class="ux-field ${f.type==='textarea'?'full':''}"><label for="ux-field-${esc(f.id)}">${esc(f.label)} ${f.required?'<em>필수</em>':'<span>선택</span>'}</label>${control}${f.type==='number'&&/가격|가$/.test(f.label)?'<small>원 단위 · 쉼표를 포함해 입력해도 됩니다.</small>':f.help?`<small>${esc(f.help)}</small>`:''}</div>`;
}
function infoPanel(p){const fields=State.bootstrap.fields.filter(f=>f.active!==false&&!['main_image_url','detail_page_url'].includes(f.id));return `<div class="ux-panel-heading"><div><h3>${esc(productName(p,P.active))}</h3><p>필수 항목부터 입력하세요. 이미지는 다음 단계에서 추가합니다.</p></div><div class="ux-inline">${action('복제','duplicate','ux-text-button')}${action('삭제','removeProduct','ux-text-button ux-danger')}</div></div><div class="ux-form">${fields.filter(f=>f.required).map(f=>field(f,p)).join('')}</div>${fields.some(f=>!f.required)?`<details class="ux-optional" open><summary>추가 상품정보 <span>선택 항목</span></summary><div class="ux-form">${fields.filter(f=>!f.required).map(f=>field(f,p)).join('')}</div></details>`:''}`;}
function importPanel(){return `<div class="ux-import"><div class="ux-panel-heading"><div><h3>상품표 가져오기</h3><p>첫 행에 상품 항목명을 넣어 주세요. 가져온 내용은 화면에서 수정할 수 있습니다.</p></div>${action('닫기','closeImport','ux-text-button')}</div><div class="ux-inline"><label class="ux-button ux-secondary">엑셀·CSV 선택<input data-import type="file" accept=".xlsx,.csv" class="ux-sr-only"></label>${action('CSV 양식 다운로드','template','ux-text-button')}</div><small>최대 8MB · XLSX / UTF-8 CSV · 최대 300개 상품</small></div>`;}
function dropzone(category,description,accept){return `<div class="ux-drop" data-drop="${category}"><span class="ux-drop-symbol">＋</span><strong>${category}</strong><p>${description}</p><label class="ux-button ux-secondary">파일 선택<input type="file" data-files="${category}" accept="${accept}" ${category==='대표 이미지'?'':'multiple'} class="ux-sr-only"></label><small>여기로 끌어놓아도 됩니다 · 파일당 8MB</small></div>`;}
function assetPanel(p){return `<div class="ux-panel-heading"><div><h3>${esc(productName(p,P.active))}의 이미지와 상세페이지</h3><p>상품과 자동으로 연결됩니다. 상품명이나 ID를 다시 입력할 필요가 없습니다.</p></div></div><div class="ux-upload-grid">${dropzone('대표 이미지','상품을 가장 잘 보여주는 이미지 한 장','.jpg,.jpeg,.png,.webp')}${dropzone('추가 이미지','여러 장을 한 번에 선택하세요','.jpg,.jpeg,.png,.webp')}</div><div class="ux-asset-list">${p.assets.filter(a=>['대표 이미지','추가 이미지'].includes(a.category)).map(a=>assetCard(a,p)).join('')}</div><div class="ux-detail-block"><h4>상세페이지</h4><p>기존 페이지 링크를 입력하거나 이미지·PDF를 올려주세요. 둘 다 등록할 수도 있습니다.</p><div class="ux-field"><label for="ux-detail-url">기존 상세페이지 링크 <span>선택</span></label><input id="ux-detail-url" data-detail-url type="url" placeholder="브랜드 공식몰 상품 주소를 입력해 주세요" value="${esc(p.detailUrl)}"><small>링크는 검토 자료로 전달되며, 원본 이미지를 자동으로 가져오지는 않습니다.</small></div>${dropzone('상세페이지','상세 이미지 여러 장 또는 PDF · 아래 순서대로 전달됩니다.','.jpg,.jpeg,.png,.webp,.pdf')}<div class="ux-asset-list">${p.assets.filter(a=>a.category==='상세페이지').map(a=>assetCard(a,p)).join('')}</div></div><details class="ux-optional"><summary>기타 자료 <span>소개서·인증서 등 선택</span></summary>${dropzone('기타','필요한 자료만 첨부하세요','.jpg,.jpeg,.png,.webp,.pdf')}<div class="ux-asset-list">${p.assets.filter(a=>a.category==='기타').map(a=>assetCard(a,p)).join('')}</div></details><p class="ux-hint">선택한 파일은 제출할 때 업로드됩니다. 창을 닫기 전 ‘첨부파일 먼저 저장’을 누르면 파일도 보관됩니다. 저장 전 파일은 다시 선택해야 합니다.</p>${action('첨부파일 먼저 저장','upload','ux-button ux-secondary')}`;}
function assetCard(a,p){const i=p.assets.indexOf(a);const preview=P.previews.get(a.id);return `<article class="ux-asset"><div class="ux-thumb">${preview?`<img src="${preview}" alt="${esc(a.name)}">`:'<span>'+(/pdf/i.test(a.mime||'')?'PDF':'IMG')+'</span>'}</div><div class="ux-asset-info"><strong>${esc(a.name)}</strong><small>${a.category} · ${Math.round((a.size||0)/1024).toLocaleString()}KB</small><span class="ux-file-status ${['error','missing'].includes(a.status)?'bad':''}" data-status-id="${a.id}">${esc(statusText(a))}</span>${a.status==='done'&&safeUrl(a.url)?`<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">저장된 파일 보기</a>`:''}</div><div class="ux-asset-controls">${action('↑','up','ux-icon-button',`data-index="${i}" aria-label="${esc(a.name)} 순서 위로"`)}${action('↓','down','ux-icon-button',`data-index="${i}" aria-label="${esc(a.name)} 순서 아래로"`)}${action('삭제','removeAsset','ux-text-button',`data-index="${i}"`)}</div></article>`;}
function statusText(a){if(a.status==='done')return '저장 완료'+(a.uploadBytes?' · '+humanBytes_(a.uploadBytes):'');if(a.status==='uploading')return '업로드 중…'+(a.uploadProgress?' · '+a.uploadProgress:'');return a.status==='queued'?'업로드 대기':a.error||'파일을 다시 선택해 주세요.';}
function issues(){const out=[];P.draft.products.forEach((p,i)=>{const name=productName(p,i);State.bootstrap.fields.filter(f=>f.active!==false).forEach(f=>{let v=p.data[f.id];if(f.id==='main_image_url')v=p.assets.some(a=>a.category==='대표 이미지');if(f.id==='detail_page_url')v=p.detailUrl||p.assets.some(a=>a.category==='상세페이지');if(f.required&&(v===false||!String(v??'').trim()))out.push(`${name}: ${f.label}을(를) 입력해 주세요.`);if(v&&f.type==='number'&&!Number.isFinite(Number(String(v).replace(/,/g,''))))out.push(`${name}: ${f.label}은(는) 숫자로 입력해 주세요.`);if(v&&f.type==='url'&&typeof v==='string'&&!safeUrl(v))out.push(`${name}: ${f.label} 주소를 확인해 주세요.`);});if(p.detailUrl&&!safeUrl(p.detailUrl))out.push(`${name}: 상세페이지 링크를 확인해 주세요.`);p.assets.filter(a=>a.status==='missing').forEach(a=>out.push(`${name}: ${a.name} 파일을 다시 선택해 주세요.`));});return out;}
function reviewPanel(){return `<div class="ux-panel-heading"><div><h3>마지막으로 확인해 주세요</h3><p>작성 중인 ${P.draft.products.length}개 상품을 함께 제출합니다.</p></div></div><div class="ux-review-list">${P.draft.products.map((p,i)=>`<article><div><strong>${esc(productName(p,i))}</strong><p>${esc(p.data.option_name||'기본 옵션')} · ${esc(p.data.category||'분류 미입력')}</p><p>소비자가 ${esc(p.data.retail_price||'미입력')} · 첨부 ${p.assets.length}개 · 상세 링크 ${p.detailUrl?'있음':'없음'}</p>${!p.assets.some(a=>a.category==='대표 이미지')?'<small class="ux-amber">대표 이미지가 없습니다. 필요 시 담당자가 보완을 요청할 수 있습니다.</small>':''}</div>${action('수정','edit','ux-button ux-secondary',`data-index="${i}"`)}</article>`).join('')}</div><div class="ux-form"><div class="ux-field"><label for="ux-contact">제출 담당자 <span>선택</span></label><input id="ux-contact" data-contact="contactName" value="${esc(P.draft.contactName||'')}" autocomplete="name"></div><div class="ux-field"><label for="ux-phone">연락처 <span>선택</span></label><input id="ux-phone" data-contact="contactPhone" value="${esc(P.draft.contactPhone||'')}" autocomplete="tel" inputmode="tel"></div></div><p class="ux-hint">전송 중에는 창을 닫지 마세요. 실패한 경우 이미 저장된 파일은 유지하고 남은 작업만 다시 시도합니다.</p>`;}
function onInput(e){const t=e.target;if(P.busy)return;if(t.dataset.field){current().data[t.dataset.field]=t.value;save();}else if(t.hasAttribute('data-detail-url')){current().detailUrl=t.value;save();}else if(t.dataset.contact){P.draft[t.dataset.contact]=t.value;save();}}
function onChange(e){const t=e.target;if(P.busy)return;if(t.dataset.files){addFiles([...t.files],t.dataset.files);t.value='';}if(t.hasAttribute('data-import'))importFile(t.files[0]);}
async function onAction(e){const b=e.target.closest('[data-action]');if(!b||P.busy)return;const act=b.dataset.action,i=Number(b.dataset.index);P.errors=[];switch(act){
case 'add':if(P.draft.products.length>=300)return UI.toast('한 번에 300개까지 등록할 수 있습니다.',true);P.draft.products.push(makeProduct());P.active=P.draft.products.length-1;P.step=0;P.importing=false;break;
case 'select':P.active=i;break;
case 'step':if(!P.draft.products.length)return;P.step=i;break;
case 'next':P.step=Math.min(2,P.step+1);break;
case 'previous':P.step=Math.max(0,P.step-1);break;
case 'edit':P.active=i;P.step=0;break;
case 'duplicate':if(P.draft.products.length>=300)return;const copy=makeProduct({...current().data,barcode:'',product_id:''});copy.data.product_name=(copy.data.product_name||'상품')+' (복사)';P.draft.products.push(copy);P.active=P.draft.products.length-1;break;
case 'removeProduct':if(P.removePending!==current().id){P.removePending=current().id;b.textContent='삭제 확인';return;}P.removePending='';current().assets.forEach(release);P.draft.products.splice(P.active,1);P.active=Math.max(0,P.active-1);break;
case 'removeAsset':release(current().assets[i]);current().assets.splice(i,1);break;
case 'up':case 'down':{const a=current().assets,dir=act==='up'?-1:1;let at=i+dir;while(at>=0&&at<a.length&&a[at].category!==a[i].category)at+=dir;if(at>=0&&at<a.length)[a[i],a[at]]=[a[at],a[i]];break;}
case 'import':P.importing=true;break;
case 'closeImport':P.importing=false;break;
case 'template':await downloadTemplate();return;
case 'save':save();UI.toast(P.storage?'작성 내용을 이 브라우저에 저장했습니다. 파일은 별도로 저장해 주세요.':'임시 저장을 사용할 수 없습니다.',!P.storage);return;
case 'upload':await uploadAll();return;
case 'submit':await submit();return;
case 'refresh':await refresh();return;
case 'view':viewSubmission(latest()[i]);return;
case 'revise':{const s=latest()[i];if(P.draft.products.some(p=>p.sourceSubmissionId===s.submissionId)){P.active=P.draft.products.findIndex(p=>p.sourceSubmissionId===s.submissionId);}else{P.draft.products.push({id:s.productId,data:{...s.data},detailUrl:s.data.detail_page_url||'',assets:(s.data.attachments||[]).map(a=>({...a,status:'done'})),sourceSubmissionId:s.submissionId,changeRequest:s.status==='승인 완료'});P.active=P.draft.products.length-1;}P.step=0;break;}
}save();paintEditor();updateSteps();}
function updateSteps(){$$('.ux-steps button').forEach((b,i)=>{b.classList.toggle('active',i===P.step);b.setAttribute('aria-current',i===P.step?'step':'false');});}
function release(a){P.files.delete(a.id);const url=P.previews.get(a.id);if(url)URL.revokeObjectURL(url);P.previews.delete(a.id);}
function addFiles(files,category){const p=current();if(!p)return;const errors=[];for(const file of files){if(p.assets.length>=50){errors.push('상품당 첨부파일은 최대 50개입니다.');break;}const ext=file.name.split('.').pop().toLowerCase();const mime={'jpg':'image/jpeg','jpeg':'image/jpeg','png':'image/png','webp':'image/webp','pdf':'application/pdf'}[ext];if(!mime||(category.includes('이미지')&&mime==='application/pdf')){errors.push(file.name+': 지원하지 않는 형식입니다.');continue;}if(!file.size||file.size>MAX){errors.push(file.name+': 파일은 0MB 초과, 8MB 이하로 선택해 주세요.');continue;}const old=p.assets.find(a=>a.category===category&&a.name===file.name&&a.size===file.size);if(category==='대표 이미지'&&p.assets.some(a=>a.category===category)&&!(old&&old.status==='missing')){errors.push('대표 이미지는 한 장입니다. 기존 파일을 삭제한 뒤 선택해 주세요.');continue;}if(old&&old.status!=='missing'){errors.push(file.name+': 이미 선택한 파일입니다.');continue;}const a=old||{id:uid(),name:file.name,size:file.size,mime,category};a.status='queued';a.error='';P.files.set(a.id,file);if(mime.startsWith('image/')){const oldUrl=P.previews.get(a.id);if(oldUrl)URL.revokeObjectURL(oldUrl);P.previews.set(a.id,URL.createObjectURL(file));}if(!old)p.assets.push(a);}P.errors=errors;save();paintEditor();}
function humanBytes_(bytes){if(!bytes)return '0KB';if(bytes<1048576)return Math.max(1,Math.round(bytes/1024))+'KB';return (bytes/1048576).toFixed(1)+'MB';}
function canvasBlob_(canvas,type,quality){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('이미지를 최적화하지 못했습니다.')),type,quality));}
async function optimizePartnerFile_(file,category){
  const original={blob:file,fileName:file.name,mimeType:file.type,originalBytes:file.size,uploadBytes:file.size};
  if(!file||!category.includes('이미지')||!/^image\/(jpeg|png|webp)$/.test(file.type))return original;
  let bitmap;
  try{
    bitmap=await createImageBitmap(file);
    const maxSide=2000,scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
    if(scale===1&&file.size<=900*1024)return original;
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const ctx=canvas.getContext('2d',{alpha:true});ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
    const blob=await canvasBlob_(canvas,'image/webp',.84);
    if(blob.size>=file.size)return original;
    return {blob,fileName:file.name.replace(/\.[^.]+$/, '')+'.webp',mimeType:'image/webp',originalBytes:file.size,uploadBytes:blob.size};
  }catch(e){return original;}finally{if(bitmap&&bitmap.close)bitmap.close();}
}
async function uploadAll(inSubmit=false){
  if(!inSubmit){P.busy=true;paintEditor();}
  let ok=true,cursor=0;const tasks=[];
  for(const p of P.draft.products)for(const a of p.assets){
    if(a.status==='done')continue;
    const file=P.files.get(a.id);
    if(!file){a.status='missing';a.error='파일을 다시 선택해 주세요.';ok=false;setFileStatus(a);continue;}
    a.status='queued';a.error='';tasks.push({p,a,file});setFileStatus(a);
  }
  const run=async task=>{const {p,a,file}=task;try{
    a.status='uploading';a.uploadProgress='최적화 중';setFileStatus(a);
    const optimized=await optimizePartnerFile_(file,a.category);
    a.uploadProgress=optimized.uploadBytes<optimized.originalBytes?'최적화 '+humanBytes_(optimized.originalBytes)+' → '+humanBytes_(optimized.uploadBytes):humanBytes_(optimized.uploadBytes);
    setFileStatus(a);
    const base64=await fileBase64(optimized.blob);
    const r=await server('uploadPartnerAsset',{token:State.token,uploadId:a.id,productId:p.id,category:a.category,fileName:optimized.fileName,mimeType:optimized.mimeType,base64});
    if(!r.ok)throw new Error('저장 결과를 확인하지 못했습니다.');
    a.idOriginal=a.id;a.fileId=r.id;a.url=r.url;a.status='done';a.uploadBytes=optimized.uploadBytes;a.originalBytes=optimized.originalBytes;a.error='';save();
  }catch(e){a.status='error';a.error=e.message;ok=false;}setFileStatus(a);};
  async function worker(){while(cursor<tasks.length){const task=tasks[cursor++];await run(task);}}
  await Promise.all(Array.from({length:Math.min(3,tasks.length)},worker));
  if(!inSubmit){P.busy=false;save();paintEditor();UI.toast(ok?'첨부파일을 저장했습니다. 상품 제출은 마지막 단계에서 완료해 주세요.':'저장하지 못한 파일을 확인해 주세요.',!ok);}
  return ok;
}
function setFileStatus(a){const el=$(`[data-status-id="${a.id}"]`);if(el)el.textContent=statusText(a);}
async function submit(){P.errors=issues();if(P.errors.length){paintEditor();return;}P.busy=true;paintEditor();try{if(!await uploadAll(true))throw new Error('저장하지 못한 파일이 있습니다. 이미지·상세페이지 단계에서 확인한 뒤 다시 제출해 주세요.');const payload={token:State.token,requestId:P.draft.requestId,contactName:P.draft.contactName,contactPhone:P.draft.contactPhone,products:P.draft.products.map(p=>({id:p.id,data:p.data,sourceSubmissionId:p.sourceSubmissionId,detailUrl:p.detailUrl,assets:p.assets.map(a=>({id:a.fileId||a.id}))}))};const result=await server('submitPartnerDraft',payload);if(!result.ok){P.errors=(result.validationErrors||[]).map(e=>`${e.row}번째 상품: ${e.message}`);return;}P.notice=`${result.count}개 상품을 제출했습니다. 담당자가 검토 후 안내해 드립니다.`;P.draft.products.forEach(p=>p.assets.forEach(release));P.draft=fresh();P.active=0;P.step=0;save();await refresh();}catch(e){P.errors=[e.message];}finally{P.busy=false;paint();}}
async function refresh(){try{const r=await server('getAppBootstrap',{view:'partner',token:State.token});if(!r.ok)throw new Error(r.message);State.bootstrap=r;paint();}catch(e){UI.toast('현황을 새로고침하지 못했습니다. '+e.message,true);}}
function viewSubmission(s){const entries=Object.entries(s.data||{}).filter(([k,v])=>!k.startsWith('_')&&!Array.isArray(v)&&typeof v!=='object');UI.modal(`<h2>${esc(s.data.product_name||'제출 상품')}</h2><p>${esc(s.status)} · ${esc(s.updatedAt)}</p><dl class="ux-submission-data">${entries.map(([k,v])=>`<dt>${esc(State.bootstrap.fields.find(f=>f.id===k)?.label||({'main_image_url':'대표 이미지','detail_page_url':'상세페이지','product_id':'상품번호'}[k])||k)}</dt><dd>${safeUrl(v)?`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">자료 열기</a>`:esc(v)}</dd>`).join('')}</dl><h3>첨부파일</h3>${(s.data.attachments||[]).map(a=>`<p>${esc(a.category)} · <a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">${esc(a.name)}</a></p>`).join('')||'<p>등록된 첨부파일이 없습니다.</p>'}<div class="modal-actions"><button class="secondary-button" onclick="UI.closeModal()">닫기</button></div>`);}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw new Error('CSV의 따옴표가 닫히지 않았습니다.');if(cell||row.length){row.push(cell);rows.push(row);}return rows;}
async function importFile(file){if(!file)return;if(file.size>MAX){P.errors=['상품표는 8MB 이하로 선택해 주세요.'];paintEditor();return;}P.busy=true;paintEditor();try{let products;if(/\.csv$/i.test(file.name)){const rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));const fields=State.bootstrap.fields;const head=rows.shift()||[];if(!head.some(h=>h.trim()==='product_name'||h.trim()===(fields.find(f=>f.id==='product_name')?.label||'상품명')))throw new Error('첫 행에 상품명 열이 있어야 합니다. CSV 양식을 사용해 주세요.');products=rows.filter(r=>r.some(v=>v.trim())).map(r=>{const p={};fields.forEach(f=>{const i=head.findIndex(h=>[f.id,f.label].includes(h.trim()));if(i>=0)p[f.id]=r[i]||'';});return p;});}else if(/\.xlsx$/i.test(file.name)){const r=await server('importProductWorkbook',{token:State.token,fileName:file.name,base64:await fileBase64(file)});products=r.products||[];}else throw new Error('XLSX 또는 CSV 파일을 선택해 주세요.');if(!products.length)throw new Error('가져올 상품이 없습니다.');if(P.draft.products.length+products.length>300)throw new Error('작성 중인 상품을 포함해 최대 300개입니다.');const start=P.draft.products.length;products.forEach(d=>P.draft.products.push(makeProduct(d)));P.active=start;P.step=0;P.importing=false;save();UI.toast(`${products.length}개 상품을 가져왔습니다. 내용을 확인하고 이미지를 추가해 주세요.`);}catch(e){P.errors=[e.message];}finally{P.busy=false;paintEditor();updateSteps();}}
window.addEventListener('beforeunload',e=>{if(P.busy||(!P.storage&&P.draft?.products.length)||P.draft?.products.some(p=>p.assets.some(a=>a.status!=='done'))){e.preventDefault();e.returnValue='';}});
})();</script>
