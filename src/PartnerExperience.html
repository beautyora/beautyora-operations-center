
<script>(function partnerExperience(){
'use strict';
const MAX=8*1024*1024, CATEGORIES=['대표 이미지','추가 이미지','상세페이지','기타'];
const P={draft:null,step:0,active:0,busy:false,files:new Map(),previews:new Map(),errors:[],saved:'',notice:'',storage:true,importing:false,filter:'all',query:'',productQuery:'',productStatus:'all',screen:'catalog',editorFrom:'catalog',selected:new Set(),validate:false,documents:null,documentNotice:'',documentPending:null,layout:localStorage.getItem('beautyora-catalog-layout')==='list'?'list':'cards'};
const uid=()=>crypto.randomUUID();
const safeUrl=v=>/^https?:\/\/[^\s]+$/i.test(String(v||''))?String(v):'';
const imageUrl=v=>{const url=String(v||'').startsWith('blob:')?String(v):safeUrl(v);if(!url)return '';let id='';try{const u=new URL(url);if(/(^|\.)drive\.google\.com$/.test(u.hostname)){id=u.searchParams.get('id')||u.pathname.match(/\/d\/([^/]+)/)?.[1]||'';}}catch(e){}return id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w320`:url;};
const imageHtml=(url,alt='')=>url?`<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.hidden=true;this.parentElement.classList.add('ux-image-unavailable')">`:'이미지';
const key=()=> 'beautyora-draft-v2:'+State.token;
const fresh=()=>({version:2,requestId:uid(),products:[],contactName:'',contactPhone:''});
const makeProduct=(data={})=>({id:'PRD-'+uid(),data:{...data},assets:[],detailUrl:data.detail_page_url||'',sourceSubmissionId:''});
const current=()=>P.draft.products[P.active];
const productName=(p,i)=>p.data.product_name||`상품 ${i+1}`;
function latest(){const seen=new Set();return (State.bootstrap.submissions||[]).filter(s=>{const k=s.productId||s.submissionId;if(seen.has(k))return false;seen.add(k);return true;});}
function save(){try{localStorage.setItem(key(),JSON.stringify(P.draft));P.saved=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});P.storage=true;}catch(e){P.storage=false;}const el=$('#uxSave');if(el)el.textContent=P.storage?`${P.saved} · 이 브라우저에 임시 저장됨`:'임시 저장을 사용할 수 없습니다. 창을 닫지 마세요.';}
function restore(){P.draft=fresh();try{const d=JSON.parse(localStorage.getItem(key())||'null');if(d&&d.version===2&&Array.isArray(d.products)){P.draft=d;P.draft.products.forEach(p=>p.assets.forEach(a=>{if(a.status!=='done'){a.status='missing';a.error='파일을 다시 선택해 주세요.';}}));}}catch(e){P.storage=false;}}
renderPartner=function(data){State.bootstrap=data;document.title='뷰티오라 · 브랜드 상품등록';$('#app').className='ux-app';$('#sidebar')?.remove();$('.topbar')?.remove();$('.main').className='ux-main';$('#content').className='ux-content';restore();paint();};
function action(label,act,cls='ux-button',extra=''){return `<button type="button" class="${cls}" data-action="${act}" ${extra}>${label}</button>`;}
function saveLabel(){return P.storage?`${P.saved?P.saved+' · ':''}작성 내용은 이 브라우저에 저장됨`:'임시 저장 불가 · 창을 닫지 마세요';}
function productIssues(p){
 const out=[];const add=(field,message,step=0)=>out.push({field,message,step});
 for(const f of State.bootstrap.fields.filter(f=>f.active!==false)){
  let v=p.data[f.id],step=0;
  if(f.id==='main_image_url'){v=p.assets.some(a=>a.category==='대표 이미지')||(p.sourceSubmissionId&&safeUrl(p.data.main_image_url));step=1;}
  if(f.id==='detail_page_url'){v=p.detailUrl||p.assets.some(a=>a.category==='상세페이지');step=1;}
  if(f.required&&(v===false||!String(v??'').trim()))add(f.id,`${f.label}: 필수 항목입니다.`,step);
  else if(v&&f.type==='number'&&!Number.isFinite(Number(String(v).replace(/,/g,''))))add(f.id,`${f.label}: 숫자로 입력해 주세요.`);
  else if(v&&f.type==='url'&&typeof v==='string'&&!safeUrl(v))add(f.id,`${f.label} 주소를 확인해 주세요.`,step);
 }
 if(p.detailUrl&&!safeUrl(p.detailUrl)&&!out.some(e=>e.field==='detail_page_url'))add('detail_page_url','상세페이지 주소를 확인해 주세요.',1);
 p.assets.filter(a=>a.status==='missing'||a.status==='error').forEach(a=>add('assets',a.name+': '+(a.error||'파일을 다시 선택해 주세요.'),1));
 return out;
}
function progress(p){const errors=productIssues(p);return errors.length?errors[0].message:p.assets.some(a=>a.status!=='done')?'이미지 저장 필요':'제출 준비 완료';}
function selectedProducts(){return P.draft.products.filter(p=>P.selected.has(p.id));}
function paint(){
 const brand=State.bootstrap.brand;
 $('#content').innerHTML=`<div class="ux-wrap ux-center"><header class="ux-header"><div class="brand-lockup"><span class="brand-mark">B</span><div><strong>BEAUTYORA</strong><small>상품등록센터</small></div></div><span class="ux-brand">${esc(brand.brandName)}</span></header><nav class="ux-center-nav" aria-label="등록센터 메뉴">${action('내 상품','catalog',`ux-nav-button ${P.screen==='catalog'||P.screen==='editor'&&P.editorFrom==='catalog'?'active':''}`)}${action('제출 현황','submissions',`ux-nav-button ${P.screen==='submissions'||P.screen==='editor'&&P.editorFrom==='submissions'?'active':''}`)}${action('브랜드 자료','documents',`ux-nav-button ${P.screen==='documents'?'active':''}`)}</nav>${P.notice?`<div class="ux-success" role="status">${esc(P.notice)}</div>`:''}<div id="uxScreen">${P.screen==='editor'?editorShell():P.screen==='documents'?documentPanel():P.screen==='submissions'?submissionsPanel():catalogPanel()}</div><footer class="ux-footer">BEAUTYORA · 제출한 자료는 운영 담당자가 확인합니다.</footer></div>`;
 const root=$('#content');root.onclick=onAction;root.oninput=onInput;root.onchange=onChange;
 root.ondragover=e=>{const box=e.target.closest('[data-drop]');if(box&&!P.busy){e.preventDefault();box.classList.add('dragover');}};
 root.ondragleave=e=>e.target.closest('[data-drop]')?.classList.remove('dragover');
 root.ondrop=e=>{const box=e.target.closest('[data-drop]');if(box){e.preventDefault();box.classList.remove('dragover');if(!P.busy)addFiles([...e.dataTransfer.files],box.dataset.drop);}};
 if(P.screen==='editor')paintEditor();
 if(P.busy)root.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=true);
}
function catalogPanel(){
 const products=State.bootstrap.products||[],count=products.length;
 return `<section class="ux-catalog-hero"><div><span class="ux-eyebrow">MY PRODUCTS</span><h1>내 상품</h1><p>브랜드에 등록된 상품을 검색하고 상태에 맞게 관리하세요.</p></div><div class="ux-inline">${action('엑셀로 여러 상품 등록','import','ux-button ux-secondary')}${action('+ 새 상품 등록','add')}</div></section><section class="ux-history ux-products-panel"><div class="ux-catalog-head"><div><h2>상품 목록 <small>${count}개</small></h2><p class="ux-muted">상품 정보와 현재 상태를 확인하세요. 제출 과정은 ‘제출 현황’에서 볼 수 있습니다.</p></div><div class="ux-catalog-controls"><label class="ux-search"><span aria-hidden="true">⌕</span><input data-product-search aria-label="내 상품 검색" placeholder="상품명·옵션·바코드 검색" value="${esc(P.productQuery)}"></label><select data-product-status aria-label="상품 상태 필터"><option value="all" ${P.productStatus==='all'?'selected':''}>전체 상태</option><option value="review" ${P.productStatus==='review'?'selected':''}>검수 중</option><option value="보완 필요" ${P.productStatus==='보완 필요'?'selected':''}>보완 필요</option><option value="승인 완료" ${P.productStatus==='승인 완료'?'selected':''}>승인 완료</option></select>${action('새로고침','refresh','ux-text-button')}</div></div><div id="uxProductList" class="ux-product-list">${productList()}</div></section>${P.importing?importPanel():''}${P.errors.length?`<div class="ux-errors" role="alert">${P.errors.map(esc).join('<br>')}</div>`:''}`;
}
function productList(){
 const all=State.bootstrap.products||[],q=P.productQuery.trim().toLowerCase();
 const rows=all.filter(p=>{const d=p.data||{},status=p.status||'';return (P.productStatus==='all'||P.productStatus==='review'&&['신규 제출','검수 중'].includes(status)||status===P.productStatus)&&(!q||[d.product_name,d.option_name,d.barcode,d.category].join(' ').toLowerCase().includes(q));});
 if(!rows.length)return `<div class="ux-empty">${all.length?'검색 조건에 맞는 상품이 없습니다.':'등록된 상품이 없습니다. 새 상품을 등록해 주세요.'}</div>`;
 return rows.map(p=>{const d=p.data||{},name=d.product_name||'이름 없는 상품',status=p.status==='신규 제출'?'검수 중':p.status||'상태 확인 중';const label=status==='보완 필요'?'보완하기':status==='승인 완료'?'수정 요청':'제출 내용 보기';return `<article class="ux-product-row"><span class="ux-product-row-thumb">${imageHtml(imageUrl(d.main_image_url),name)}</span><div class="ux-product-row-main"><strong>${esc(name)}</strong><small>${esc(d.option_name||'기본 옵션')} · ${esc(d.barcode||'바코드 미등록')}</small></div><span class="ux-state ${status.includes('보완')?'warning':''}">${esc(status)}</span>${action(label,'manageProduct','ux-button ux-secondary',`data-product-id="${esc(p.productId)}"`)}</article>`}).join('');
}
function submissionsPanel(){
 const rows=latest(),drafts=P.draft.products,revision=rows.filter(s=>s.status==='보완 필요');
 const tabs=[['all','전체'],['draft','작성 중'],['보완 필요','보완 필요'],['review','검수 중'],['승인 완료','승인 완료']];
 const visible=rows.filter(s=>!drafts.some(p=>p.id===s.productId));const count=k=>k==='all'?drafts.length+visible.length:k==='draft'?drafts.length:k==='review'?visible.filter(s=>['신규 제출','검수 중'].includes(s.status)).length:visible.filter(s=>s.status===k).length+(k==='보완 필요'?drafts.filter(p=>p.sourceSubmissionId&&!p.changeRequest).length:0);
 return `<section class="ux-catalog-hero"><div><span class="ux-eyebrow">SUBMISSION STATUS</span><h1>제출 현황</h1><p>작성 중인 상품과 제출한 상품의 검수 결과를 확인하세요.</p></div><div class="ux-inline">${action('엑셀로 여러 상품 등록','import','ux-button ux-secondary')}${action('+ 새 상품 등록','add')}</div></section>${revision.length?`<aside class="ux-attention"><div><strong>보완이 필요한 상품 ${revision.length}개</strong><p>담당자의 요청을 확인하고 해당 상품만 다시 제출하세요.</p></div>${action('보완할 상품 보기','filter','ux-button ux-secondary','data-filter="보완 필요"')}</aside>`:''}<section class="ux-history"><div class="ux-catalog-head"><div><h2>현재 제출 상태</h2><p class="ux-muted">작성 중인 상품은 이 브라우저에서만 이어서 작성할 수 있습니다.</p></div><div class="ux-catalog-controls"><label class="ux-search"><span aria-hidden="true">⌕</span><input data-search aria-label="제출 상품 검색" placeholder="상품명 또는 옵션 검색" value="${esc(P.query)}"></label>${action('카드','layout','ux-layout-button '+(P.layout==='cards'?'active':''),'data-layout="cards" aria-pressed="'+(P.layout==='cards')+'"')}${action('목록','layout','ux-layout-button '+(P.layout==='list'?'active':''),'data-layout="list" aria-pressed="'+(P.layout==='list')+'"')}${action('새로고침','refresh','ux-text-button')}</div></div><div class="ux-filter-row" aria-label="제출 상태">${tabs.map(([k,l])=>action(`${l} <b>${count(k)}</b>`,'filter',`ux-filter-chip ${P.filter===k?'active':''}`,`data-filter="${k}" aria-pressed="${P.filter===k}"`)).join('')}</div>${P.importing?importPanel():''}${P.errors.length?`<div class="ux-errors" role="alert">${P.errors.map(esc).join('<br>')}</div>`:''}<div class="ux-catalog-grid ${P.layout==='list'?'ux-catalog-list':''}" id="uxCatalog">${catalogCards()}</div><div class="ux-selection-bar"><span id="uxSelectionCount">작성 중 상품 ${selectedProducts().length}개 선택</span><div class="ux-inline">${action('제출 가능한 상품 선택','selectReady','ux-button ux-secondary')}${action('선택 상품 제출 확인','reviewSelected','ux-button',selectedProducts().length?'':'disabled')}</div></div></section>`;
}
function catalogCards(){
 const drafts=P.draft.products,rows=latest();
 const entries=[...drafts.map((p,i)=>({p,i,draft:true})),...rows.map((s,i)=>({s,i,draft:false})).filter(e=>!drafts.some(p=>p.id===e.s.productId))];
 const filtered=entries.filter(e=>{const status=e.draft?'draft':e.s.status;const match=P.filter==='all'||P.filter===status||(P.filter==='review'&&['신규 제출','검수 중'].includes(status))||(P.filter==='보완 필요'&&e.draft&&e.p.sourceSubmissionId&&!e.p.changeRequest);const data=e.draft?e.p.data:e.s.data;return match&&`${data.product_name||''} ${data.option_name||''}`.toLowerCase().includes(P.query.toLowerCase());});
 if(!filtered.length)return `<div class="ux-empty">${entries.length?'조건에 맞는 상품이 없습니다. 다른 상태나 검색어를 선택해 주세요.':'아직 등록한 상품이 없습니다. ‘새 상품 등록’으로 시작하세요.'}</div>`;
 return filtered.map(e=>{
 const p=e.p,s=e.s,data=e.draft?p.data:s.data,name=data.product_name||'이름 없는 상품';
 const asset=e.draft?p.assets.find(a=>a.category==='대표 이미지'):null;
 const rawImg=e.draft?(asset&&(P.previews.get(asset.id)||safeUrl(asset.url)))||safeUrl(data.main_image_url):safeUrl(data.main_image_url);const img=imageUrl(rawImg);
 const status=e.draft?(p.changeRequest?'수정 요청 작성 중':p.sourceSubmissionId?'보완 작성 중':'작성 중'):(s.status==='신규 제출'?'검수 중':s.status);
 return `<article class="ux-catalog-card"><div class="ux-catalog-thumb">${imageHtml(img,name)}</div><div class="ux-catalog-main"><div class="ux-catalog-top"><strong>${esc(name)}</strong><span class="ux-state ${status.includes('보완')?'warning':''}">${esc(status)}</span></div><p>${esc(data.option_name||'기본 옵션')}</p><div class="ux-catalog-actions">${e.draft?action('이어서 작성','select','ux-button ux-secondary',`data-index="${e.i}"`):action(s.status==='보완 필요'?'보완하기':s.status==='승인 완료'?'수정 요청':'제출 내용 보기',s.status==='보완 필요'||s.status==='승인 완료'?'revise':'view',`ux-button ${s.status==='보완 필요'?'':'ux-secondary'}`,`data-index="${e.i}"`)}</div></div>${e.draft?`<div class="ux-card-next"><span>${esc(progress(p))}</span><label><input type="checkbox" data-select-product="${esc(p.id)}" ${P.selected.has(p.id)?'checked':''} aria-label="${esc(name)} 제출 선택"> 제출 선택</label></div>`:s.reviewNote?`<div class="ux-catalog-note"><strong>담당자 안내</strong> ${esc(s.reviewNote)}</div>`:''}</article>`;
 }).join('');
}
function editorShell(){return `<section class="ux-workspace"><div class="ux-editor-top">${action(P.editorFrom==='submissions'?'← 제출 현황':'← 상품 목록','returnFromEditor','ux-text-button')}<span id="uxSave" class="ux-muted" role="status">${esc(saveLabel())}</span></div><div class="ux-steps" aria-label="상품 등록 단계">${['기본정보','이미지·상세페이지','제출 확인'].map((s,i)=>`<button type="button" data-action="step" data-index="${i}" class="${P.step===i?'active':''}" aria-current="${P.step===i?'step':'false'}"><b>${i+1}</b>${s}</button>`).join('')}</div><div id="uxEditor"></div></section>`;}
function validationPanel(p){const list=P.validate?productIssues(p).filter(e=>e.step===P.step):[];return list.length?`<div class="ux-errors" role="alert"><strong>아래 항목을 확인해 주세요.</strong>${list.map(e=>action(esc(e.message),'fix','ux-error-link',`data-field="${esc(e.field)}" data-step="${e.step}"`)).join('')}</div>`:'';}
function paintEditor(){
 const mount=$('#uxEditor');if(!mount)return;
 if(!P.draft.products.length){P.screen=P.editorFrom;paint();return;}
 const p=current();
 mount.innerHTML=`<div class="ux-work-grid"><aside class="ux-products"><div class="ux-list-heading">작성 중 <b>${P.draft.products.length}</b></div>${P.draft.products.map((p,i)=>`<button type="button" data-action="select" data-index="${i}" class="ux-product-tab ${P.active===i?'selected':''}"><span>${i+1}</span><div><strong>${esc(productName(p,i))}</strong><small>${esc(progress(p))}</small></div></button>`).join('')}<div class="ux-list-tools">${action('+ 상품 추가','add','ux-button ux-secondary')}</div></aside><div class="ux-detail">${p.reviewNote?`<aside class="ux-attention"><div><strong>${p.changeRequest?'이전 검수 안내':'보완 요청 내용'}</strong><p>${esc(p.reviewNote)}</p></div></aside>`:''}${P.errors.length?`<div class="ux-errors" role="alert">${P.errors.map(esc).join('<br>')}</div>`:''}${validationPanel(p)}${P.step===0?infoPanel(p):P.step===1?assetPanel(p):reviewPanel()}<div class="ux-bottom"><span role="status">${P.busy?'파일과 제출 결과를 안전하게 저장하고 있습니다…':P.step===2?'선택한 상품만 제출됩니다.':`${P.active+1} / ${P.draft.products.length}개 상품 작성 중`}</span><div class="ux-inline">${action('저장하고 나가기','returnFromEditor','ux-button ux-secondary')}${P.step?action('이전','previous','ux-button ux-secondary'):''}${P.step<2?action(P.step===0?'다음: 이미지 등록':'다음: 제출 확인','next'):action(P.busy?'제출 중…':selectedProducts().length===1&&selectedProducts()[0].sourceSubmissionId?(selectedProducts()[0].changeRequest?'수정 요청 보내기':'보완 내용 다시 제출'):`선택 상품 ${selectedProducts().length}개 제출`,'submit','ux-button',P.busy||!selectedProducts().length?'disabled':'')}</div></div></div></div>`;
 if(P.busy)$('#content').querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=true);
}

function field(f,p){const value=p.data[f.id]??'';const attrs=`id="ux-field-${esc(f.id)}" data-field="${esc(f.id)}" ${f.required?'aria-required="true"':''} aria-invalid="${P.validate&&productIssues(p).some(e=>e.field===f.id)}" aria-describedby="ux-error-${esc(f.id)}"`;let control;
 if(f.type==='select')control=`<select ${attrs}><option value="">선택해 주세요</option>${String(f.options||'').split('|').filter(Boolean).map(o=>`<option value="${esc(o)}" ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 else if(f.type==='textarea')control=`<textarea ${attrs} rows="4" placeholder="${esc(f.help||'')}">${esc(value)}</textarea>`;
 else control=`<input ${attrs} type="${f.type==='url'?'url':'text'}" ${f.type==='number'?'inputmode="decimal"':''} value="${esc(value)}" placeholder="${f.type==='number'?'숫자만 입력':esc(f.help||'')}" autocomplete="off">`;
 return `<div class="ux-field ${f.type==='textarea'?'full':''}"><label for="ux-field-${esc(f.id)}">${esc(f.label)} ${f.required?'<em>필수</em>':'<span>선택</span>'}</label>${control}<small id="ux-error-${esc(f.id)}" class="ux-field-error" aria-live="polite">${P.validate?esc(productIssues(p).find(e=>e.field===f.id)?.message||''):''}</small>${f.type==='number'&&/가격|가$/.test(f.label)?'<small>원 단위 · 쉼표를 포함해 입력해도 됩니다.</small>':f.help?`<small>${esc(f.help)}</small>`:''}</div>`;
}

function assetPanel(p){return `<div class="ux-panel-heading"><div><h3>${esc(productName(p,P.active))}의 이미지와 상세페이지</h3><p>상품과 자동으로 연결됩니다. 상품명이나 ID를 다시 입력할 필요가 없습니다.</p></div></div><div class="ux-upload-grid">${dropzone('대표 이미지','상품을 가장 잘 보여주는 이미지 한 장','.jpg,.jpeg,.png,.webp')}${dropzone('추가 이미지','여러 장을 한 번에 선택하세요','.jpg,.jpeg,.png,.webp')}</div><div class="ux-asset-list">${p.sourceSubmissionId&&safeUrl(p.data.main_image_url)&&!p.assets.some(a=>a.category==='대표 이미지')?`<article class="ux-asset"><div class="ux-thumb"><img src="${esc(safeUrl(p.data.main_image_url))}" alt="기존 대표 이미지"></div><div class="ux-asset-info"><strong>기존 대표 이미지</strong><small>새 이미지를 선택하면 교체됩니다.</small></div>${action('연결 해제','removeExistingMain','ux-text-button')}</article>`:''}${p.assets.filter(a=>['대표 이미지','추가 이미지'].includes(a.category)).map(a=>assetCard(a,p)).join('')}</div><div class="ux-detail-block"><h4>상세페이지</h4><p>기존 페이지 링크를 입력하거나 이미지·PDF를 올려주세요. 둘 다 등록할 수도 있습니다.</p><div class="ux-field"><label for="ux-detail-url">기존 상세페이지 링크 <span>선택</span></label><input id="ux-detail-url" data-detail-url type="url" placeholder="브랜드 공식몰 상품 주소를 입력해 주세요" value="${esc(p.detailUrl)}"><small>링크는 검토 자료로 전달되며, 원본 이미지를 자동으로 가져오지는 않습니다.</small></div>${dropzone('상세페이지','상세 이미지 여러 장 또는 PDF · 아래 순서대로 전달됩니다.','.jpg,.jpeg,.png,.webp,.pdf')}<div class="ux-asset-list">${p.assets.filter(a=>a.category==='상세페이지').map(a=>assetCard(a,p)).join('')}</div></div><details class="ux-optional"><summary>기타 자료 <span>상품 인증서 등 선택</span></summary>${dropzone('기타','필요한 자료만 첨부하세요','.jpg,.jpeg,.png,.webp,.pdf')}<div class="ux-asset-list">${p.assets.filter(a=>a.category==='기타').map(a=>assetCard(a,p)).join('')}</div></details><p class="ux-hint">선택한 파일은 자동으로 저장됩니다. 모든 파일의 ‘저장 완료’를 확인하세요. 소개서·사업자등록증은 상단 ‘브랜드 자료’에서 등록하세요.</p>${action('저장하지 못한 파일 다시 시도','upload','ux-button ux-secondary')}`;}
function assetCard(a,p){const i=p.assets.indexOf(a);const preview=P.previews.get(a.id);return `<article class="ux-asset"><div class="ux-thumb">${(preview||safeUrl(a.url))?`<img src="${esc(preview||safeUrl(a.url))}" alt="${esc(a.name)}">`:'<span>'+(/pdf/i.test(a.mime||'')?'PDF':'IMG')+'</span>'}</div><div class="ux-asset-info"><strong>${esc(a.name)}</strong><small>${a.category} · ${Math.round((a.size||0)/1024).toLocaleString()}KB</small><span class="ux-file-status ${['error','missing'].includes(a.status)?'bad':''}" data-status-id="${a.id}">${esc(statusText(a))}</span>${a.status==='done'&&safeUrl(a.url)?`<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">저장된 파일 보기</a>`:''}</div><div class="ux-asset-controls">${action('↑','up','ux-icon-button',`data-index="${i}" aria-label="${esc(a.name)} 순서 위로"`)}${action('↓','down','ux-icon-button',`data-index="${i}" aria-label="${esc(a.name)} 순서 아래로"`)}${action('삭제','removeAsset','ux-text-button',`data-index="${i}"`)}</div></article>`;}
function statusText(a){if(a.status==='done')return '저장 완료'+(a.uploadBytes?' · '+humanBytes_(a.uploadBytes):'');if(a.status==='uploading')return '업로드 중…'+(a.uploadProgress?' · '+a.uploadProgress:'');return a.status==='queued'?'업로드 대기':a.error||'파일을 다시 선택해 주세요.';}
function issues(){return selectedProducts().flatMap(p=>productIssues(p).map(e=>productName(p,P.draft.products.indexOf(p))+': '+e.message));}
function reviewPanel(){const selected=selectedProducts();return `<div class="ux-panel-heading"><div><h3>제출할 상품을 확인해 주세요</h3><p>선택한 ${selected.length}개 상품만 제출합니다. 다른 상품은 작성 중으로 남습니다.</p></div></div><div class="ux-review-list">${selected.map(p=>{const i=P.draft.products.indexOf(p),errors=productIssues(p);return `<article><div><strong>${esc(productName(p,i))}</strong><p>${esc(p.data.option_name||'기본 옵션')} · ${esc(p.data.category||'분류 미입력')}</p><p>소비자가 ${esc(p.data.retail_price||'미입력')}원 · 첨부 ${p.assets.length}개 · 상세 링크 ${p.detailUrl?'있음':'없음'}</p>${errors.map(e=>action(esc(e.message),'fix','ux-error-link',`data-index="${i}" data-field="${esc(e.field)}" data-step="${e.step}"`)).join('')}${errors.length?'':`<span class="ux-ready">✓ 제출 준비 완료</span>`}</div>${action('수정','edit','ux-button ux-secondary',`data-index="${i}"`)}</article>`;}).join('')}</div><div class="ux-form"><div class="ux-field"><label for="ux-contact">제출 담당자 <span>선택</span></label><input id="ux-contact" data-contact="contactName" value="${esc(P.draft.contactName||'')}" autocomplete="name"></div><div class="ux-field"><label for="ux-phone">연락처 <span>선택</span></label><input id="ux-phone" data-contact="contactPhone" value="${esc(P.draft.contactPhone||'')}" autocomplete="tel" inputmode="tel"></div></div><p class="ux-hint">제출 후 ‘검수 중’으로 표시됩니다. 수정이 필요하면 담당자가 보완을 요청합니다.</p>`;}
function focusField(field){const id=field==='detail_page_url'?'ux-detail-url':'ux-field-'+field;const el=document.getElementById(id)||$('#uxEditor .ux-drop');if(el){el.closest('details')?.setAttribute('open','');el.scrollIntoView({block:'center',behavior:'smooth'});el.focus();}}
function onInput(e){const t=e.target;if(P.busy)return;if(t.hasAttribute('data-search')){P.query=t.value;$('#uxCatalog').innerHTML=catalogCards();return;}if(t.hasAttribute('data-product-search')){P.productQuery=t.value;$('#uxProductList').innerHTML=productList();return;}if(t.dataset.field){current().data[t.dataset.field]=t.value;save();const error=document.getElementById('ux-error-'+t.dataset.field);if(error){const issue=productIssues(current()).find(x=>x.field===t.dataset.field);error.textContent=issue?.message||'';t.setAttribute('aria-invalid',String(!!issue));}}else if(t.hasAttribute('data-detail-url')){current().detailUrl=t.value;save();}else if(t.dataset.contact){P.draft[t.dataset.contact]=t.value;save();}}
function onChange(e){const t=e.target;if(P.busy)return;if(t.hasAttribute('data-product-status')){P.productStatus=t.value;$('#uxProductList').innerHTML=productList();return;}if(t.dataset.selectProduct){if(t.checked)P.selected.add(t.dataset.selectProduct);else P.selected.delete(t.dataset.selectProduct);paint();return;}if(t.dataset.files){addFiles([...t.files],t.dataset.files);t.value='';}if(t.hasAttribute('data-import'))importFile(t.files[0]);if(t.hasAttribute('data-document'))uploadDocument(t.files[0]);}
function startRevision(s){if(!s)return;P.editorFrom=P.screen==='submissions'?'submissions':'catalog';const index=P.draft.products.findIndex(p=>p.id===s.productId);if(index>=0){P.active=index;}else{P.draft.products.push({id:s.productId,data:{...s.data},detailUrl:s.data.detail_page_url||'',assets:(s.data.attachments||[]).map(a=>({...a,status:'done'})),sourceSubmissionId:s.submissionId,changeRequest:s.status==='승인 완료',reviewNote:s.reviewNote||''});P.active=P.draft.products.length-1;}P.step=0;P.screen='editor';P.validate=false;save();}
async function onAction(e){const b=e.target.closest('[data-action]');if(!b||P.busy)return;const act=b.dataset.action,i=Number(b.dataset.index);P.errors=[];switch(act){
case 'catalog':save();P.screen='catalog';P.importing=false;P.validate=false;paint();window.scrollTo(0,0);return;
 case 'returnFromEditor':save();P.screen=P.editorFrom;P.validate=false;paint();window.scrollTo(0,0);return;
case 'documents':P.screen='documents';paint();await loadDocuments();return;
 case 'submissions':P.screen='submissions';P.importing=false;paint();return;
 case 'manageProduct':{const product=(State.bootstrap.products||[]).find(p=>p.productId===b.dataset.productId);if(!product)return;const draft=P.draft.products.findIndex(p=>p.id===product.productId);if(draft>=0){P.editorFrom='catalog';P.active=draft;P.step=0;P.screen='editor';paint();return;}const submitted=latest().find(s=>s.productId===product.productId);if(['보완 필요','승인 완료'].includes(product.status)){startRevision(submitted||product);paint();return;}viewSubmission(submitted||product);return;}
case 'filter':P.filter=b.dataset.filter;paint();return;
 case 'layout':P.layout=b.dataset.layout==='list'?'list':'cards';localStorage.setItem('beautyora-catalog-layout',P.layout);paint();return;
case 'selectReady':P.selected=new Set(P.draft.products.filter(p=>!productIssues(p).length&&p.assets.every(a=>a.status==='done')).map(p=>p.id));paint();return;
case 'reviewSelected':if(!selectedProducts().length)return;P.editorFrom=P.screen==='submissions'?'submissions':'catalog';P.screen='editor';P.active=P.draft.products.indexOf(selectedProducts()[0]);P.step=2;paint();window.scrollTo(0,0);return;
case 'add':if(P.draft.products.length>=300)return UI.toast('한 번에 300개까지 등록할 수 있습니다.',true);if(P.screen!=='editor')P.editorFrom=P.screen==='submissions'?'submissions':'catalog';P.draft.products.push(makeProduct());P.active=P.draft.products.length-1;P.step=0;P.screen='editor';P.validate=false;P.importing=false;break;
case 'select':P.editorFrom='submissions';P.active=i;P.step=0;P.screen='editor';P.validate=false;break;
case 'step':if(!P.draft.products.length)return;if(i>P.step&&P.step<2&&productIssues(current()).some(x=>x.step===P.step)){P.validate=true;paintEditor();return;}if(i===2)P.selected=new Set([current().id]);P.step=i;P.validate=false;break;
case 'next':if(productIssues(current()).some(x=>x.step===P.step)){P.validate=true;paintEditor();return;}P.step=Math.min(2,P.step+1);if(P.step===2)P.selected=new Set([current().id]);P.validate=false;break;
case 'previous':P.step=Math.max(0,P.step-1);P.validate=false;break;
case 'edit':P.active=i;P.step=0;P.validate=false;break;
case 'fix':if(b.hasAttribute('data-index'))P.active=i;P.step=Number(b.dataset.step);P.validate=true;paint();focusField(b.dataset.field);return;
case 'duplicate':if(P.draft.products.length>=300)return;const copy=makeProduct({...current().data,barcode:'',product_id:'',main_image_url:'',detail_page_url:''});Object.keys(copy.data).filter(k=>k.startsWith('_')||k==='attachments'||k.endsWith('_urls')).forEach(k=>delete copy.data[k]);copy.data.product_name=(copy.data.product_name||'상품')+' (복사)';P.draft.products.push(copy);P.active=P.draft.products.length-1;P.step=0;P.validate=false;break;
case 'removeProduct':if(P.removePending!==current().id){P.removePending=current().id;b.textContent='작성 내용 삭제 확인';return;}P.removePending='';P.selected.delete(current().id);current().assets.forEach(release);P.draft.products.splice(P.active,1);P.active=Math.max(0,P.active-1);if(!P.draft.products.length)P.screen=P.editorFrom;break;
case 'removeExistingMain':current().data.main_image_url='';break;
case 'removeAsset':if(current().assets[i].category==='대표 이미지')current().data.main_image_url='';release(current().assets[i]);current().assets.splice(i,1);break;
case 'up':case 'down':{const a=current().assets,dir=act==='up'?-1:1;let at=i+dir;while(at>=0&&at<a.length&&a[at].category!==a[i].category)at+=dir;if(at>=0&&at<a.length)[a[i],a[at]]=[a[at],a[i]];break;}
case 'import':P.screen='catalog';P.importing=true;paint();return;
case 'closeImport':P.importing=false;paint();return;
case 'template':await downloadTemplate();return;
case 'save':save();UI.toast(saveLabel(),!P.storage);return;
case 'upload':await uploadAll(false,[current()]);return;
case 'submit':await submit();return;
case 'refresh':await refresh();return;
case 'view':viewSubmission(latest()[i]);return;
case 'refreshDocuments':await loadDocuments();return;
case 'retryDocument':await sendDocument();return;
case 'revise':startRevision(latest()[i]);break;
}save();paint();if(['add','select','revise'].includes(act))window.scrollTo(0,0);else if(['next','previous','step','edit'].includes(act))$('#uxScreen')?.scrollIntoView({block:'start'});}
async function submit(){
 const products=selectedProducts();if(!products.length)return;
 P.errors=products.flatMap(p=>productIssues(p).map(e=>productName(p,P.draft.products.indexOf(p))+': '+e.message));
 if(P.errors.length){P.step=2;paint();return;}P.busy=true;paint();
 try{
  if(!await uploadAll(true,products))throw new Error('저장하지 못한 파일이 있습니다. 이미지 단계에서 다시 시도해 주세요.');
  const payload={token:State.token,requestId:P.draft.requestId,contactName:P.draft.contactName,contactPhone:P.draft.contactPhone,products:products.map(p=>({id:p.id,data:p.data,sourceSubmissionId:p.sourceSubmissionId,detailUrl:p.detailUrl,assets:p.assets.map(a=>({id:a.fileId||a.id}))}))};
  const result=await server('submitPartnerDraft',payload);
  if(!result.ok){P.errors=(result.validationErrors||[]).map(e=>`${products[e.row-1]?.data.product_name||e.row+'번째 상품'}: ${e.message}`);return;}
  const sent=new Set(products.map(p=>p.id));products.forEach(p=>p.assets.forEach(release));P.draft.products=P.draft.products.filter(p=>!sent.has(p.id));P.draft.requestId=uid();P.selected.clear();P.active=0;P.step=0;P.screen='submissions';P.filter='all';P.query='';P.notice=`${result.count}개 상품을 제출했습니다. 담당자 검수 후 결과를 안내합니다.`;save();await refresh();
 }catch(e){P.errors=[e.message];}finally{P.busy=false;paint();}
}
function documentPanel(){return `<section class="ux-catalog-hero"><div><span class="ux-eyebrow">BRAND DOCUMENTS</span><h1>브랜드 자료</h1><p>소개서·사업자등록증·계약서를 등록하세요. 상품 이미지는 각 상품에서 등록합니다.</p></div></section><section class="ux-history ux-documents"><div class="ux-panel-heading"><div><h2>자료 올리기</h2><p>파일을 선택하면 브랜드 자료 폴더에 저장됩니다. PDF, JPG, PNG, WEBP · 최대 8MB</p></div></div><div class="ux-inline"><label class="ux-field">자료 종류<select id="uxDocCategory"><option>브랜드 소개서</option><option>사업자등록증</option><option>계약서</option><option>기타 브랜드 자료</option></select></label><label class="ux-button">파일 선택<input data-document type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" class="ux-sr-only"></label></div><p role="status" class="ux-hint">${P.busy?'파일을 저장하고 있습니다…':esc(P.documentNotice||'등록한 자료는 운영 담당자가 확인할 수 있습니다.')}</p>${P.documentPending&&!P.busy?action('저장 다시 시도','retryDocument','ux-button ux-secondary'):''}<div class="ux-section-title"><h2>등록한 자료</h2>${action('새로고침','refreshDocuments','ux-text-button')}</div>${P.documents===null?'<p role="status">자료를 불러오고 있습니다…</p>':P.documents.length?`<div class="ux-document-list">${P.documents.map(f=>`<article><div><strong>${esc(f.name)}</strong><p>${esc(f.category)} · ${esc(f.createdAt||'')}</p></div>${safeUrl(f.url)?`<a class="ux-button ux-secondary" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">자료 열기</a>`:''}</article>`).join('')}</div>`:'<div class="ux-empty">아직 등록한 브랜드 자료가 없습니다.</div>'}</section>`;}
async function loadDocuments(){try{const r=await server('getPartnerDocuments',{token:State.token});P.documents=r.files||[];P.documentNotice='';}catch(e){P.documents=[];P.documentNotice='자료를 불러오지 못했습니다. '+e.message;}paint();}
async function uploadDocument(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase(),mime={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',pdf:'application/pdf'}[ext];if(!mime||!file.size||file.size>MAX){P.documentNotice='PDF, JPG, PNG, WEBP 파일을 8MB 이하로 선택해 주세요.';paint();return;}P.documentPending={file,mime,category:$('#uxDocCategory').value,id:uid()};await sendDocument();}
async function sendDocument(){const item=P.documentPending;if(!item)return;P.busy=true;paint();try{const r=await server('uploadPartnerDocument',{token:State.token,uploadId:item.id,category:item.category,fileName:item.file.name,mimeType:item.mime,base64:await fileBase64(item.file)});if(!r.ok)throw new Error('저장 결과를 확인하지 못했습니다.');P.documentPending=null;await loadDocuments();if(!P.documentNotice)P.documentNotice='브랜드 자료를 저장했습니다.';}catch(e){P.documentNotice='저장하지 못했습니다. '+e.message;}finally{P.busy=false;paint();}}

function updateSteps(){$$('.ux-steps button').forEach((b,i)=>{b.classList.toggle('active',i===P.step);b.setAttribute('aria-current',i===P.step?'step':'false');});}
function release(a){P.files.delete(a.id);const url=P.previews.get(a.id);if(url)URL.revokeObjectURL(url);P.previews.delete(a.id);}
function addFiles(files,category){const p=current();if(!p)return;const errors=[];for(const file of files){if(p.assets.length>=50){errors.push('상품당 첨부파일은 최대 50개입니다.');break;}const ext=file.name.split('.').pop().toLowerCase();const mime={'jpg':'image/jpeg','jpeg':'image/jpeg','png':'image/png','webp':'image/webp','pdf':'application/pdf'}[ext];if(!mime||(category.includes('이미지')&&mime==='application/pdf')){errors.push(file.name+': 지원하지 않는 형식입니다.');continue;}if(!file.size||file.size>MAX){errors.push(file.name+': 파일은 0MB 초과, 8MB 이하로 선택해 주세요.');continue;}const old=p.assets.find(a=>a.category===category&&a.name===file.name&&a.size===file.size);if(category==='대표 이미지'&&!old){p.data.main_image_url='';p.assets.filter(a=>a.category===category).forEach(release);p.assets=p.assets.filter(a=>a.category!==category);}if(old&&old.status!=='missing'){errors.push(file.name+': 이미 선택한 파일입니다.');continue;}const a=old||{id:uid(),name:file.name,size:file.size,mime,category};a.status='queued';a.error='';P.files.set(a.id,file);if(mime.startsWith('image/')){const oldUrl=P.previews.get(a.id);if(oldUrl)URL.revokeObjectURL(oldUrl);P.previews.set(a.id,URL.createObjectURL(file));}if(!old)p.assets.push(a);}P.errors=errors;save();paintEditor();if(files.length)void uploadAll(false,[p]);}
function humanBytes_(bytes){if(!bytes)return '0KB';if(bytes<1048576)return Math.max(1,Math.round(bytes/1024))+'KB';return (bytes/1048576).toFixed(1)+'MB';}
function canvasBlob_(canvas,type,quality){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('이미지를 최적화하지 못했습니다.')),type,quality));}
async function optimizePartnerFile_(file,category){
  const original={blob:file,fileName:file.name,mimeType:file.type,originalBytes:file.size,uploadBytes:file.size};
  if(!file||!category.includes('이미지')||!/^image\/(jpeg|png|webp)$/.test(file.type))return original;
  let bitmap;
  try{
    bitmap=await createImageBitmap(file);
    const maxSide=2000,scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
    if(scale===1&&file.size<=900*1024)return original;
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    const ctx=canvas.getContext('2d',{alpha:true});ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
    const blob=await canvasBlob_(canvas,'image/webp',.84);
    if(blob.size>=file.size)return original;
    return {blob,fileName:file.name.replace(/\.[^.]+$/, '')+'.webp',mimeType:'image/webp',originalBytes:file.size,uploadBytes:blob.size};
  }catch(e){return original;}finally{if(bitmap&&bitmap.close)bitmap.close();}
}
async function uploadAll(inSubmit=false,products=P.draft.products){
  if(!inSubmit){P.busy=true;paintEditor();}
  let ok=true,cursor=0;const tasks=[];
  for(const p of products)for(const a of p.assets){
    if(a.status==='done')continue;
    const file=P.files.get(a.id);
    if(!file){a.status='missing';a.error='파일을 다시 선택해 주세요.';ok=false;setFileStatus(a);continue;}
    a.status='queued';a.error='';tasks.push({p,a,file});setFileStatus(a);
  }
  const run=async task=>{const {p,a,file}=task;try{
    a.status='uploading';a.uploadProgress='최적화 중';setFileStatus(a);
    const optimized=await optimizePartnerFile_(file,a.category);
    a.uploadProgress=optimized.uploadBytes<optimized.originalBytes?'최적화 '+humanBytes_(optimized.originalBytes)+' → '+humanBytes_(optimized.uploadBytes):humanBytes_(optimized.uploadBytes);
    setFileStatus(a);
    const base64=await fileBase64(optimized.blob);
    const r=await server('uploadPartnerAsset',{token:State.token,uploadId:a.id,productId:p.id,category:a.category,fileName:optimized.fileName,mimeType:optimized.mimeType,base64});
    if(!r.ok)throw new Error('저장 결과를 확인하지 못했습니다.');
    a.idOriginal=a.id;a.fileId=r.id;a.url=r.url;a.status='done';a.uploadBytes=optimized.uploadBytes;a.originalBytes=optimized.originalBytes;a.error='';save();
  }catch(e){a.status='error';a.error=e.message;ok=false;}setFileStatus(a);};
  async function worker(){while(cursor<tasks.length){const task=tasks[cursor++];await run(task);}}
  await Promise.all(Array.from({length:Math.min(3,tasks.length)},worker));
  if(!inSubmit){P.busy=false;save();paint();UI.toast(ok?'이미지를 저장했습니다. 마지막 단계에서 상품을 제출해 주세요.':'이미지 저장 실패 · 다시 시도해 주세요.',!ok);}
  return ok;
}
function setFileStatus(a){const el=$(`[data-status-id="${a.id}"]`);if(el)el.textContent=statusText(a);}

async function refresh(){try{const r=await server('getAppBootstrap',{view:'partner',token:State.token});if(!r.ok)throw new Error(r.message);State.bootstrap=r;paint();}catch(e){UI.toast('현황을 새로고침하지 못했습니다. '+e.message,true);}}
function viewSubmission(s){const entries=Object.entries(s.data||{}).filter(([k,v])=>!k.startsWith('_')&&!Array.isArray(v)&&typeof v!=='object');UI.modal(`<h2>${esc(s.data.product_name||'제출 상품')}</h2><p>${esc(s.status)} · ${esc(s.updatedAt)}</p><dl class="ux-submission-data">${entries.map(([k,v])=>`<dt>${esc(State.bootstrap.fields.find(f=>f.id===k)?.label||({'main_image_url':'대표 이미지','detail_page_url':'상세페이지','product_id':'상품번호'}[k])||k)}</dt><dd>${safeUrl(v)?`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">자료 열기</a>`:esc(v)}</dd>`).join('')}</dl><h3>첨부파일</h3>${(s.data.attachments||[]).map(a=>`<p>${esc(a.category)} · <a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">${esc(a.name)}</a></p>`).join('')||'<p>등록된 첨부파일이 없습니다.</p>'}<div class="modal-actions"><button class="secondary-button" onclick="UI.closeModal()">닫기</button></div>`);}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw new Error('CSV의 따옴표가 닫히지 않았습니다.');if(cell||row.length){row.push(cell);rows.push(row);}return rows;}
async function importFile(file){if(!file)return;if(file.size>MAX){P.errors=['상품표는 8MB 이하로 선택해 주세요.'];paint();return;}P.busy=true;paint();try{let products;if(/\.csv$/i.test(file.name)){const rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));const fields=State.bootstrap.fields;const head=rows.shift()||[];if(!head.some(h=>h.trim()==='product_name'||h.trim()===(fields.find(f=>f.id==='product_name')?.label||'상품명')))throw new Error('첫 행에 상품명 열이 있어야 합니다. CSV 양식을 사용해 주세요.');products=rows.filter(r=>r.some(v=>v.trim())).map(r=>{const p={};fields.forEach(f=>{const i=head.findIndex(h=>[f.id,f.label].includes(h.trim()));if(i>=0)p[f.id]=r[i]||'';});return p;});}else if(/\.xlsx$/i.test(file.name)){const r=await server('importProductWorkbook',{token:State.token,fileName:file.name,base64:await fileBase64(file)});products=r.products||[];}else throw new Error('XLSX 또는 CSV 파일을 선택해 주세요.');if(!products.length)throw new Error('가져올 상품이 없습니다.');if(P.draft.products.length+products.length>300)throw new Error('작성 중인 상품을 포함해 최대 300개입니다.');const start=P.draft.products.length;products.forEach(d=>P.draft.products.push(makeProduct(d)));P.active=start;P.step=0;P.importing=false;P.screen='editor';save();UI.toast(`${products.length}개 상품을 가져왔습니다. 내용을 확인하고 이미지를 추가해 주세요.`);}catch(e){P.errors=[e.message];}finally{P.busy=false;paint();}}
window.addEventListener('beforeunload',e=>{if(P.busy||P.documentPending||(!P.storage&&P.draft?.products.length)||P.draft?.products.some(p=>p.assets.some(a=>a.status!=='done'))){e.preventDefault();e.returnValue='';}});
})();</script>
