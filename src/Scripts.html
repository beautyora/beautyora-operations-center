<script>
const State={view:document.body.dataset.initialView||'admin',token:document.body.dataset.token||'',route:'dashboard',bootstrap:null,sectionCache:{},cacheTtl:180000};
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const server=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[name](...args));
const fmt=v=>v||'—';
const UI={
 toast(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast'+(error?' error':'');setTimeout(()=>el.classList.add('hidden'),3200)},
 modal(html){$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')},
 closeModal(){ $('#modal').classList.add('hidden');$('#modalBody').innerHTML=''},
 status(value){const v=String(value||'');let cls='';if(/완료|승인|정상|사용 중/.test(v))cls='good';else if(/오류|긴급|반려|중지/.test(v))cls='bad';else if(/보완|주의|누락|만료/.test(v))cls='warn';else if(/검수|신규|접수/.test(v))cls='info';return `<span class="status-pill ${cls}">${esc(v||'미정')}</span>`},
 empty(title,desc){return `<div class="empty-state"><strong>${esc(title)}</strong><span>${esc(desc)}</span></div>`}
};

document.addEventListener('DOMContentLoaded',init);
async function init(){
 try{
  const data=await server('getAppBootstrap',{view:State.view,token:State.token});
  if(!data.ok)throw new Error(data.message);State.bootstrap=data;
  if(State.view==='partner')renderPartner(data);else renderAdmin(data);
  $('#loading').classList.add('hidden');$('#app').classList.remove('hidden');
 }catch(e){$('#loading').innerHTML=`<div class="empty-state"><strong>화면을 열 수 없습니다.</strong><span>${esc(e.message)}</span></div>`}
}

function renderAdmin(data){
 $('#userChip').textContent=(data.user&&data.user.email)||'관리자';
 $$('#adminNav .nav-item').forEach(btn=>btn.addEventListener('click',()=>go(btn.dataset.route)));
 $('#refreshBtn').addEventListener('click',()=>go(State.route,true));
 $('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
 State.sectionCache.dashboard={data:data.data,at:Date.now()};
 renderDashboard(data.data);
}
function renderAdminSection_(route,data){const renderers={dashboard:renderDashboard,intake:renderIntake,brands:renderBrands,products:renderProducts,files:renderFiles,alerts:renderAlerts,settings:renderSettings};if(renderers[route])renderers[route](data);}
async function go(route,force=false){
 State.route=route;$$('#adminNav .nav-item').forEach(btn=>btn.classList.toggle('active',btn.dataset.route===route));
 $('#sidebar').classList.remove('open');setHeader(route);
 const cached=State.sectionCache[route];
 if(!force&&cached&&Date.now()-cached.at<State.cacheTtl){renderAdminSection_(route,cached.data);return;}
 $('#content').innerHTML='<div class="loading-screen"><div class="spinner"></div><p class="subtle" style="margin-top:12px">데이터를 불러오는 중입니다.</p></div>';
 try{const data=await server('getAdminSection',route,{});State.sectionCache[route]={data,at:Date.now()};renderAdminSection_(route,data)}catch(e){$('#content').innerHTML=UI.empty('불러오지 못했습니다.',e.message)}
}
function setHeader(route){const map={dashboard:['홈','오늘 처리할 업무를 확인하세요.'],intake:['입점 신청','Google Form 신청을 검토하고 승인합니다.'],brands:['브랜드','승인된 브랜드와 상품등록 링크를 관리합니다.'],products:['상품','전체 상품을 검색하고 신규 제출 상품을 검수합니다.'],files:['파일','이미지와 상세페이지 수령 상태를 확인합니다.'],alerts:['알림','업무 누락과 연결 문제를 확인합니다.'],settings:['설정','상품 항목과 시스템 연결을 관리합니다.']};$('#pageTitle').textContent=map[route][0];$('#pageSubtitle').textContent=map[route][1]}
function renderDashboard(data){
 setHeader('dashboard');const c=data.counts||{};$('#alertBadge').textContent=c.errors||0;$('#alertBadge').classList.toggle('hidden',!c.errors);
 $('#content').innerHTML=`<div class="hero-panel"><h2>오늘 확인할 업무가 ${(c.newBrands||0)+(c.submissions||0)+(c.revisions||0)+(c.missingFiles||0)+(c.errors||0)}건 있습니다.</h2><p>카드를 누르면 해당 업무로 바로 이동합니다.</p></div>
 <div class="metric-grid">${metric('신규 브랜드',c.newBrands,'brands')}${metric('상품 검수',c.submissions,'products')}${metric('보완 재제출',c.revisions,'products')}${metric('파일 누락',c.missingFiles,'files')}${metric('시스템 오류',c.errors,'alerts',true)}</div>
 <div class="two-column"><section class="panel"><div class="panel-head"><h2>최근 활동</h2></div><div class="activity-list">${(data.recentActivity||[]).length?(data.recentActivity||[]).map(a=>`<div class="activity-item"><strong>${esc(a.title)}</strong><span>${esc(a.detail)}</span><time>${esc(a.time)}</time></div>`).join(''):UI.empty('최근 활동이 없습니다.','업무가 처리되면 여기에 표시됩니다.')}</div></section>
 <section class="panel"><div class="panel-head"><h2>확인할 알림</h2><button class="small-button" onclick="go('alerts')">전체 보기</button></div><div class="alert-list">${(data.alerts||[]).length?(data.alerts||[]).map(a=>`<div class="alert-item">${UI.status(a.level)}<strong style="display:block;margin:8px 0 3px">${esc(a.title)}</strong><span class="subtle">${esc(a.detail)}</span></div>`).join(''):UI.empty('모두 정상입니다.','현재 확인할 문제가 없습니다.')}</div></section></div>`;
}
function metric(label,value,route,error=false){return `<button class="metric-card ${error?'error':''}" onclick="go('${route}')"><small>${esc(label)}</small><strong>${Number(value)||0}</strong></button>`}

function renderBrands(rows){
 $('#content').innerHTML=`<section class="panel"><div class="panel-head"><h2>브랜드 목록</h2><span class="subtle">${rows.length}개 브랜드</span></div><div class="toolbar"><input id="brandSearch" class="search-input" placeholder="브랜드명, 회사명, 담당자 검색"></div><div id="brandTable"></div></section>`;
 const paint=list=>$('#brandTable').innerHTML=list.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>브랜드</th><th>영업 단계</th><th>상품 상태</th><th>담당자</th><th>다음 연락</th><th>상품등록 링크</th><th></th></tr></thead><tbody>${list.map(b=>`<tr><td><strong>${esc(b.brandName)}</strong><div class="subtle">${esc(b.brandCode)} · ${esc(b.companyName)}</div></td><td>${UI.status(b.salesStage)}</td><td>${UI.status(b.productStatus)}</td><td>${esc(fmt(b.manager))}</td><td>${esc(fmt(b.nextContact))}</td><td>${b.link?UI.status(b.link.status):'<span class="subtle">미발급</span>'}</td><td><button class="small-button primary" onclick='openBrand(${JSON.stringify(b).replace(/'/g,"&#39;")})'>관리</button></td></tr>`).join('')}</tbody></table></div>`:UI.empty('브랜드가 없습니다.','브랜드 시트에 승인된 브랜드를 연결해 주세요.');
 paint(rows);$('#brandSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();paint(rows.filter(b=>[b.brandName,b.companyName,b.brandCode,b.manager].join(' ').toLowerCase().includes(q)))})
}
function openBrand(b){UI.modal(`<h2>${esc(b.brandName)}</h2><p>${esc(b.brandCode)} · ${esc(b.companyName)}</p><div class="form-grid"><div class="field-group"><label>영업 단계</label><div>${UI.status(b.salesStage)}</div></div><div class="field-group"><label>상품 상태</label><div>${UI.status(b.productStatus)}</div></div><div class="field-group"><label>담당자</label><div>${esc(fmt(b.manager))}</div></div><div class="field-group"><label>다음 연락일</label><div>${esc(fmt(b.nextContact))}</div></div><div class="field-group full"><label>상품등록 링크</label>${b.link?`<input class="field-input" readonly value="${esc(b.link.url)}"><div class="inline-actions"><button class="small-button" onclick="copyText('${esc(b.link.url)}')">링크 복사</button><button class="small-button" onclick="disableLink('${esc(b.link.token)}')">사용 중지</button></div>`:'<span class="subtle">아직 발급하지 않았습니다.</span>'}</div></div><div class="modal-actions"><button class="secondary-button" onclick="UI.closeModal()">닫기</button>${b.link?'':`<button class="primary-button" onclick="issueLink('${esc(b.brandCode)}')">30일 링크 발급</button>`}</div>`)}
async function issueLink(code){try{const r=await server('saveAdminAction','issuePartnerLink',{brandCode:code});await navigator.clipboard.writeText(r.url);UI.closeModal();UI.toast('상품등록 링크를 발급하고 복사했습니다.');go('brands',true)}catch(e){UI.toast(e.message,true)}}
async function disableLink(token){try{await server('saveAdminAction','disablePartnerLink',{token});UI.closeModal();UI.toast('링크 사용을 중지했습니다.');go('brands',true)}catch(e){UI.toast(e.message,true)}}
function copyText(text){navigator.clipboard.writeText(text).then(()=>UI.toast('링크를 복사했습니다.'))}

function renderProducts(data){
 const products=(data&&data.products)||[];
 const cachedReview=State.sectionCache.productSubmissions;
 let submissions=cachedReview&&Date.now()-cachedReview.at<State.cacheTtl?cachedReview.data:null;
 $('#content').innerHTML=`<section class="panel"><div class="section-tabs"><button class="active" data-product-view="master">상품 마스터</button><button data-product-view="review">검수 대기 <span id="reviewCount" class="subtle">${submissions?submissions.filter(s=>s.status!=='승인 완료').length:'·'}</span></button></div><div id="productWorkspace"></div></section>`;
 const show=async view=>{
  $$('.section-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.productView===view));
  if(view==='master'){renderProductMaster(products);return;}
  if(!submissions){
   $('#productWorkspace').innerHTML='<div class="loading-screen"><div class="spinner"></div><p class="subtle" style="margin-top:12px">검수 목록을 불러오는 중입니다.</p></div>';
   try{const result=await server('getAdminSection','productSubmissions',{});submissions=(result&&result.submissions)||[];State.reviewFields=(result&&result.fields)||[];State.sectionCache.productSubmissions={data:submissions,at:Date.now()};$('#reviewCount').textContent=submissions.filter(s=>s.status!=='승인 완료').length;}catch(e){$('#productWorkspace').innerHTML=UI.empty('검수 목록을 불러오지 못했습니다.',e.message);return;}
  }
  renderSubmissionList(submissions);
 };
 $$('[data-product-view]').forEach(btn=>btn.addEventListener('click',()=>show(btn.dataset.productView)));show('master');
}
function productThumbUrl_(url,size){var text=String(url||'');if(!text)return '';var id=reviewDriveId_(text);return id?'https:'+'/'+'/'+'drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+(size||160):text;}
function productPrefs_(){var base={mode:'table',cols:['brand','trade','retail','purchase','consignment','status']};try{var saved=JSON.parse(localStorage.getItem('boProductPrefs')||'{}');Object.keys(saved).forEach(function(k){base[k]=saved[k]})}catch(e){}return base;}
function saveProductPrefs_(){localStorage.setItem('boProductPrefs',JSON.stringify(State.productPrefs));}
function productImageHtml_(p,large){var url=productThumbUrl_(p.mainImageUrl,large?480:120);return url?'<img src="'+esc(url)+'" alt="'+esc(p.productName||'상품 이미지')+'" loading="lazy">':'<span class="product-image-placeholder" aria-label="이미지 없음"><span aria-hidden="true">◇</span><small>이미지 준비 중</small></span>';}

function productMoneyHtml_(v){return String(v==null?'':v).trim()?esc(money(v)):'<span class="price-missing">미입력</span>';}
function renderProductMaster(rows){State.productRows=rows||[];State.productPrefs=productPrefs_();State.productPreset='all';var cats=[];rows.forEach(function(r){if(r.category&&cats.indexOf(r.category)<0)cats.push(r.category)});cats.sort();var catOptions=cats.map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>'}).join('');$('#productWorkspace').innerHTML='<div class="product-db-head"><div><span class="eyebrow">PRODUCT DATABASE</span><h2>상품 목록</h2><p class="subtle">이미지와 가격·공급조건을 한 화면에서 관리합니다.</p></div><div class="product-db-actions"><button class="view-icon" data-pmode="table">표</button><button class="view-icon" data-pmode="cards">카드</button><button id="productPropsBtn" class="secondary-button">속성 편집</button></div></div><div class="product-presets"><button class="active" data-ppreset="all">전체</button><button data-ppreset="purchase">매입 상품</button><button data-ppreset="consignment">위탁 상품</button><button data-ppreset="missing">가격 확인 필요</button></div><div class="product-toolbar"><input id="productSearch" class="search-input" placeholder="상품명, 브랜드, 바코드 검색"><select id="productCategory" class="field-select"><option value="">전체 카테고리</option>'+catOptions+'</select><select id="productSort" class="field-select"><option value="productName">상품명순</option><option value="brandName">브랜드순</option><option value="retailPrice">소비자가순</option><option value="purchasePrice">매입가순</option><option value="consignmentPrice">위탁가순</option></select><strong id="productCount"></strong></div><div id="productProps" class="column-panel hidden"></div><div id="masterTable"></div>';['productSearch','productCategory','productSort'].forEach(function(id){$('#'+id).addEventListener(id==='productSearch'?'input':'change',paintProductMaster_)});$$('[data-pmode]').forEach(function(b){b.addEventListener('click',function(){State.productPrefs.mode=b.dataset.pmode;saveProductPrefs_();paintProductMaster_()})});$$('[data-ppreset]').forEach(function(b){b.addEventListener('click',function(){State.productPreset=b.dataset.ppreset;$$('[data-ppreset]').forEach(function(x){x.classList.toggle('active',x===b)});paintProductMaster_()})});$('#productPropsBtn').addEventListener('click',toggleProductProps_);paintProductMaster_();}
function filteredProducts_(){var q=$('#productSearch').value.toLowerCase(),cat=$('#productCategory').value,key=$('#productSort').value;var list=State.productRows.filter(function(p){return (!cat||p.category===cat)&&(!q||[p.productName,p.brandName,p.barcode,p.productId].join(' ').toLowerCase().indexOf(q)>=0)});if(State.productPreset==='purchase')list=list.filter(function(p){return /매입|혼합/.test(p.tradeType)});if(State.productPreset==='consignment')list=list.filter(function(p){return /위탁|혼합/.test(p.tradeType)});if(State.productPreset==='missing')list=list.filter(function(p){return !p.tradeType||(/매입/.test(p.tradeType)&&!Number(p.purchasePrice))||(/위탁/.test(p.tradeType)&&!Number(p.consignmentPrice))});list.sort(function(a,b){return /Price$/.test(key)?Number(a[key]||0)-Number(b[key]||0):String(a[key]||'').localeCompare(String(b[key]||''),'ko')});return list;}
function bindProductCards_(){$$('[data-pid]').forEach(function(el){el.addEventListener('click',function(){var p=(State.productRows||[]).find(function(x){return String(x.productId)===String(el.dataset.pid)});if(p)openProduct(p)})});}
function paintProductMaster_(){var list=filteredProducts_(),shown=list.slice(0,400),cols=State.productPrefs.cols||[];$('#productCount').textContent=list.length+'개';$$('[data-pmode]').forEach(function(b){b.classList.toggle('active',b.dataset.pmode===State.productPrefs.mode)});if(State.productPrefs.mode==='cards'){var cards=shown.map(function(p){return '<article class="product-card" data-pid="'+esc(p.productId)+'"><div class="product-card-image">'+productImageHtml_(p,true)+'</div><div class="product-card-body"><div class="product-card-top"><span>'+esc(p.brandName||p.brandCode||'')+'</span>'+UI.status(p.tradeType||'미지정')+'</div><h3>'+esc(p.productName||'상품명 없음')+'</h3><p>'+esc(p.optionName||p.productId)+'</p><div class="product-price-grid"><span>소비자가<strong>'+productMoneyHtml_(p.retailPrice)+'</strong></span><span>매입가<strong>'+productMoneyHtml_(p.purchasePrice)+'</strong></span><span>위탁공급가<strong>'+productMoneyHtml_(p.consignmentPrice)+'</strong></span></div></div></article>'}).join('');$('#masterTable').innerHTML='<div class="product-card-grid">'+cards+'</div>';bindProductCards_();return;}var defs=[['brand','브랜드'],['category','카테고리'],['trade','거래방식'],['retail','소비자가'],['purchase','매입가'],['consignment','위탁공급가'],['offline','위탁 소비자가'],['lowest','온라인 최저가'],['moq','MOQ'],['barcode','바코드'],['status','상태']].filter(function(d){return cols.indexOf(d[0])>=0});var head=defs.map(function(d){return '<th>'+d[1]+'</th>'}).join('');var body=shown.map(function(p){var cells=defs.map(function(d){var k=d[0],v='';if(k==='brand')v='<strong>'+esc(p.brandName||p.brandCode||'-')+'</strong>';else if(k==='trade')v=UI.status(p.tradeType||'미지정');else if(k==='status')v=UI.status(p.status||'미지정');else if(k==='retail')v=productMoneyHtml_(p.retailPrice);else if(k==='purchase')v=productMoneyHtml_(p.purchasePrice);else if(k==='consignment')v=productMoneyHtml_(p.consignmentPrice);else if(k==='offline')v=productMoneyHtml_(p.offlineConsignmentPrice);else if(k==='lowest')v=productMoneyHtml_(p.onlineLowestPrice);else v=esc(fmt(p[k]));return '<td>'+v+'</td>'}).join('');return '<tr><td><div class="product-identity"><span class="product-thumb">'+productImageHtml_(p,false)+'</span><div><strong>'+esc(p.productName||'상품명 없음')+'</strong><small>'+esc(p.optionName||p.productId)+'</small></div></div></td>'+cells+'<td><button class="small-button primary" data-pid="'+esc(p.productId)+'">열기</button></td></tr>'}).join('');$('#masterTable').innerHTML='<div class="data-table-wrap product-table-wrap"><table class="data-table product-db-table"><thead><tr><th>상품</th>'+head+'<th></th></tr></thead><tbody>'+body+'</tbody></table></div>';bindProductCards_();}
function toggleProductProps_(){var panel=$('#productProps'),defs=[['brand','브랜드'],['category','카테고리'],['trade','거래방식'],['retail','소비자가'],['purchase','매입가'],['consignment','위탁공급가'],['offline','위탁 소비자가'],['lowest','온라인 최저가'],['moq','MOQ'],['barcode','바코드'],['status','상태']];panel.innerHTML='<strong>표시할 속성</strong><div class="column-list">'+defs.map(function(d){return '<label class="column-item"><input type="checkbox" data-pcol="'+d[0]+'" '+((State.productPrefs.cols||[]).indexOf(d[0])>=0?'checked':'')+'> '+d[1]+'</label>'}).join('')+'</div>';panel.classList.toggle('hidden');$$('[data-pcol]').forEach(function(x){x.addEventListener('change',function(){State.productPrefs.cols=$$('[data-pcol]:checked').map(function(i){return i.dataset.pcol});saveProductPrefs_();paintProductMaster_()})});}
function renderSubmissionList(rows){
 const tabs=[['','전체'],['__changes','변경 요청'],['신규 제출','신규 제출'],['검수 중','검수 중'],['보완 필요','보완 필요'],['승인 완료','승인 완료']];
 $('#productWorkspace').innerHTML=`<div class="panel-head"><div><h2>상품 검수</h2><p class="subtle">신규 상품과 기존 상품의 변경 요청을 구분해 검토합니다.</p></div></div><div class="section-tabs">${tabs.map((t,i)=>`<button class="${i===0?'active':''}" data-status="${esc(t[0])}">${t[1]}${t[0]==='__changes'?' <b>'+rows.filter(r=>r.isChangeRequest&&r.status!=='승인 완료').length+'</b>':''}</button>`).join('')}</div><div id="productTable"></div>`;

async function saveProduct(productId){
 const productName=$('#editProductName').value.trim();if(!productName){UI.toast('상품명을 입력해 주세요.',true);$('#editProductName').focus();return}
 const payload={productId,productName,optionName:$('#editOption').value,barcode:$('#editBarcode').value,category:$('#editCategory').value,tradeType:$('#editTrade').value,retailPrice:$('#editRetail').value,purchasePrice:$('#editPurchase').value,consignmentPrice:$('#editConsignment').value,offlineConsignmentPrice:$('#editOfflineConsignment').value,onlineLowestPrice:$('#editLowest').value,moq:$('#editMoq').value,vendorAffiliation:$('#editVendor').value,reviewStatus:$('#editReview').value,active:$('#editActive').checked,productUrl:$('#editProductUrl').value,mainImageUrl:$('#editMainImage').value};
 try{const result=await server('saveAdminAction','updateProduct',payload);UI.closeModal();UI.toast(result.changed?'상품 정보를 수정했습니다.':'변경된 내용이 없습니다.');delete State.sectionCache.productSubmissions;go('products',true)}catch(e){UI.toast(e.message,true)}
}

function money(value){const n=Number(String(value==null?'':value).replace(/[^0-9.-]/g,''));return Number.isFinite(n)&&String(value).trim()!==''?n.toLocaleString('ko-KR')+'원':fmt(value)}
function reviewFieldEmpty_(v){return v==null||v===''||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);}
function reviewHttp_(v){const text=String(v||'').toLowerCase();return text.slice(0,6)==='https:'||text.slice(0,5)==='http:';}
function reviewFieldValue_(v){
 if(Array.isArray(v))return v.filter(x=>!reviewFieldEmpty_(x)).map(reviewFieldValue_).join('<br>');
 if(v&&typeof v==='object'){const url=v.url||v.driveUrl||v.href||'';if(url&&reviewHttp_(url))return '<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(v.name||v.fileName||'파일 열기')+'</a>';return Object.values(v).filter(x=>!reviewFieldEmpty_(x)&&typeof x!=='object').map(esc).join(' · ');}
 const text=String(v??'');if(reviewHttp_(text))return '<a href="'+esc(text)+'" target="_blank" rel="noopener noreferrer">링크 열기</a>';return esc(text);
}
function reviewDriveId_(url){const text=String(url||'');const marker='/d/';const pos=text.indexOf(marker);if(pos>=0)return text.slice(pos+marker.length).split('/')[0].split('?')[0];const idPos=text.indexOf('id=');if(idPos>=0)return text.slice(idPos+3).split('&')[0];return '';}
function reviewThumb_(url){const id=reviewDriveId_(url);return id?'https:'+'/'+'/'+'drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w240':url;}
function reviewMedia_(data){
 const items=[],seen=new Set();
 const add=(url,label,kind,name)=>{url=String(url||'');if(!reviewHttp_(url)||seen.has(url))return;seen.add(url);items.push({url,label,kind,name:name||label});};
 add(data.main_image_url,'대표 이미지','image');
 (Array.isArray(data.additional_image_urls)?data.additional_image_urls:[data.additional_image_urls]).filter(Boolean).forEach((url,i)=>add(url,'추가 이미지 '+(i+1),'image'));
 (Array.isArray(data.detail_page_urls)?data.detail_page_urls:[data.detail_page_url]).filter(Boolean).forEach((url,i)=>add(url,'상세페이지 '+(i+1),'detail'));
 (Array.isArray(data.attachments)?data.attachments:[]).forEach((file,i)=>{const url=typeof file==='string'?file:(file.url||file.driveUrl||file.href||'');const name=typeof file==='string'?'첨부 파일':(file.name||file.fileName||'첨부 파일');const category=typeof file==='object'?(file.category||file.type||''):'';const detail=String(category+' '+name).includes('상세페이지');const image=detail||String(category+' '+name).includes('이미지')||/\.(jpg|jpeg|png|webp|gif)$/i.test(name);add(url,detail?'상세페이지 '+(items.filter(x=>x.kind==='detail').length+1):image?'추가 이미지 '+(items.filter(x=>x.kind==='image').length):'첨부 파일 '+(i+1),detail?'detail':image?'image':'file',name);});
 return items;
}
function reviewMediaCard_(item){const visual=item.kind==='file'?'<span class="review-file-icon">FILE</span>':'<img src="'+esc(reviewThumb_(item.url))+'" alt="'+esc(item.label)+'" loading="lazy">';return '<a class="review-media-card" href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer" title="원본 열기 · '+esc(item.name)+'"><span class="review-media-thumb">'+visual+'</span><strong>'+esc(item.label)+'</strong><small>클릭하여 원본 보기</small></a>';}
function reviewMediaSection_(items,title){if(!items.length)return '';return '<section class="review-media-section"><div class="review-section-head"><h3>'+esc(title)+'</h3><span>'+items.length+'개</span></div><div class="review-media-grid">'+items.map(reviewMediaCard_).join('')+'</div></section>';}
function reviewSame_(a,b){return JSON.stringify(a==null?'':a)===JSON.stringify(b==null?'':b)}
function reviewDiffValue_(v){return reviewFieldEmpty_(v)?'<span class="review-empty">미입력</span>':reviewFieldValue_(v)}
function reviewMediaSummary_(data){const items=(data&&data.attachments)||[];return items.map(x=>x.category+': '+(x.name||'파일')).join(' · ')||[data&&data.main_image_url,data&&data.detail_page_url].filter(Boolean).join(' · ')}
function openSubmission(s){
 const data=s.data||{},base=s.baseData||{},media=reviewMedia_(data),productMedia=media.filter(x=>x.kind==='image'),detailMedia=media.filter(x=>x.kind!=='image');
 const defaults={product_name:'상품명',option_name:'옵션·용량',barcode:'바코드',category:'카테고리',retail_price:'소비자가',purchase_price:'공급가·매입가',consignment_price:'위탁 공급가',offline_consignment_price:'위탁 소비자가',online_lowest_price:'온라인 최저가',moq:'MOQ',trade_type:'거래방식',description:'상품 설명',reference_url:'참고 자료',product_url:'상품 링크'};
 const settings={};(State.reviewFields||[]).forEach(f=>settings[f.id]=f.label);
 const hidden=new Set(['product_id','_partner_request_id','_change_request','_source_submission_id','main_image_url','additional_image_urls','detail_page_url','detail_page_urls','attachments']);
 const keys=Array.from(new Set([...Object.keys(base),...Object.keys(data)])).filter(k=>!hidden.has(k)&&(!reviewFieldEmpty_(data[k])||!reviewFieldEmpty_(base[k])));
 const changed=keys.filter(k=>!reviewSame_(base[k],data[k]));
 const mediaChanged=s.isChangeRequest&&!reviewSame_(reviewMediaSummary_(base),reviewMediaSummary_(data));
 const fields=Object.entries(data).filter(([k,v])=>!hidden.has(k)&&!reviewFieldEmpty_(v)).map(([k,v])=>`<div class="field-group ${k==='description'?'full':''}"><label>${esc(settings[k]||defaults[k]||k.replace(/_/g,' '))}</label><div class="review-value">${reviewFieldValue_(v)}</div></div>`).join('');
 const comparison=s.isChangeRequest?`<section class="change-compare"><div class="change-compare-head"><div><span class="review-kicker">CHANGES</span><h3>변경 요청 ${changed.length+(mediaChanged?1:0)}개 항목</h3></div><span class="status-pill warn">승인 전 미반영</span></div>${changed.length||mediaChanged?`<div class="change-list">${changed.map(k=>`<article><strong>${esc(settings[k]||defaults[k]||k.replace(/_/g,' '))}</strong><div class="change-values"><div><small>현재 등록값</small><span>${reviewDiffValue_(base[k])}</span></div><i>→</i><div class="requested"><small>브랜드 요청값</small><span>${reviewDiffValue_(data[k])}</span></div></div></article>`).join('')}${mediaChanged?`<article><strong>이미지·첨부 파일</strong><div class="change-values"><div><small>현재 등록값</small><span>${esc(reviewMediaSummary_(base)||'없음')}</span></div><i>→</i><div class="requested"><small>브랜드 요청값</small><span>${esc(reviewMediaSummary_(data)||'없음')}</span></div></div></article>`:''}</div>`:'<div class="notice">기존 승인본과 달라진 항목이 없습니다.</div>'}</section>`:'';
 UI.modal(`<div class="review-modal-head"><div><span class="review-kicker">${s.isChangeRequest?'상품 변경 검수':'상품 검수'}</span><h2>${esc(data.product_name||'상품 검수')}</h2><p>${esc(s.brandName||s.brandCode||'브랜드 미지정')} · ${esc(s.submittedAt||'제출 정보')}</p></div><span class="status-pill ${s.isChangeRequest?'warn':'info'}">${esc(s.isChangeRequest?'변경 요청':s.status||'검수')}</span></div>${comparison}${reviewMediaSection_(productMedia,'요청된 상품 이미지')}${reviewMediaSection_(detailMedia,'요청된 상세페이지·첨부 자료')}<section class="review-info-section"><h3>요청 후 전체 상품 정보</h3><div class="form-grid">${fields||'<div class="subtle">표시할 상품 정보가 없습니다.</div>'}</div></section><div class="field-group full review-note"><label>검수 메모</label><textarea id="reviewNote" class="field-textarea" rows="4" placeholder="브랜드사에 전달할 내용을 입력하세요.">${esc(s.reviewNote||'')}</textarea></div><div class="modal-actions"><button class="danger-button" onclick="review('${esc(s.submissionId)}','reject')">반려</button><button class="secondary-button" onclick="review('${esc(s.submissionId)}','revision')">보완 요청</button><button class="primary-button" onclick="review('${esc(s.submissionId)}','approve')">${s.isChangeRequest?'변경 승인':'승인'}</button></div>`)
}

async function saveFields(){const fields=$$('#fieldRows tr').map((tr,i)=>({id:tr.dataset.id,label:tr.querySelector('.label').value,type:tr.querySelector('.type').value,required:tr.querySelector('.required').checked,active:tr.querySelector('.active').checked,order:Number(tr.querySelector('.order').value)||i+1,excel:true}));try{await server('saveAdminAction','saveFields',{fields});UI.toast('상품 항목 설정을 저장했습니다.')}catch(e){UI.toast(e.message,true)}}

function renderPartner(data){
 $('#app').className='partner-shell';$('#sidebar').remove();$('.main').className='partner-shell';$('.topbar').remove();const b=data.brand,c=data.counts;
 $('#content').className='partner-main';$('#content').innerHTML=`<div class="partner-top"><div class="brand-lockup"><span class="brand-mark">B</span><div><strong>BEAUTYORA</strong><small>상품등록센터</small></div></div><span class="subtle">${esc(b.brandCode)}</span></div><section class="partner-welcome"><h1>${esc(b.brandName)} 상품등록센터</h1><p>${esc(b.companyName)} · 상품정보와 필요한 파일을 제출해 주세요.</p></section><div class="partner-metrics">${partnerMetric('등록 상품',c.total)}${partnerMetric('검수 중',c.reviewing)}${partnerMetric('보완 필요',c.revision)}${partnerMetric('승인 완료',c.approved)}</div><div class="partner-actions"><button class="action-card" onclick="openDirectForm()"><strong>상품 직접 등록</strong><span>상품이 적을 때 화면에서 바로 입력합니다.</span></button><button class="action-card" onclick="openWorkbook()"><strong>엑셀 대량 등록</strong><span>여러 상품을 한 번에 검사하고 제출합니다.</span></button><button class="action-card" onclick="openFileUpload()"><strong>이미지·파일 등록</strong><span>대표 이미지와 상세페이지를 제출합니다.</span></button></div><section class="panel"><div class="panel-head"><h2>제출 현황</h2></div>${data.submissions.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>상품</th><th>수정일</th><th>상태</th><th>안내</th></tr></thead><tbody>${data.submissions.map(s=>`<tr><td><strong>${esc(s.data.product_name||'상품명 없음')}</strong><div class="subtle">${esc(s.data.option_name||'')}</div></td><td>${esc(s.updatedAt)}</td><td>${UI.status(s.status)}</td><td>${esc(s.reviewNote||'')}</td></tr>`).join('')}</tbody></table></div>`:UI.empty('아직 등록한 상품이 없습니다.','상품 직접 등록 또는 엑셀 대량 등록을 이용해 주세요.')}</section>`;
 $('#refreshBtn')?.remove();
}
function partnerMetric(label,value){return `<div class="metric-card"><small>${esc(label)}</small><strong>${Number(value)||0}</strong></div>`}
function fieldHtml(field,index){const name=`products[${index}][${field.id}]`,req=field.required?'required':'';let input;if(field.type==='select')input=`<select class="field-select" name="${name}" ${req}><option value="">선택</option>${String(field.options||'').split('|').filter(Boolean).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;else if(field.type==='textarea')input=`<textarea class="field-textarea" name="${name}" rows="3" ${req}></textarea>`;else input=`<input class="field-input" type="${field.type==='number'?'number':field.type==='url'?'url':'text'}" name="${name}" ${req}>`;return `<div class="field-group ${field.type==='textarea'?'full':''}"><label>${esc(field.label)}${field.required?' *':''}</label>${input}${field.help?`<span class="field-help">${esc(field.help)}</span>`:''}</div>`}
function openDirectForm(){const fields=State.bootstrap.fields;UI.modal(`<h2>상품 직접 등록</h2><p>상품정보를 입력한 뒤 제출해 주세요.</p><div id="productEditor" class="product-editor"></div><button class="secondary-button" style="margin-top:14px" onclick="addProductBlock()">+ 상품 추가</button><div id="formErrors"></div><div class="modal-actions"><button class="secondary-button" onclick="UI.closeModal()">취소</button><button class="primary-button" onclick="submitDirect()">상품 제출</button></div>`);addProductBlock()}
function addProductBlock(){const editor=$('#productEditor'),i=editor.children.length;const block=document.createElement('div');block.className='product-block';block.innerHTML=`<div class="product-block-head"><strong>상품 ${i+1}</strong>${i?'<button class="small-button" onclick="this.closest(\'.product-block\').remove()">삭제</button>':''}</div><div class="form-grid">${State.bootstrap.fields.map(f=>fieldHtml(f,i)).join('')}</div>`;editor.appendChild(block)}
async function submitDirect(){const blocks=$$('#productEditor .product-block');const products=blocks.map(block=>{const p={};block.querySelectorAll('[name]').forEach(input=>{const m=input.name.match(/\[([^\]]+)\]$/);if(m)p[m[1]]=input.value});return p});try{const r=await server('submitProducts',{token:State.token,products,contactName:'',contactPhone:''});if(!r.ok){$('#formErrors').innerHTML=`<div class="validation-box">${r.validationErrors.map(e=>`${e.row}번째 상품 · ${esc(e.message)}`).join('<br>')}</div>`;return}UI.closeModal();UI.toast(`${r.count}개 상품을 제출했습니다.`);setTimeout(()=>location.reload(),700)}catch(e){UI.toast(e.message,true)}}
function openWorkbook(){UI.modal(`<h2>엑셀 대량 등록</h2><p>첫 행에 상품 항목명이 있는 XLSX 파일을 올려주세요.</p><div class="file-drop"><input id="workbookFile" type="file" accept=".xlsx"><p class="subtle">최대 8MB · XLSX</p></div><div id="workbookResult"></div><div class="modal-actions"><button class="secondary-button" onclick="downloadTemplate()">CSV 양식 다운로드</button><button class="primary-button" onclick="analyzeWorkbook()">파일 검사</button></div>`)}
async function analyzeWorkbook(){const file=$('#workbookFile').files[0];if(!file)return UI.toast('파일을 선택해 주세요.',true);try{const base64=await fileBase64(file);const r=await server('importProductWorkbook',{token:State.token,fileName:file.name,base64});window.pendingProducts=r.products||[];$('#workbookResult').innerHTML=r.validationErrors?.length?`<div class="validation-box">${r.validationErrors.map(e=>`${e.row}행 · ${esc(e.message)}`).join('<br>')}</div>`:`<div class="validation-box" style="background:#edf8ef;color:#1f6b32">${r.products.length}개 상품을 정상적으로 확인했습니다.</div><button class="primary-button" onclick="submitWorkbookProducts()">확인한 상품 제출</button>`}catch(e){UI.toast(e.message,true)}}
async function submitWorkbookProducts(){try{const r=await server('submitProducts',{token:State.token,products:window.pendingProducts||[]});if(!r.ok)throw new Error('상품 정보를 다시 확인해 주세요.');UI.closeModal();UI.toast(`${r.count}개 상품을 제출했습니다.`);setTimeout(()=>location.reload(),700)}catch(e){UI.toast(e.message,true)}}
async function downloadTemplate(){const r=await server('getTemplateDefinition',State.token);const csv='\ufeff'+r.headers.map(csvCell).join(',')+'\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=r.fileName;a.click();URL.revokeObjectURL(a.href)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function openFileUpload(){UI.modal(`<h2>이미지·파일 등록</h2><p>대표 이미지, 상세페이지 또는 바코드 자료를 제출해 주세요.</p><div class="form-grid"><div class="field-group"><label>파일 분류</label><select id="fileCategory" class="field-select"><option>대표 이미지</option><option>상세페이지</option><option>바코드</option><option>상품 목록</option><option>기타</option></select></div><div class="field-group"><label>상품 ID 또는 상품명</label><input id="fileProduct" class="field-input"></div><div class="field-group full"><label>파일</label><input id="partnerFile" class="field-input" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf,.xlsx"><span class="field-help">최대 8MB</span></div></div><div class="modal-actions"><button class="secondary-button" onclick="UI.closeModal()">취소</button><button class="primary-button" onclick="uploadFile()">파일 제출</button></div>`)}
async function uploadFile(){const file=$('#partnerFile').files[0];if(!file)return UI.toast('파일을 선택해 주세요.',true);try{const base64=await fileBase64(file);await server('uploadPartnerFile',{token:State.token,fileName:file.name,mimeType:file.type,base64,category:$('#fileCategory').value,productId:$('#fileProduct').value});UI.closeModal();UI.toast('파일을 제출했습니다.')}catch(e){UI.toast(e.message,true)}}
function fileBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}

function renderIntake(rows){
 State.intakeRows=rows||[];
 const classify=r=>{
  const signal=[r.status,r.duplicateCheck,r.duplicateCandidate].join(' ');
  if(/등록 완료|기존 등록|승인 완료|처리 완료/.test(r.status||''))return 'done';
  if(r.duplicateCandidate||/중복|기존|일치 후보/.test(signal))return 'duplicate';
  return 'new';
 };
 const counts={new:0,duplicate:0,done:0};State.intakeRows.forEach(r=>counts[classify(r)]++);
 State.intakeView=State.intakeView||'new';
 if(!counts[State.intakeView]&&State.intakeView!=='all')State.intakeView=counts.new?'new':counts.duplicate?'duplicate':'done';
 $('#content').innerHTML=`<section class="intake-hero"><div><span class="intake-eyebrow">BRAND ONBOARDING</span><h2>입점 신청</h2><p>신규 브랜드를 먼저 확인하고, 기존·중복 후보는 별도 비교하세요.</p></div><button class="primary-button" onclick="syncBrandIntake()">최신 응답 가져오기</button></section><section class="intake-summary"><button class="intake-summary-card new" data-intake-view="new"><span class="intake-summary-icon">＋</span><span><small>신규 브랜드</small><strong>${counts.new}</strong><em>우선 검토</em></span></button><button class="intake-summary-card duplicate" data-intake-view="duplicate"><span class="intake-summary-icon">⇄</span><span><small>중복·기존 후보</small><strong>${counts.duplicate}</strong><em>비교 필요</em></span></button><button class="intake-summary-card done" data-intake-view="done"><span class="intake-summary-icon">✓</span><span><small>처리 완료</small><strong>${counts.done}</strong><em>보관 내역</em></span></button></section><section class="panel intake-panel"><div class="intake-toolbar"><div class="section-tabs intake-tabs"><button data-intake-view="new">신규 신청 <b>${counts.new}</b></button><button data-intake-view="duplicate">중복·기존 <b>${counts.duplicate}</b></button><button data-intake-view="done">처리 완료 <b>${counts.done}</b></button><button data-intake-view="all">전체 ${State.intakeRows.length}</button></div><input id="intakeSearch" class="search-input" placeholder="브랜드명·회사명 검색"></div><div id="intakeTable"></div></section>`;
 const paint=()=>{
  const q=$('#intakeSearch').value.toLowerCase();
  const view=State.intakeView;
  const list=State.intakeRows.filter(r=>(view==='all'||classify(r)===view)&&(!q||[r.brandName,r.companyName,r.intakeId,r.duplicateCandidate].join(' ').toLowerCase().includes(q)));
  $$('[data-intake-view]').forEach(b=>b.classList.toggle('active',b.dataset.intakeView===view));
  const kindTitle=view==='new'?'신규 브랜드':view==='duplicate'?'중복·기존 후보':view==='done'?'처리 완료':'전체 신청';
  const cards=list.map(r=>{const kind=classify(r),isNew=kind==='new',isDup=kind==='duplicate';return `<article class="intake-card ${kind}"><div class="intake-card-top"><span class="intake-kind ${kind}">${isNew?'NEW':isDup?'비교 필요':'완료'}</span><span class="subtle">${esc(fmt(r.receivedAt))}</span></div><div class="intake-card-body"><div><h3>${esc(r.brandName||'브랜드명 미입력')}</h3><p>${esc(r.companyName||'회사명 미입력')}</p></div>${UI.status(r.status||'검토 대기')}</div>${isDup?`<div class="duplicate-hint"><strong>중복 확인</strong><span>${esc(r.duplicateCandidate||r.duplicateCheck||'기존 브랜드와 비교가 필요합니다.')}</span></div>`:`<div class="intake-meta"><span>${esc(r.tradeType||'거래 방식 미정')}</span><span>${esc(r.contactName||'담당자 미입력')}</span></div>`}<div class="intake-card-actions"><span class="subtle">${esc(r.intakeId)}</span><button class="small-button ${isNew?'primary':''}" onclick="openBrandIntake('${esc(r.intakeId)}')">${isNew?'신규 검토':'상세 확인'}</button></div></article>`}).join('');
  $('#intakeTable').innerHTML=list.length?`<div class="intake-list-head"><div><strong>${kindTitle}</strong><span>${list.length}건</span></div><p>${view==='new'?'신규 신청을 우선 검토해 주세요.':view==='duplicate'?'기존 브랜드 정보와 비교한 뒤 승인 여부를 결정하세요.':'처리된 신청 내역입니다.'}</p></div><div class="intake-grid">${cards}</div>`:UI.empty('표시할 신청이 없습니다.',view==='new'?'현재 신규 브랜드 신청이 없습니다.':'조건에 맞는 신청을 찾지 못했습니다.');
 };
 $$('[data-intake-view]').forEach(btn=>btn.addEventListener('click',()=>{State.intakeView=btn.dataset.intakeView;paint()}));
 $('#intakeSearch').addEventListener('input',paint);paint();
}

function openBrandIntake(intakeId){const r=(State.intakeRows||[]).find(x=>x.intakeId===intakeId);if(!r)return;const done=/등록 완료|기존 등록/.test(r.status);UI.modal(`<div class="modal-title"><div><h2>${esc(r.brandName)}</h2><span class="subtle">${esc(r.intakeId)} · ${esc(r.status)}</span></div></div><div class="detail-grid"><div><label>회사명</label><strong>${esc(fmt(r.companyName))}</strong></div><div><label>사업자번호</label><strong>${esc(fmt(r.businessNo))}</strong></div><div><label>담당자</label><strong>${esc(fmt(r.contactName))}</strong></div><div><label>연락처</label><strong>${esc(fmt(r.phone))}</strong></div><div><label>이메일</label><strong>${esc(fmt(r.email))}</strong></div><div><label>중복 확인</label><strong>${esc(fmt(r.duplicateCheck))}</strong></div></div><div class="detail-block"><label>상품 특징</label><p>${esc(fmt(r.feature))}</p></div>${r.duplicateCandidate?`<div class="notice warn">기존 후보: ${esc(r.duplicateCandidate)}</div>`:''}${r.error?`<div class="notice error">${esc(r.error)}</div>`:''}${r.notionUrl?`<p><a href="${esc(r.notionUrl)}" target="_blank">Notion 브랜드 페이지 열기</a></p>`:''}${done?'':`<div class="modal-actions"><button class="quiet-button" onclick="reviewBrandIntake('${esc(r.intakeId)}','hold')">보류</button><button class="primary-button" onclick="reviewBrandIntake('${esc(r.intakeId)}','approve')">승인</button></div>`}`)}

async function syncBrandIntake(){try{const out=await server('saveAdminAction','syncBrandIntake',{});State.intakeRows=out.rows||[];UI.toast(`신규 응답 ${out.imported||0}건을 가져왔습니다.`);renderIntake(State.intakeRows)}catch(e){UI.toast(e.message,true)}}

async function reviewBrandIntake(intakeId,action){if(action==='approve'&&!confirm('이 브랜드를 승인하고 Notion 브랜드 DB에 등록할까요?'))return;try{await server('saveAdminAction','reviewBrandIntake',{intakeId,action});UI.closeModal();UI.toast(action==='approve'?'브랜드 승인과 Notion 등록을 처리했습니다.':'보류로 변경했습니다.');go('intake',true)}catch(e){UI.toast(e.message,true)}}
</script>
