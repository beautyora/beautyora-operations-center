
<script>
const CRM={data:null,view:'all',query:'',owner:'',stage:'',category:'',page:1,detail:null,tab:'overview',dirty:false,saving:false,request:null,load:0,focus:null,loadedAt:0};
const crmBaseGo=go;go=async function(route,force=false){if(CRM.dirty){UI.toast('편집 중인 내용을 저장하거나 상세 패널에서 변경사항을 버려 주세요.',true);return}crmClose(true);if(route!=='brands')return crmBaseGo(route,force);State.route='brands';$$('#adminNav .nav-item').forEach(b=>b.classList.toggle('active',b.dataset.route==='brands'));$('#sidebar').classList.remove('open');$('#pageTitle').textContent='브랜드';$('#pageSubtitle').textContent='브랜드의 영업부터 상품·거래 자료까지 한곳에서 관리하세요.';if(!force&&CRM.data&&Date.now()-CRM.loadedAt<180000){crmRender();return}$('#content').innerHTML='<div class="crm-busy">브랜드 정보를 불러오고 있습니다.</div>';const n=++CRM.load;try{const data=await server('getBrandWorkspace');if(n!==CRM.load||State.route!=='brands')return;CRM.data=data;CRM.loadedAt=Date.now();crmRender()}catch(e){$('#content').innerHTML=UI.empty('불러오지 못했습니다.',e.message)}};
function crmEscape(v){return esc(v??'')}
function crmChip(v,cls=''){return '<span class="crm-chip '+cls+'">'+esc(v||'미지정')+'</span>'}
function crmUrl(v){try{const u=new URL(String(v||''));return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}}
function crmLink(url,label){const u=crmUrl(url);return u?'<a class="crm-link" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>':'<span class="crm-muted">링크 없음</span>'}
function crmPlain(v){if(Array.isArray(v))return v.join(', ');return String(v??'').replace(/<br\s*\/?>/gi,'\n').replace(/\\([\[\]])/g,'$1')}
function crmOptions(values,current,label){return '<option value="">'+esc(label)+'</option>'+[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko')).map(v=>'<option '+(v===current?'selected':'')+' value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
function crmView(v){CRM.view=v;CRM.page=1;crmRender()}
function crmRender(){const rows=CRM.data.rows,today=CRM.data.today;$('#content').innerHTML='<div class="crm-workspace"><div class="crm-top"><div><h2>브랜드 업무 현황</h2><div class="crm-muted">'+rows.length+'개 브랜드 · 상담 기록과 자료를 이어서 확인하세요.</div></div><span class="crm-chip good">Google Sheets에서 관리</span></div><div class="crm-metrics">'+[['오늘 연락',rows.filter(b=>b.nextDate===today).length,'today'],['연락 기한 초과',rows.filter(b=>b.nextDate&&b.nextDate<today).length,'overdue'],['상품 보유 브랜드',rows.filter(b=>b.productCount>0).length,'products'],['담당자 미배정',rows.filter(b=>!b.owner).length,'unassigned']].map(x=>'<button class="crm-metric" onclick="crmView(\''+x[2]+'\')"><span class="crm-muted">'+x[0]+'</span><strong>'+x[1]+'</strong></button>').join('')+'</div><section class="crm-panel"><div class="crm-views">'+[['all','전체 브랜드'],['follow','후속 연락'],['products','상품 보유'],['unassigned','미배정']].map(x=>'<button class="'+(CRM.view===x[0]?'active':'')+'" onclick="crmView(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div><div class="crm-toolbar"><input id="crmSearch" aria-label="브랜드 검색" placeholder="브랜드, 회사, 담당자, 상담 메모 검색" value="'+esc(CRM.query)+'"><select id="crmOwner" aria-label="사내 담당자">'+crmOptions(rows.map(b=>b.owner),CRM.owner,'전체 담당자')+'</select><select id="crmStage" aria-label="영업 단계">'+crmOptions(rows.map(b=>b.salesStage),CRM.stage,'전체 영업 단계')+'</select><select id="crmCategory" aria-label="카테고리">'+crmOptions(rows.flatMap(b=>b.category.split(',').map(s=>s.trim())),CRM.category,'전체 카테고리')+'</select><button class="crm-btn" onclick="crmReset()">초기화</button></div><div id="crmTable"></div></section></div>';$('#crmSearch').oninput=e=>{CRM.query=e.target.value;CRM.page=1;crmPaint()};[['crmOwner','owner'],['crmStage','stage'],['crmCategory','category']].forEach(([id,key])=>$('#'+id).onchange=e=>{CRM[key]=e.target.value;CRM.page=1;crmPaint()});crmPaint()}
function crmReset(){Object.assign(CRM,{view:'all',query:'',owner:'',stage:'',category:'',page:1});crmRender()}
function crmFiltered(){const today=CRM.data.today,q=CRM.query.trim().toLowerCase();return CRM.data.rows.filter(b=>(!q||[b.brandName,b.companyName,b.brandCode,b.owner,b.contact,b.memo,b.nextAction,b.recent?.text].join(' ').toLowerCase().includes(q))&&(!CRM.owner||b.owner===CRM.owner)&&(!CRM.stage||b.salesStage===CRM.stage)&&(!CRM.category||b.category.split(',').map(s=>s.trim()).includes(CRM.category))&&(CRM.view==='all'||CRM.view==='today'&&b.nextDate===today||CRM.view==='overdue'&&b.nextDate&&b.nextDate<today||CRM.view==='follow'&&(b.nextAction||b.nextDate)||CRM.view==='products'&&b.productCount>0||CRM.view==='unassigned'&&!b.owner)).sort((a,b)=>{if(CRM.view==='today'||CRM.view==='overdue'||CRM.view==='follow')return (a.nextDate||'9999').localeCompare(b.nextDate||'9999')||a.brandCode.localeCompare(b.brandCode);return a.brandCode.localeCompare(b.brandCode)})}
function crmPaint(){const list=crmFiltered(),pages=Math.max(1,Math.ceil(list.length/25));CRM.page=Math.min(CRM.page,pages);const shown=list.slice((CRM.page-1)*25,CRM.page*25);$('#crmTable').innerHTML=(shown.length?'<div class="crm-table-wrap"><table class="crm-table"><thead><tr><th>브랜드 / 회사</th><th>사내 담당자</th><th>영업 단계</th><th>상품</th><th>다음 행동</th><th>최근 활동</th></tr></thead><tbody>'+shown.map(b=>'<tr><td><button class="crm-brand-button" data-brand="'+esc(b.brandCode)+'"><span class="crm-avatar">'+esc(b.brandName.slice(0,1))+'</span><span><strong>'+esc(b.brandName)+'</strong><span class="crm-muted">'+esc(b.companyName)+' · '+esc(b.brandCode)+'</span></span></button></td><td>'+esc(b.owner||'미배정')+'<div class="crm-muted">브랜드 담당 '+esc(b.contact||'미등록')+'</div></td><td>'+crmChip(b.salesStage,/확정/.test(b.salesStage)?'good':'')+'<div class="crm-muted" style="margin-top:5px">'+esc(b.reStage?'재영업 · '+b.reStage:'')+'</div></td><td><strong>'+b.productCount+'</strong><span class="crm-muted">개</span>'+(b.revisionCount?'<div class="crm-overdue">보완 '+b.revisionCount+'</div>':b.reviewCount?'<div class="crm-muted">검토 '+b.reviewCount+'</div>':'')+'</td><td><div class="crm-clamp">'+esc(b.nextAction||'등록된 다음 행동 없음')+'</div><div class="'+(b.nextDate&&b.nextDate<CRM.data.today?'crm-overdue':'crm-muted')+'">'+esc(b.nextDate||(b.nextAction?'일정 미지정':''))+'</div></td><td><div class="crm-clamp crm-muted">'+esc(b.recent?.text||'상담 기록 없음')+'</div><div class="crm-muted">'+esc(b.recent?.date||'')+'</div></td></tr>').join('')+'</tbody></table></div>':'<div class="crm-empty">조건에 맞는 브랜드가 없습니다.<br>검색어 또는 필터를 변경해 주세요.</div>')+'<div class="crm-pagination"><span class="crm-muted">'+list.length+'개 브랜드 · '+CRM.page+' / '+pages+' 페이지</span><div><button '+(CRM.page===1?'disabled':'')+' onclick="CRM.page--;crmPaint()">이전</button> <button '+(CRM.page===pages?'disabled':'')+' onclick="CRM.page++;crmPaint()">다음</button></div></div>';$$('[data-brand]').forEach(el=>el.onclick=()=>crmOpen(el.dataset.brand))}
async function crmOpen(code){if(CRM.saving)return;if(CRM.dirty){UI.toast('먼저 변경사항을 저장해 주세요.',true);return}CRM.focus=document.activeElement;crmClose(true);const backdrop=document.createElement('div');backdrop.id='crmDrawer';backdrop.className='crm-drawer-backdrop';backdrop.innerHTML='<section class="crm-drawer" role="dialog" aria-modal="true" aria-label="브랜드 상세" tabindex="-1"><div class="crm-busy">브랜드 상세를 불러오고 있습니다.</div></section>';document.body.appendChild(backdrop);document.body.style.overflow='hidden';backdrop.onclick=e=>{if(e.target===backdrop)crmClose()};$('.crm-drawer').focus();const n=++CRM.load;try{const d=await server('getBrandDetail',code);if(n!==CRM.load||!$('#crmDrawer'))return;CRM.detail=d;CRM.tab='overview';CRM.request=null;crmDrawerRender()}catch(e){if($('#crmDrawer'))$('.crm-drawer').innerHTML='<div class="crm-busy">'+esc(e.message)+'<p><button class="crm-btn" onclick="crmClose()">닫기</button></p></div>'}}
function crmClose(force=false){if(CRM.saving&&!force)return;if(CRM.dirty&&!force){const foot=$('#crmDirty');if(foot)foot.innerHTML='<span>저장하지 않은 변경사항이 있습니다.</span><button class="crm-btn" onclick="CRM.dirty=false;crmClose(true)">변경사항 버리기</button>';return}const el=$('#crmDrawer');if(el){el.remove();document.body.style.overflow='';CRM.focus?.focus()}CRM.dirty=false;CRM.detail=null;CRM.load++}
function crmTab(tab){if(CRM.saving)return;if(CRM.dirty){UI.toast('현재 입력을 저장한 뒤 다른 탭을 열어 주세요.',true);return}CRM.tab=tab;crmDrawerRender()}
function crmDrawerRender(){const d=CRM.detail,b=d.brand;$('.crm-drawer').innerHTML='<div class="crm-drawer-head"><button class="crm-close" aria-label="브랜드 상세 닫기" onclick="crmClose()">×</button><h2>'+esc(b.brandName)+'</h2><div class="crm-muted">'+esc(b.companyName)+' · '+esc(b.brandCode)+'</div><div style="margin-top:12px;display:flex;gap:7px">'+crmChip(b.workflow||'전환 확인 전')+crmChip('상품 '+(d.counts?.products??d.products.length)+'개')+crmChip('영업 기록 '+d.activities.length+'건')+'</div></div><nav class="crm-tabs" aria-label="브랜드 상세 탭">'+[['overview','개요'],['activity','영업 기록'],['products','상품'],['terms','거래 조건'],['stock','입출고·재고'],['archive','제출자료'],['profile','정보 수정'],['campaign','매입 전환']].map(x=>'<button class="crm-tab '+(CRM.tab===x[0]?'active':'')+'" onclick="crmTab(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</nav><div class="crm-drawer-body" id="crmBody"></div><div class="crm-save-status" id="crmDirty"><span class="crm-muted">변경사항은 뷰티오라DB에 저장됩니다.</span><span class="crm-muted">노션 원본 보존</span></div>';perfRenderDetailBody();$('#crmBody').addEventListener('input',e=>{if(!e.target.closest('form'))return;CRM.dirty=true;$('#crmDirty').innerHTML='<span>저장하지 않은 변경사항</span><span class="crm-muted">하단 저장 버튼을 눌러 주세요.</span>'})}
function crmField(key,label,value,large=false,type='text'){return '<div class="crm-field '+(large?'full':'')+'"><label for="cf-'+key+'">'+esc(label)+'</label>'+(large?'<textarea id="cf-'+key+'" name="'+key+'" rows="3">'+esc(value||'')+'</textarea>':'<input id="cf-'+key+'" name="'+key+'" type="'+type+'" value="'+esc(value||'')+'">')+'</div>'}
function crmProfileView(){const b=CRM.detail.brand;$('#crmBody').innerHTML='<form id="crmProfile"><section class="crm-section"><h3>브랜드와 담당자</h3><div class="crm-grid">'+[['brandName','브랜드명 *'],['companyName','회사명'],['owner','사내 담당자'],['contact','브랜드 담당자'],['phone','연락처'],['email','이메일'],['category','카테고리'],['trade','기존 희망 거래 방식'],['logo','브랜드 로고 이미지 주소']].map(([k,l])=>crmField(k,l,b[k])).join('')+'</div></section><section class="crm-section"><h3>기존 영업 정보</h3><div class="crm-grid">'+[['salesStage','기존 영업 단계'],['reStage','기존 재영업 단계'],['priority','기존 우선순위'],['nextDate','기존 연락 예정일']].map(([k,l])=>crmField(k,l,b[k],false,k==='nextDate'?'date':'text')).join('')+crmField('nextAction','이관 메모',b.nextAction,true)+crmField('memo','핵심 메모',b.memo,true)+crmField('channels','희망 채널',b.channels,true)+crmField('reference','참고 링크·자료',b.reference,true)+'</div><div class="crm-actions"><button type="submit" class="crm-btn primary">변경사항 저장</button></div></section></form><section class="crm-section"><h3>브랜드 소개</h3><div class="crm-raw">'+esc(b.features||b.productGroup||'등록된 소개가 없습니다.')+'</div></section><section class="crm-section"><h3>상품등록 링크</h3>'+(CRM.detail.link?'<div class="crm-muted">사용 중인 링크가 있습니다.</div><div class="crm-actions"><button class="crm-btn" id="crmCopyLink">링크 복사</button>'+crmLink(CRM.detail.link.url,'등록 화면 열기')+'</div>':'<div class="crm-muted">아직 발급된 링크가 없습니다.</div><div class="crm-actions"><button class="crm-btn" id="crmIssueLink">30일 링크 발급</button></div>')+'</section>';$('#crmProfile').onsubmit=crmSaveProfile;if($('#crmCopyLink'))$('#crmCopyLink').onclick=()=>copyText(CRM.detail.link.url);if($('#crmIssueLink'))$('#crmIssueLink').onclick=crmIssue}
async function crmSaveProfile(e){e.preventDefault();if(CRM.saving)return;const b=CRM.detail.brand,p=Object.fromEntries(new FormData(e.target).entries());p.brandCode=b.brandCode;p.version=b.version;CRM.saving=true;const btn=e.target.querySelector('[type=submit]');btn.disabled=true;btn.textContent='저장 중…';try{const r=await server('saveBrandProfile',p);CRM.dirty=false;UI.toast(r.changed?'브랜드 정보를 저장했습니다.':'변경된 내용이 없습니다.');await crmReloadDetail()}catch(err){UI.toast(err.message,true)}finally{CRM.saving=false;if(btn.isConnected){btn.disabled=false;btn.textContent='변경사항 저장'}}}
async function crmReloadDetail(){const code=CRM.detail.brand.brandCode;const d=await server('getBrandDetail',code);if(CRM.detail?.brand.brandCode!==code)return;CRM.detail=d;crmDrawerRender();const data=await server('getBrandWorkspace');CRM.data=data;CRM.loadedAt=Date.now();if(State.route==='brands')crmRender()}
async function crmIssue(){if(CRM.dirty){UI.toast('브랜드 정보를 먼저 저장해 주세요.',true);return}const btn=$('#crmIssueLink');btn.disabled=true;try{await server('saveAdminAction','issuePartnerLink',{brandCode:CRM.detail.brand.brandCode});UI.toast('상품등록 링크를 발급했습니다.');await crmReloadDetail()}catch(e){UI.toast(e.message,true);btn.disabled=false}}
function crmActivity(){const d=CRM.detail;$('#crmBody').innerHTML='<section class="crm-section"><h3>연락 기록 추가</h3><form id="crmActivityForm"><div class="crm-grid">'+crmField('date','활동일 *',CRM.data.today,false,'date')+'<div class="crm-field"><label for="cf-method">연락 방식</label><select id="cf-method" name="method">'+['전화','이메일','미팅','메신저','기타'].map(v=>'<option>'+v+'</option>').join('')+'</select></div>'+crmField('contact','상대 담당자',d.brand.contact)+crmField('result','결과','')+crmField('content','상담 내용 *','',true)+crmField('nextAction','다음 행동','',true)+crmField('due','후속 확인일','',false,'date')+'</div><div class="crm-actions"><button type="submit" class="crm-btn primary">연락 기록 저장</button></div></form></section><section class="crm-section"><h3>연락·진행 이력 <span class="crm-muted">'+d.activities.length+'건</span></h3>'+(d.activities.length?d.activities.map((a,i)=>'<article class="crm-note"><header>'+crmChip(a.method)+'<strong>'+esc(a.result||a.title||'상담 기록')+'</strong><small>'+esc(a.date||'활동일 미기록')+'</small></header><div class="crm-muted" style="margin-top:7px">'+esc(a.source)+' · '+esc(a.owner||'작성자 미기록')+'</div><p>'+esc(a.content||a.title||'별도 상담 내용 없음')+'</p>'+(a.nextAction?'<div class="crm-next">'+(a.complete?'완료 · ':'다음 행동 · ')+esc(a.nextAction)+'<div class="crm-muted">'+esc(a.due||'후속일 미지정')+'</div></div>':'')+(a.source==='운영센터'&&a.nextAction&&!a.complete?'<div class="crm-actions"><button class="crm-btn" data-complete="'+i+'">후속 업무 완료</button></div>':'')+'</article>').join(''):'<div class="crm-empty">아직 상담 기록이 없습니다.</div>')+'</section>';$('#crmActivityForm').onsubmit=crmSaveActivity;$$('[data-complete]').forEach(el=>el.onclick=()=>crmComplete(Number(el.dataset.complete)))}
async function crmSaveActivity(e){e.preventDefault();if(CRM.saving)return;const p=Object.fromEntries(new FormData(e.target).entries());if(!p.content.trim()){UI.toast('상담 내용을 입력해 주세요.',true);$('#cf-content').focus();return}CRM.request=CRM.request||crypto.randomUUID();p.requestId=CRM.request;p.brandCode=CRM.detail.brand.brandCode;const btn=e.target.querySelector('[type=submit]');btn.disabled=true;btn.textContent='저장 중…';CRM.saving=true;try{await server('addBrandActivity',p);CRM.dirty=false;CRM.request=null;UI.toast('연락 기록을 저장했습니다.');await crmReloadDetail()}catch(err){UI.toast(err.message,true)}finally{CRM.saving=false;if(btn.isConnected){btn.disabled=false;btn.textContent='연락 기록 저장'}}}
async function crmComplete(i){if(CRM.dirty){UI.toast('작성 중인 기록을 먼저 저장해 주세요.',true);return}if(CRM.saving)return;CRM.saving=true;try{await server('completeBrandActivity',{id:CRM.detail.activities[i].id,brandCode:CRM.detail.brand.brandCode});await crmReloadDetail();UI.toast('후속 업무를 완료했습니다.')}catch(e){UI.toast(e.message,true)}finally{CRM.saving=false}}
function crmProducts(){const p=CRM.detail.products;$('#crmBody').innerHTML='<section class="crm-section"><h3>등록 상품 '+p.length+'개</h3>'+(p.length?'<div class="crm-table-wrap"><table class="crm-table" style="min-width:580px"><thead><tr><th>상품</th><th>소비자가</th><th>검토 상태</th></tr></thead><tbody>'+p.map(x=>'<tr><td><strong>'+esc(x.name)+'</strong><div class="crm-muted">'+esc(x.option||x.id)+'</div><div class="crm-muted">바코드: '+esc(x.barcode||'확인 필요')+'</div></td><td>'+(Number(x.price)>0?esc(money(x.price)):'미등록')+'</td><td>'+crmChip(x.status)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="crm-empty">아직 연결된 상품이 없습니다.<br>개요에서 상품등록 링크를 발급할 수 있습니다.</div>')+'</section>'}
function crmLegacyTerms(){const rows=CRM.detail.conditions;$('#crmBody').innerHTML='<section class="crm-section"><h3>브랜드 거래 방향</h3><div class="crm-keyval"><span>희망 거래 방식</span><span>'+esc(CRM.detail.brand.trade||'미등록')+'</span></div><div class="crm-keyval"><span>희망 채널</span><span>'+esc(CRM.detail.brand.channels||'미등록')+'</span></div></section><section class="crm-section"><h3>상품별 공급조건</h3><p class="crm-muted">기존 이관값을 그대로 표시합니다. 0원이나 미입력 값은 거래 확정 전에 확인해 주세요.</p>'+(rows.length?rows.map(r=>'<details><summary>'+esc(r['상품명'])+'</summary>'+['거래방식','매입가','위탁공급가','소비자가','MOQ','배송비','온라인판매조건','유통기한'].map(k=>'<div class="crm-keyval"><span>'+k+'</span><span>'+esc(crmPlain(r[k])||'미등록')+'</span></div>').join('')+'</details>').join(''):'<div class="crm-empty">연결된 공급조건이 없습니다.</div>')+'</section>'}
function crmBodyText(body){return String(body||'').replace(/<database[^>]*>[\s\S]*?<\/database>/g,'\n[연결된 상품·연락 이력은 상세 탭에서 확인하세요.]\n').replace(/<file[^>]*>[\s\S]*?<\/file>/g,'\n[첨부파일: 위 자료 목록에서 확인하세요.]\n').replace(/!\[[^\]]*\]\([^\n]+\)/g,'[첨부 이미지: 위 자료 목록에서 확인하세요.]').replace(/<mention-user[^>]*>[\s\S]*?<\/mention-user>/g,'[담당자]').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/^#{1,6}\s*/gm,'').replace(/\*\*/g,'').trim()}
function crmArchive(){const d=CRM.detail;$('#crmBody').innerHTML='<section class="crm-section"><h3>보관 자료</h3><p class="crm-muted">노션의 원본은 유지하고, 아래 본문은 구글 시트에 보존했습니다.</p>'+(d.files.length?d.files.map(f=>'<div class="crm-keyval"><span>'+esc(f['파일명'])+'</span><span>'+crmChip(f['상태'],f['상태']==='보관 완료'?'good':'warn')+' '+(f['Drive주소']?crmLink(f['Drive주소'],'Drive에서 열기'):crmLink(f['원본페이지'],'원본에서 확인'))+'</span></div>').join(''):'<div class="crm-muted">별도 첨부파일이 없습니다.</div>')+'</section>'+d.archive.map((a,i)=>'<section class="crm-section"><h3>'+esc(a.type)+' · '+esc(a.title)+'</h3><div class="crm-muted" style="margin-bottom:16px">'+crmLink(a.url,'노션 원본 열기')+' · 이관 '+esc(a.importedAt.slice(0,10))+'</div><div class="crm-raw">'+esc(crmBodyText(a.body)||'본문 내용 없음')+'</div><details style="margin-top:20px"><summary>원본 속성 전체 보기</summary>'+Object.entries(a.properties).filter(([k,v])=>v!==''&&v!=null&&!/is_datetime|formulaResult/.test(k+' '+v)).map(([k,v])=>'<div class="crm-keyval"><span>'+esc(k)+'</span><span style="white-space:pre-wrap">'+esc(crmPlain(v))+'</span></div>').join('')+'</details></section>').join('')}
document.addEventListener('keydown',e=>{const el=$('#crmDrawer');if(!el)return;if(e.key==='Escape'){e.preventDefault();crmClose()}if(e.key==='Tab'){const a=[...el.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]')].filter(x=>x.offsetParent!==null);if(!a.length)return;if(e.shiftKey&&document.activeElement===a[0]){a[a.length-1].focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===a[a.length-1]){a[0].focus();e.preventDefault()}}});
window.addEventListener('beforeunload',e=>{if(CRM.dirty){e.preventDefault();e.returnValue=''}});
</script>

<script>
Object.assign(CRM,{layout:'list',priority:'',editingTerm:null,termRequest:null});
function crmImage(url,name,cls='crm-avatar'){const u=crmUrl(url);return '<span class="'+cls+'">'+(u?'<img src="'+esc(u)+'" alt="'+esc(name)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true;this.parentElement.setAttribute(\'aria-label\',\'이미지를 불러오지 못했습니다\')">':esc((name||'B').slice(0,1)))+'</span>'}
function crmDone(b){return ['매입 진행 확정','진행 불가','보류'].includes(b.workflow)}
function crmLayout(v){CRM.layout=v;crmRender()}
crmRender=function(){const rows=CRM.data.rows,today=CRM.data.today;const metrics=[['전환 연락 대상',rows.filter(b=>['전환 확인 전','재연락'].includes(b.workflow)).length,'contact'],['진행 중 검토',rows.filter(b=>['회신 대기','상품 검토','샘플 검토','조건 협의'].includes(b.workflow)).length,'review'],['매입 진행 확정',rows.filter(b=>b.workflow==='매입 진행 확정').length,'confirmed'],['기존 위탁 재고 보유',rows.filter(b=>b.stock.consignment>0).length,'consignment']];$('#content').innerHTML='<div class="crm-workspace"><div class="crm-top"><div><h2>브랜드 파트너</h2><p class="crm-muted">'+rows.length+'개 브랜드 · 신규 매입 검토와 기존 위탁 운영을 함께 관리하세요.</p></div><div class="crm-mode"><button class="crm-btn '+(CRM.layout==='list'?'active':'')+'" onclick="crmLayout(\'list\')">업무 목록</button><button class="crm-btn '+(CRM.layout==='cards'?'active':'')+'" onclick="crmLayout(\'cards\')">브랜드 둘러보기</button></div></div><div class="crm-metrics">'+metrics.map(x=>'<button class="crm-metric" aria-pressed="'+(CRM.view===x[2])+'" onclick="crmView(\''+x[2]+'\')"><span class="crm-muted">'+x[0]+'</span><strong>'+x[1]+'</strong></button>').join('')+'</div><section class="crm-panel"><div class="crm-views">'+[['all','전체'],['contact','전환 연락'],['review','매입 검토'],['today','오늘·지연 업무'],['unscheduled','일정 미등록'],['consignment','기존 위탁'],['unknown','재고 분류 확인']].map(x=>'<button class="'+(CRM.view===x[0]?'active':'')+'" onclick="crmView(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div><div class="crm-toolbar"><input id="crmSearch" aria-label="브랜드 검색" placeholder="브랜드·회사·담당자·상담 내용 검색" value="'+esc(CRM.query)+'"><select id="crmOwner" aria-label="사내 담당자">'+crmOptions(rows.map(b=>b.owner),CRM.owner,'전체 담당자')+'</select><select id="crmStage" aria-label="매입 전환 상태">'+crmOptions(CRM.data.stages,CRM.stage,'전체 매입 상태')+'</select><select id="crmPriority" aria-label="전환 연락 순위">'+crmOptions(['1순위','2순위','3순위'],CRM.priority,'전체 연락 순위')+'</select><select id="crmCategory" aria-label="카테고리">'+crmOptions(rows.flatMap(b=>b.category.split(',').map(s=>s.trim())),CRM.category,'전체 카테고리')+'</select><button class="crm-btn" onclick="crmReset()">초기화</button></div><div id="crmTable"></div></section><p class="crm-muted">1순위 기존 팜픽 확정 · 2순위 기존 상품 리스트 · 3순위 신규·상품 미등록. 매입 전환 결과는 통화 후 별도로 기록합니다.</p></div>';$('#crmSearch').oninput=e=>{CRM.query=e.target.value;CRM.page=1;crmPaint()};[['crmOwner','owner'],['crmStage','stage'],['crmCategory','category'],['crmPriority','priority']].forEach(([id,k])=>$('#'+id).onchange=e=>{CRM[k]=e.target.value;CRM.page=1;crmPaint()});crmPaint()};
crmReset=function(){Object.assign(CRM,{view:'all',query:'',owner:'',stage:'',category:'',priority:'',page:1});crmRender()};
crmFiltered=function(){const q=CRM.query.trim().toLowerCase(),today=CRM.data.today;return CRM.data.rows.filter(b=>(!q||[b.brandName,b.companyName,b.brandCode,b.owner,b.contact,b.memo,b.task,b.nextAction,b.recent?.text].join(' ').toLowerCase().includes(q))&&(!CRM.owner||b.owner===CRM.owner)&&(!CRM.stage||b.workflow===CRM.stage)&&(!CRM.priority||b.contactPriority===CRM.priority)&&(!CRM.category||b.category.split(',').map(s=>s.trim()).includes(CRM.category))&&(CRM.view==='all'||CRM.view==='contact'&&['전환 확인 전','재연락'].includes(b.workflow)||CRM.view==='review'&&['회신 대기','상품 검토','샘플 검토','조건 협의'].includes(b.workflow)||CRM.view==='confirmed'&&b.workflow==='매입 진행 확정'||CRM.view==='consignment'&&b.stock.consignment>0||CRM.view==='unknown'&&b.stock.unknown>0||CRM.view==='today'&&b.taskDate&&b.taskDate<=today&&!crmDone(b)||CRM.view==='unscheduled'&&!b.taskDate&&!crmDone(b))).sort((a,b)=>(CRM.view==='contact'?a.contactPriority.localeCompare(b.contactPriority):CRM.view==='today'?(a.taskDate||'9999').localeCompare(b.taskDate||'9999'):0)||a.brandCode.localeCompare(b.brandCode))};
function crmStockBadges(b){return (b.stock.consignment>0?crmChip('위탁 '+b.stock.consignment):'')+' '+(b.stock.purchase>0?crmChip('매입 '+b.stock.purchase,'good'):'')+' '+(b.stock.unknown>0?crmChip('분류 확인 '+b.stock.unknown,'warn'):'')}
crmPaint=function(){const list=crmFiltered(),per=CRM.layout==='cards'?12:25,pages=Math.max(1,Math.ceil(list.length/per));CRM.page=Math.min(CRM.page,pages);const shown=list.slice((CRM.page-1)*per,CRM.page*per);let html='';if(!shown.length)html='<div class="crm-empty">조건에 맞는 브랜드가 없습니다.</div>';else if(CRM.layout==='cards')html='<div class="crm-catalog">'+shown.map(b=>'<article class="crm-card">'+crmImage(b.logo||b.cover,b.brandName,'crm-card-cover')+'<div class="crm-card-body"><h3>'+esc(b.brandName)+'</h3><div class="crm-muted">'+esc(b.category||'카테고리 미등록')+' · 상품 '+b.productCount+'개</div><p class="crm-clamp crm-muted">'+esc(b.features||b.memo||b.companyName)+'</p>'+crmChip(b.workflow,b.workflow==='매입 진행 확정'?'good':'')+'<div style="margin-top:8px">'+crmStockBadges(b)+'</div><div class="crm-card-footer"><span class="crm-muted">'+esc(b.owner||'담당 미배정')+'</span><button class="crm-btn" data-brand="'+esc(b.brandCode)+'">브랜드 보기</button></div></div></article>').join('')+'</div>';else html='<div class="crm-table-wrap"><table class="crm-table"><thead><tr><th>브랜드 / 담당자</th><th>매입 전환</th><th>상품·현재 재고</th><th>다음 업무</th><th>최근 상담</th></tr></thead><tbody>'+shown.map(b=>'<tr><td><button class="crm-brand-button" data-brand="'+esc(b.brandCode)+'">'+crmImage(b.logo,b.brandName)+'<span><strong>'+esc(b.brandName)+'</strong><span class="crm-muted">'+esc(b.companyName)+' · '+esc(b.owner||'미배정')+'</span></span></button></td><td>'+crmChip(b.workflow,b.workflow==='매입 진행 확정'?'good':'')+(['전환 확인 전','재연락'].includes(b.workflow)?'<div class="crm-muted" style="margin-top:6px">연락 '+esc(b.contactPriority)+'</div>':'')+'</td><td><span class="crm-muted">상품 '+b.productCount+'개</span><div style="margin-top:6px">'+crmStockBadges(b)+'</div></td><td><div class="crm-clamp crm-task">'+esc(b.task||'다음 업무 등록 필요')+'</div><div class="'+(b.taskDate&&b.taskDate<CRM.data.today&&!crmDone(b)?'crm-overdue':'crm-muted')+'">'+esc(b.taskDate||'일정 미등록')+'</div></td><td><div class="crm-clamp crm-muted">'+esc(b.recent?.text||b.nextAction||'상담 기록 없음')+'</div><div class="crm-muted">'+esc(b.recent?.date||'이관 메모')+'</div></td></tr>').join('')+'</tbody></table></div>';$('#crmTable').innerHTML=html+'<div class="crm-pagination"><span class="crm-muted">'+list.length+'개 브랜드 · '+CRM.page+' / '+pages+' 페이지</span><div><button '+(CRM.page===1?'disabled':'')+' onclick="CRM.page--;crmPaint()">이전</button> <button '+(CRM.page===pages?'disabled':'')+' onclick="CRM.page++;crmPaint()">다음</button></div></div>';$$('[data-brand]').forEach(el=>el.onclick=()=>crmOpen(el.dataset.brand))};
function crmSelect(k,label,values,value){return '<div class="crm-field"><label for="cf-'+k+'">'+esc(label)+'</label><select id="cf-'+k+'" name="'+k+'">'+values.map(v=>'<option '+(v===value?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></div>'}
function crmOverview(){const d=CRM.detail,b=d.brand,s=d.stock.reduce((a,r)=>({consignment:a.consignment+r.consignment,purchase:a.purchase+r.purchase,unknown:a.unknown+r.unknown}),{consignment:0,purchase:0,unknown:0});$('#crmBody').innerHTML='<section class="crm-section"><div class="crm-overview-brand">'+crmImage(b.logo,b.brandName)+'<div><h3>'+esc(b.brandName)+'</h3><div class="crm-muted">'+esc(b.category||'카테고리 미등록')+' · '+esc(b.companyName)+'</div><p class="crm-clamp">'+esc(b.features||b.memo||'브랜드 소개를 등록해 주세요.')+'</p></div></div><div class="crm-summary"><div><span class="crm-muted">등록 상품</span><strong>'+d.products.length+'개</strong></div><div><span class="crm-muted">기존 위탁 재고</span><strong>'+s.consignment+'</strong></div><div><span class="crm-muted">매입 재고</span><strong>'+s.purchase+'</strong></div></div><div class="crm-muted">사내 담당 '+esc(b.owner||'미배정')+' · 브랜드 담당 '+esc(b.contact||'미등록')+'<br>'+esc(b.phone||'')+' · '+esc(b.email||'')+'</div></section><section class="crm-section"><h3>매입 전환·검토</h3><div class="crm-stage-line">'+['전환 확인 전','상품 검토','샘플 검토','조건 협의','매입 진행 확정'].map(v=>'<span class="'+(v===b.workflow?'current':'')+'">'+v+'</span>').join('')+'</div><div class="crm-notice">신규 매입 검토 상태입니다. 기존 팜픽 위탁 입고·재고·거래 조건은 별도로 유지됩니다.</div><form id="crmWorkflow"><div class="crm-grid">'+crmSelect('workflow','현재 매입 상태',d.stages,b.workflow)+crmSelect('contactPriority','전환 연락 순위',['1순위','2순위','3순위'],b.contactPriority)+crmSelect('sample','샘플 진행',d.samples,b.sample)+crmField('taskDate','다음 업무 예정일',b.taskDate,false,'date')+crmField('task','다음에 할 일',b.task,true)+crmField('reviewMemo','매입 검토 메모',b.reviewMemo,true)+'</div><div class="crm-actions"><button class="crm-btn primary" type="submit">검토 상태 저장</button></div></form></section><section class="crm-section"><h3>최근 상담 <button class="crm-btn" onclick="crmTab(\'activity\')">상담 기록하기</button></h3><div class="crm-raw">'+esc(d.activities[0]?.content||d.activities[0]?.title||b.nextAction||'아직 상담 기록이 없습니다.')+'</div><details><summary>기존 분류와 이관 메모</summary><div class="crm-keyval"><span>기존 분류</span><span>'+esc(b.reGroup)+'</span></div><div class="crm-keyval"><span>기존 진행 단계</span><span>'+esc(b.salesStage)+'</span></div><div class="crm-raw">'+esc(b.nextAction||'별도 메모 없음')+'</div></details></section><section class="crm-section"><h3>상품등록센터</h3>'+(d.link?'<div class="crm-actions"><button class="crm-btn" id="crmCopyLink">등록 링크 복사</button>'+crmLink(d.link.url,'등록 화면 열기')+'</div>':'<p class="crm-muted">브랜드사에 전달할 전용 상품등록 링크를 발급하세요.</p><button class="crm-btn" id="crmIssueLink">30일 링크 발급</button>')+'</section>';$('#crmWorkflow').onsubmit=crmSaveProfile;if($('#crmCopyLink'))$('#crmCopyLink').onclick=()=>copyText(d.link.url);if($('#crmIssueLink'))$('#crmIssueLink').onclick=crmIssue;}
crmProducts=function(){const p=CRM.detail.products;$('#crmBody').innerHTML='<section class="crm-section"><h3>상품 컬렉션 <span class="crm-muted">'+p.length+'개</span></h3><p class="crm-muted">상품을 검토하고 거래 조건을 등록하세요. 이미지가 없는 기존 상품은 자료 보완이 필요합니다.</p><div class="crm-products-grid">'+p.map(x=>'<article class="crm-product">'+crmImage(x.image,x.name,'crm-card-cover')+'<div class="crm-card-body"><h4>'+esc(x.name)+'</h4><div class="crm-muted">'+esc(x.option||x.id)+'</div><div class="crm-muted">바코드: '+esc(x.barcode||'확인 필요')+'</div><p>소비자가 '+(Number(x.price)>0?esc(money(x.price)):'미등록')+'</p>'+crmChip(x.status)+'<div class="crm-card-footer">'+(x.url?crmLink(x.url,'상품 자료'):'<span class="crm-muted">이미지·자료 보완 가능</span>')+'<button class="crm-btn" data-term-product="'+esc(x.id)+'">거래 조건</button></div></div></article>').join('')+'</div>'+(p.length?'':'<div class="crm-empty">등록된 상품이 없습니다. 개요에서 상품등록 링크를 발급하세요.</div>')+'</section>';$$('[data-term-product]').forEach(el=>el.onclick=()=>{crmTab('terms');crmTermEdit(-1,el.dataset.termProduct)})};
function crmStock(){const d=CRM.detail;$('#crmBody').innerHTML='<section class="crm-section"><h3>장소별 매입·위탁 재고</h3><p class="crm-notice">기존 현재고 시트의 수량입니다. 미분류 재고는 거래방식 확인이 필요하며, 매입 전환 상태를 바꿔도 재고 구분은 변경되지 않습니다.</p>'+(d.stock.length?'<div class="crm-table-wrap"><table class="crm-table" style="min-width:690px"><thead><tr><th>상품·장소</th><th>매입</th><th>위탁</th><th>미분류</th><th>샘플·DP</th></tr></thead><tbody>'+d.stock.map(r=>'<tr><td>'+esc(r.name)+'<div class="crm-muted">'+esc(r.place)+' · '+esc(r.updated)+'</div></td><td>'+r.purchase+'</td><td>'+r.consignment+'</td><td>'+r.unknown+'</td><td>'+r.sample+'</td></tr>').join('')+'</tbody></table></div>':'<div class="crm-empty">연결된 재고가 없습니다.</div>')+'</section><section class="crm-section"><h3>입출고 이력</h3>'+(d.movements.length?d.movements.map(r=>'<div class="crm-keyval"><span>'+esc(r['처리일'])+'<br>'+crmChip(r['처리상태'])+'</span><span>'+esc(r['참조ID']||r['상품ID'])+'<br><span class="crm-muted">'+esc(r['거래방식']||'거래방식 미분류')+' · '+esc(r['방향']||'')+esc(r['수량']||'수량 미확인')+'</span></span></div>').join(''):'<div class="crm-empty">연결된 이력이 없습니다.</div>')+'</section>';}
function crmTerms(){const d=CRM.detail;crmLegacyTerms();const legacy=$('#crmBody').innerHTML;$('#crmBody').innerHTML='<section class="crm-section"><h3>거래조건 관리 <button class="crm-btn primary" onclick="crmTermEdit(-1)">조건 추가</button></h3><p class="crm-muted">매입과 위탁 조건을 상품·채널별로 관리합니다. 확정 조건도 기존 재고와 발주를 자동 변경하지 않습니다.</p><div id="crmTermEditor"></div><div class="crm-terms-list">'+d.terms.map((r,i)=>'<article class="crm-terms-item"><strong>'+esc(d.products.find(p=>p.id===r['상품ID'])?.name||r['상품ID'])+'</strong><p>'+crmChip(r['거래방식'])+' '+crmChip(r['조건상태'],r['조건상태']==='확정'?'good':'')+' <span class="crm-muted">'+esc(r['채널']||'채널 미등록')+'</span></p><div class="crm-grid"><span>공급가 '+esc(r['공급가']?money(r['공급가']):'미등록')+'</span><span>MOQ '+esc(r['MOQ']||'미등록')+'</span><span class="crm-muted">결제 '+esc(r['결제조건']||'미등록')+'</span><span class="crm-muted">'+esc(r['적용시작일']||'시작일 미등록')+' ~ '+esc(r['적용종료일']||'종료일 미정')+'</span></div><div class="crm-actions"><button class="crm-btn" onclick="crmTermEdit('+i+')">조건 수정</button></div></article>').join('')+(d.terms.length?'':'<div class="crm-empty">아직 작성한 거래조건이 없습니다.</div>')+'</div></section><details class="crm-section"><summary>기존 이관 공급조건 보기</summary>'+legacy+'</details>';}
function crmTermEdit(i,productId){if(CRM.dirty){UI.toast('작성 내용을 먼저 저장해 주세요.',true);return}const d=CRM.detail,r=i>=0?d.terms[i]:{},mapping={trade:'거래방식',state:'조건상태',price:'공급가',retail:'소비자가',moq:'MOQ',pack:'박스입수',lead:'납기일수',payment:'결제조건',tax:'부가세',start:'적용시작일',end:'적용종료일',channel:'채널',memo:'메모'};CRM.editingTerm=i>=0?r:null;CRM.termRequest=crypto.randomUUID();$('#crmTermEditor').innerHTML='<form id="crmTermsForm" style="margin:20px 0;padding:18px;background:#fafafa;border-radius:14px"><h3>'+ (i>=0?'거래조건 수정':'새 거래조건')+'</h3><div id="crmTermError" role="alert"></div><div class="crm-grid"><div class="crm-field full"><label for="cf-productId">상품 *</label><select name="productId" id="cf-productId"><option value="">상품 선택</option>'+d.products.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===(productId||r['상품ID'])?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>'+crmSelect('trade','거래방식',['매입','위탁'],r['거래방식']||'매입')+crmSelect('state','조건 상태',['제안','협의 중','확정','종료'],r['조건상태']||'제안')+['price','retail','moq','pack','lead','payment','channel'].map(k=>crmField(k,mapping[k],r[mapping[k]])).join('')+crmSelect('tax','부가세',['미확인','포함','별도','면세'],r['부가세']||'미확인')+crmField('start','적용 시작일',r['적용시작일'],false,'date')+crmField('end','적용 종료일',r['적용종료일'],false,'date')+crmField('memo','협의 내용·특이사항',r['메모'],true)+'</div><p class="crm-muted">확정하려면 공급가·MOQ·결제조건·부가세·시작일이 필요합니다.</p><div class="crm-actions"><button type="button" class="crm-btn" onclick="CRM.dirty=false;crmDrawerRender()">취소</button><button type="submit" class="crm-btn primary">거래조건 저장</button></div></form>';$('#crmTermsForm').onsubmit=crmTermSave;$('#crmTermEditor').scrollIntoView({block:'start',behavior:'smooth'});}
async function crmTermSave(e){e.preventDefault();if(CRM.saving)return;const p=Object.fromEntries(new FormData(e.target).entries());Object.assign(p,{brandCode:CRM.detail.brand.brandCode,id:CRM.editingTerm?.['조건ID']||'',version:CRM.editingTerm?.['버전']||'0',requestId:CRM.termRequest});CRM.saving=true;const btn=e.target.querySelector('[type=submit]');btn.disabled=true;btn.textContent='저장 중…';try{await server('saveBrandTerms',p);CRM.dirty=false;CRM.termRequest=null;UI.toast('거래조건을 저장했습니다.');await crmReloadDetail()}catch(err){$('#crmTermError').innerHTML='<p class="crm-form-error">'+esc(err.message)+'</p>'}finally{CRM.saving=false;if(btn.isConnected){btn.disabled=false;btn.textContent='거래조건 저장'}}}

<script>
const OPS={campaign:false,editing:false,inventory:null,syncing:false};

crmRender=function(){if(OPS.campaign){opsCampaignRender();const top=document.querySelector('.crm-top');const back=document.createElement('button');back.className='crm-btn';back.textContent='브랜드 관리로 돌아가기 · 전환 업무 접기';back.onclick=()=>opsCampaign(false);top.appendChild(back);return;}const rows=CRM.data.rows,today=CRM.data.today;$('#pageSubtitle').textContent='브랜드 모집 · 상품자료 · 후속 업무';const counts=[['전체 브랜드',rows.length,'all'],['오늘·지연 업무',rows.filter(b=>b.taskDate&&b.taskDate<=today).length,'today'],['상품 미등록',rows.filter(b=>!b.productCount).length,'missing'],['담당자 미배정',rows.filter(b=>!b.owner).length,'unassigned']];$('#content').innerHTML='<div class="crm-workspace"><div class="crm-top"><div><h2>브랜드 관리</h2><p class="crm-muted">담당자와 상품자료, 다음 업무를 한곳에서 확인하세요.</p></div><div class="crm-mode"><button class="crm-btn" onclick="crmLayout(&quot;list&quot;)">목록</button><button class="crm-btn" onclick="crmLayout(&quot;cards&quot;)">카드</button><button class="crm-btn" onclick="opsCampaign(true)">매입 전환 업무 열기</button></div></div><div class="crm-metrics">'+counts.map(x=>'<button class="crm-metric" onclick="crmView(&quot;'+x[2]+'&quot;)"><span class="crm-muted">'+x[0]+'</span><strong>'+x[1]+'</strong></button>').join('')+'</div><section class="crm-panel"><div class="crm-views">'+[['all','전체'],['today','오늘·지연'],['missing','상품 미등록'],['unassigned','담당 미배정'],['barcode','바코드 확인']].map(x=>'<button class="'+(CRM.view===x[0]?'active':'')+'" onclick="crmView(&quot;'+x[0]+'&quot;)">'+x[1]+'</button>').join('')+'</div><div class="crm-toolbar"><input id="crmSearch" aria-label="브랜드 검색" placeholder="브랜드·회사·담당자·메모 검색" value="'+esc(CRM.query)+'"><select id="crmOwner" aria-label="사내 담당자">'+crmOptions(rows.map(b=>b.owner),CRM.owner,'전체 담당자')+'</select><select id="crmCategory" aria-label="카테고리">'+crmOptions(rows.flatMap(b=>(b.category||'').split(',').map(s=>s.trim())),CRM.category,'전체 카테고리')+'</select><button class="crm-btn" onclick="crmReset()">필터 초기화</button></div><div id="crmTable"></div></section></div>';$('#crmSearch').oninput=e=>{CRM.query=e.target.value;CRM.page=1;crmPaint()};[['crmOwner','owner'],['crmCategory','category']].forEach(([id,k])=>$('#'+id).onchange=e=>{CRM[k]=e.target.value;CRM.page=1;crmPaint()});crmPaint();};
crmFiltered=function(){if(OPS.campaign)return opsCampaignFiltered();const q=CRM.query.trim().toLowerCase();return CRM.data.rows.filter(b=>(!q||[b.brandName,b.companyName,b.owner,b.contact,b.brandCode,b.memo,b.task].join(' ').toLowerCase().includes(q))&&(!CRM.owner||CRM.owner===b.owner)&&(!CRM.category||(b.category||'').split(',').map(s=>s.trim()).includes(CRM.category))&&(CRM.view==='all'||CRM.view==='today'&&b.taskDate&&b.taskDate<=CRM.data.today||CRM.view==='missing'&&!b.productCount||CRM.view==='unassigned'&&!b.owner||CRM.view==='barcode'&&b.barcodeMissing>0)).sort((a,b)=>(CRM.view==='today'?(a.taskDate||'9999').localeCompare(b.taskDate||'9999'):0)||a.brandCode.localeCompare(b.brandCode));};
crmPaint=function(){if(OPS.campaign)return opsCampaignPaint();const list=crmFiltered(),per=CRM.layout==='cards'?12:25,pages=Math.max(1,Math.ceil(list.length/per));CRM.page=Math.min(CRM.page,pages);const shown=list.slice((CRM.page-1)*per,CRM.page*per);const brand=b=>'<button class="crm-brand-button" data-brand="'+esc(b.brandCode)+'">'+crmImage(b.logo,b.brandName)+'<span><strong>'+esc(b.brandName)+'</strong><span class="crm-muted">'+esc(b.companyName)+' · '+esc(b.brandCode)+'</span></span></button>';let html=CRM.layout==='cards'?'<div class="crm-catalog">'+shown.map(b=>'<article class="crm-card" data-ops-key="'+esc(b.brandCode)+'"><div class="crm-card-body">'+brand(b)+'<p>'+esc(b.owner||'담당 미배정')+' · '+esc(b.contact||'브랜드 담당 미등록')+'</p><p>상품 '+b.productCount+'개 · 자료 '+(b.fileCount||0)+'개</p><div class="crm-muted">'+esc(b.task||'예정된 업무 없음')+' '+esc(b.taskDate||'')+'</div></div></article>').join('')+'</div>':'<div class="crm-table-wrap"><table class="crm-table"><thead><tr><th>브랜드 / 회사</th><th>담당자 / 연락</th><th>상품 / 제출자료</th><th>다음 업무</th><th>최근 연락</th></tr></thead><tbody>'+shown.map(b=>'<tr><td>'+brand(b)+'</td><td>'+esc(b.owner||'사내 담당 미배정')+'<div class="crm-muted">'+esc(b.contact||'브랜드 담당 미등록')+'<br>'+esc(b.phone||b.email||'연락처 미등록')+'</div></td><td>상품 '+b.productCount+'개 · 자료 '+(b.fileCount||0)+'개'+(b.barcodeMissing?'<div class="crm-muted">바코드 확인 '+b.barcodeMissing+'개</div>':'')+'</td><td>'+esc(b.task||'예정된 업무 없음')+'<div class="'+(b.taskDate&&b.taskDate<CRM.data.today?'crm-overdue':'crm-muted')+'">'+esc(b.taskDate||'')+'</div></td><td><div class="crm-clamp crm-muted">'+esc(b.recent?.text||'연락 기록 없음')+'</div>'+esc(b.recent?.date||'')+'</td></tr>').join('')+'</tbody></table></div>';$('#crmTable').innerHTML=(shown.length?html:'<div class="crm-empty">조건에 맞는 브랜드가 없습니다.</div>')+'<div class="crm-pagination"><span>'+list.length+'개 · '+CRM.page+' / '+pages+'</span><div><button '+(CRM.page===1?'disabled':'')+' onclick="CRM.page--;crmPaint()">이전</button> <button '+(CRM.page===pages?'disabled':'')+' onclick="CRM.page++;crmPaint()">다음</button></div></div>';$$('[data-brand]').forEach(el=>el.onclick=()=>crmOpen(el.dataset.brand));};
crmOverview=function(){const d=CRM.detail,b=d.brand;$('#crmBody').innerHTML='<section class="crm-section"><h3>'+esc(b.brandName)+'</h3><p>'+esc(b.features||b.memo||'브랜드 소개를 등록해 주세요.')+'</p><div class="crm-grid"><div>사내 담당<br><strong>'+esc(b.owner||'미배정')+'</strong></div><div>브랜드 담당<br><strong>'+esc(b.contact||'미등록')+'</strong></div><div>'+esc(b.phone||'연락처 미등록')+'</div><div>'+esc(b.email||'이메일 미등록')+'</div></div><div class="crm-actions"><button class="crm-btn" onclick="crmTab(&quot;profile&quot;)">정보 수정</button><button class="crm-btn" onclick="crmTab(&quot;activity&quot;)">연락 기록 추가</button></div></section><section class="crm-section"><h3>상품과 제출자료</h3><div class="ops-toolbar"><button class="crm-btn" onclick="crmTab(&quot;products&quot;)">등록 상품 '+(d.counts?.products??d.products.length)+'개</button><button class="crm-btn" onclick="crmTab(&quot;archive&quot;)">자료 '+(d.counts?.files??d.files.length)+'개</button>'+crmLink(b.drive,'브랜드 폴더 열기')+'</div></section><section class="crm-section"><h3>다음 업무</h3><form id="opsTask"><div class="crm-grid">'+crmField('task','업무 내용',b.task,true)+crmField('taskDate','예정일',b.taskDate,false,'date')+'</div><div class="crm-actions"><button type="submit" class="crm-btn primary">업무 저장</button><button type="button" class="crm-btn" onclick="document.getElementById(&quot;cf-task&quot;).value=&quot;&quot;;document.getElementById(&quot;cf-taskDate&quot;).value=&quot;&quot;;document.getElementById(&quot;opsTask&quot;).requestSubmit()">이 업무 완료</button></div></form><p class="crm-muted">연락 기록에 등록한 후속 업무는 연락 기록 탭에서 완료 처리하세요.</p></section>';$('#opsTask').onsubmit=crmSaveProfile;if(d.issues?.length)$('#crmBody').insertAdjacentHTML('afterbegin','<section class="crm-section"><h3>자료 확인 필요</h3>'+d.issues.map(r=>'<p><strong>'+esc(r['상품명'])+'</strong><br>'+esc(r['확인사항'])+' '+crmLink(r['원본URL'],'원본 확인')+'</p>').join('')+'</section>');};

const opsGroupSeen=new WeakMap();
function opsGroup(parent,key,columns=false){const signature=Array.from(parent.children);const previous=opsGroupSeen.get(parent);if(previous&&previous.key===key&&previous.items.length===signature.length&&signature.every((el,i)=>el===previous.items[i]))return;const saved=opsRead('layout.'+key,[]);if(!OPS.editing&&!saved.length)return;opsGroupSeen.set(parent,{key,items:signature});const items=Array.from(parent.children).filter(e=>!['SCRIPT','STYLE','P'].includes(e.tagName)&&!e.classList.contains('ops-handle')&&e.id!=='opsSyncStatus');if(items.length<2)return;items.forEach((el,i)=>{if(el.dataset.opsItem)return;el.dataset.opsOriginalIndex=String(i);el.dataset.opsItem=el.dataset.opsKey||el.dataset.route||el.id||((el.querySelector('h2,h3,label,.crm-muted')?.textContent||el.textContent||'item').trim().slice(0,90)+'-'+i);if(columns)el.dataset.opsColumn=String(i);const handle=document.createElement('button');handle.type='button';handle.className='ops-handle';handle.textContent='⠿';handle.setAttribute('aria-label','위치 이동: '+el.dataset.opsItem);handle.title='드래그 또는 Alt+방향키로 이동';handle.onclick=e=>{e.preventDefault();e.stopPropagation()};el.prepend(handle);const save=()=>opsWrite('layout.'+key,Array.from(parent.children).filter(x=>x.dataset.opsItem).map(x=>x.dataset.opsItem));const move=(target)=>{if(!target||target===el||target.parentElement!==parent)return;const current=Array.from(parent.children);parent.insertBefore(el,current.indexOf(el)<current.indexOf(target)?target.nextSibling:target);if(columns){const order=Array.from(parent.children).map(x=>Number(x.dataset.opsColumn));Array.from(parent.closest('table').tBodies).forEach(body=>Array.from(body.rows).forEach(r=>{if(r.cells.length!==order.length)return;Array.from(r.cells).forEach((c,j)=>{if(!c.dataset.opsColumn)c.dataset.opsColumn=String(j)});order.forEach(n=>{const c=Array.from(r.cells).find(x=>Number(x.dataset.opsColumn)===n);if(c)r.appendChild(c)});}));}save();};handle.onkeydown=e=>{if(e.altKey&&['ArrowLeft','ArrowUp','ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();move(e.key==='ArrowLeft'||e.key==='ArrowUp'?el.previousElementSibling:el.nextElementSibling);handle.focus()}};handle.onpointerdown=e=>{if(!OPS.editing)return;e.preventDefault();e.stopPropagation();handle.setPointerCapture(e.pointerId);handle.onpointermove=ev=>{const at=document.elementFromPoint(ev.clientX,ev.clientY);let target=at;while(target&&target.parentElement!==parent)target=target.parentElement;if(target&&target.dataset.opsItem)move(target);};handle.onpointerup=()=>{handle.onpointermove=null;handle.onpointerup=null;};handle.onpointercancel=()=>{handle.onpointermove=null;};};});const order=saved,current=Array.from(parent.children).filter(e=>e.dataset.opsItem),sorted=current.slice().sort((a,b)=>{const ai=order.indexOf(a.dataset.opsItem),bi=order.indexOf(b.dataset.opsItem);return (ai<0?99999:ai)-(bi<0?99999:bi)});if(sorted.some((e,i)=>e!==current[i]))sorted.forEach(e=>parent.appendChild(e));if(columns){const orderCols=Array.from(parent.children).map(x=>Number(x.dataset.opsColumn));Array.from(parent.closest('table').tBodies).forEach(body=>Array.from(body.rows).forEach(r=>{if(r.cells.length!==orderCols.length)return;Array.from(r.cells).forEach((c,j)=>{if(c.dataset.opsColumn===undefined)c.dataset.opsColumn=String(j)});const cells=Array.from(r.cells);if(orderCols.some((n,i)=>Number(cells[i].dataset.opsColumn)!==n))orderCols.forEach(n=>r.appendChild(cells.find(c=>Number(c.dataset.opsColumn)===n)));}));}}
function opsResetPositions(){const parents=new Set(Array.from(document.querySelectorAll('[data-ops-item]')).map(e=>e.parentElement));parents.forEach(p=>Array.from(p.children).filter(e=>e.dataset.opsOriginalIndex!==undefined).sort((a,b)=>Number(a.dataset.opsOriginalIndex)-Number(b.dataset.opsOriginalIndex)).forEach(e=>p.appendChild(e)));document.querySelectorAll('table tr').forEach(r=>{const cells=Array.from(r.cells);if(cells.every(c=>c.dataset.opsColumn!==undefined))cells.sort((a,b)=>Number(a.dataset.opsColumn)-Number(b.dataset.opsColumn)).forEach(c=>r.appendChild(c));});OPS.editing=false;document.body.classList.remove('ops-edit');const b=document.querySelector('#opsLayout');if(b){b.textContent='배치 편집';b.setAttribute('aria-pressed','false');}UI.toast('기본 배치로 되돌렸습니다.');}

// Short-lived, in-memory read cache. Never stored in localStorage; successful writes invalidate it.
const PERF={cache:new Map(),pending:new Map(),generation:0,ttl:180000};
function perfInvalidate(){PERF.generation++;PERF.cache.clear();PERF.pending.clear();State.sectionCache={};CRM.loadedAt=0;OPS.inventory=null;}
function perfFetch(key,name,args=[],force=false){const hit=PERF.cache.get(key);if(!force&&hit&&Date.now()-hit.at<PERF.ttl)return Promise.resolve(hit.data);if(PERF.pending.has(key))return PERF.pending.get(key);const generation=PERF.generation;const promise=server(name,...args).then(data=>{if(generation===PERF.generation){if(PERF.cache.size>=100)PERF.cache.delete(PERF.cache.keys().next().value);PERF.cache.set(key,{data,at:Date.now()});}return data}).finally(()=>{if(PERF.pending.get(key)===promise)PERF.pending.delete(key)});PERF.pending.set(key,promise);return promise;}

crmTab=async function(tab){if(CRM.saving)return false;if(CRM.dirty){UI.toast('현재 입력을 저장한 뒤 다른 탭을 열어 주세요.',true);return false}const d=CRM.detail;if(!d)return false;CRM.tab=tab;crmDrawerRender();if(d._loaded?.[tab])return true;try{await perfLoadTab(d,tab);if(CRM.detail!==d||CRM.tab!==tab)return false;crmDrawerRender();return true}catch(e){if(CRM.detail===d&&CRM.tab===tab){$('#crmBody').innerHTML='<div class="crm-empty">'+esc(e.message)+'<p><button class="crm-btn" id="perfRetryTab">다시 불러오기</button></p></div>';$('#perfRetryTab').onclick=()=>crmTab(tab)}return false}};
crmReloadDetail=async function(){const current=CRM.detail;if(!current)return;const code=current.brand.brandCode,tab=CRM.tab;const d=await perfDetail(code,true);await perfLoadTab(d,tab);if(CRM.detail!==current)return;CRM.detail=d;crmDrawerRender();const row=CRM.data?.rows.find(b=>b.brandCode===code);if(row){Object.assign(row,d.brand,{activityCount:d.activities.length,recent:d.activities[0]?{text:d.activities[0].content||d.activities[0].title||d.activities[0].result,date:d.activities[0].date}:null});const tasks=d.activities.filter(a=>a.source==='운영센터'&&a.nextAction&&!a.complete).map(a=>({task:a.nextAction,date:a.due}));if(d.brand.task)tasks.push({task:d.brand.task,date:d.brand.taskDate});tasks.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));row.task=tasks[0]?.task||'';row.taskDate=tasks[0]?.date||'';if(State.route==='brands')crmRender();}CRM.loadedAt=0;};

go=async function(route,force=false){if(route!=='movements'){if(force&&route==='brands'){PERF.generation++;PERF.pending.clear();PERF.cache.clear();}return perfPreviousGo(route,force);}if(CRM.dirty){UI.toast('먼저 변경사항을 저장해 주세요.',true);return}crmClose(true);State.route=route;$('#sidebar').classList.remove('open');$('#pageTitle').textContent='입고·출고';$('#pageSubtitle').textContent='실제 확인한 상품 이동을 간단히 기록하세요.';$$('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));const n=++CRM.load;const cached=PERF.cache.get('movements');if(!force&&cached&&Date.now()-cached.at<PERF.ttl){OPS.inventory=cached.data;opsMovementView();return;}$('#content').innerHTML='<div class="crm-busy">입출고 자료를 불러오고 있습니다.</div>';try{const data=await perfFetch('movements','getSimpleOperations',[],force);if(State.route!==route||n!==CRM.load)return;OPS.inventory=data;opsMovementView()}catch(e){if(State.route===route&&n===CRM.load)$('#content').textContent=e.message;}};
function perfPagination(id,page,pages,total){return '<div class="crm-pagination"><span>'+total+'개 · '+(page+1)+' / '+pages+' 페이지</span><div><button class="crm-btn" '+(page===0?'disabled':'')+' onclick="'+id+'('+(page-1)+')">이전</button> <button class="crm-btn" '+(page+1>=pages?'disabled':'')+' onclick="'+id+'('+(page+1)+')">다음</button></div></div>';}
crmProducts=function(){const d=CRM.detail,all=d.products,pages=Math.max(1,Math.ceil(all.length/24));d._productPage=Math.min(d._productPage||0,pages-1);const p=all.slice(d._productPage*24,d._productPage*24+24);$('#crmBody').innerHTML='<section class="crm-section"><h3>상품 컬렉션 <span class="crm-muted">'+all.length+'개</span></h3><div class="crm-products-grid">'+p.map(x=>'<article class="crm-product" data-ops-key="'+esc(x.id)+'">'+crmImage(x.image,x.name,'crm-card-cover')+'<div class="crm-card-body"><h4>'+esc(x.name)+'</h4><div class="crm-muted">'+esc(x.option||x.id)+'</div><div class="crm-muted">바코드: '+esc(x.barcode||'확인 필요')+'</div><p>소비자가 '+(Number(x.price)>0?esc(money(x.price)):'미등록')+'</p>'+crmChip(x.status)+'<div class="crm-card-footer">'+(x.url?crmLink(x.url,'상품 자료'):'<span class="crm-muted">이미지·자료 보완 가능</span>')+'<button class="crm-btn" data-term-product="'+esc(x.id)+'">거래 조건</button></div></div></article>').join('')+'</div>'+(p.length?'':'<div class="crm-empty">등록된 상품이 없습니다.</div>')+perfPagination('perfProductPage',d._productPage,pages,all.length)+'</section><section class="crm-section"><h3>브랜드가 제출한 상품자료</h3><p class="crm-muted">원본 자료는 25행씩 불러옵니다. 가격·수량은 확정 거래조건이나 실제 입고와 구분해 보관합니다.</p><div id="perfSources">'+(d._sources?'':'<button class="crm-btn" onclick="perfSourcePage(0)">제출 상품자료 보기</button>')+'</div></section>';$$('[data-term-product]').forEach(el=>el.onclick=async()=>{const id=el.dataset.termProduct;if(await crmTab('terms'))crmTermEdit(-1,id)});if(d._sources)perfSourceRender(d._sources);};
function perfProductPage(page){if(!CRM.detail)return;CRM.detail._productPage=Math.max(0,page);crmProducts();}
async function perfSourcePage(page){const d=CRM.detail,el=$('#perfSources');if(!d||!el)return;const request=(d._sourceRequest||0)+1;d._sourceRequest=request;el.innerHTML='<div class="crm-busy">제출자료를 불러오고 있습니다.</div>';try{const data=await perfFetch('source:'+d.brand.brandCode+':'+page,'getBrandSourcePage',[d.brand.brandCode,page]);if(CRM.detail!==d||request!==d._sourceRequest)return;d._sources=data;if(CRM.tab==='products')perfSourceRender(data)}catch(e){if(CRM.detail===d&&request===d._sourceRequest&&$('#perfSources')){$('#perfSources').innerHTML='<p>'+esc(e.message)+'</p><button class="crm-btn" id="perfSourceRetry">다시 불러오기</button>';$('#perfSourceRetry').onclick=()=>perfSourcePage(page)}}}
function perfSourceRender(data){const el=$('#perfSources');if(!el)return;el.innerHTML='<div class="ops-source">'+data.rows.map((r,i)=>'<details data-source-index="'+i+'"><summary>'+esc(r['상품명'])+' <small>'+esc(r['확인상태'])+' · '+esc(r['시트명'])+' · '+esc(r['원본행'])+'행</small></summary><div class="perf-source-body"></div></details>').join('')+'</div>'+(data.total?'':'<p class="crm-muted">제출된 상품 행이 없습니다. 전체 원본 파일은 제출자료 탭에서 확인하세요.</p>')+perfPagination('perfSourcePage',data.page,data.pages,data.total);el.querySelectorAll('details').forEach(details=>details.addEventListener('toggle',()=>{if(!details.open||details.dataset.filled)return;details.dataset.filled='true';const r=data.rows[Number(details.dataset.sourceIndex)];let o={};try{o=JSON.parse(r['자료JSON'])}catch(e){}details.querySelector('.perf-source-body').innerHTML='<p>'+crmLink(r['원본URL'],r['파일명'])+'</p><table class="crm-table"><tbody>'+(o.values||[]).map((v,i)=>v?'<tr><th>'+esc(o.headers?.[i]||'원본 열 '+(i+1))+'</th><td>'+esc(v)+'</td></tr>':'').join('')+'</tbody></table>';}));}
</script>


<script>
function crmIcon(name){const p={overview:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',products:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',activity:'<path d="M21 15a4 4 0 01-4 4H8l-5 3v-4a4 4 0 01-2-3V7a4 4 0 014-4h12a4 4 0 014 4z"/>',files:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6v.2h-4V21a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 00.3-1.9A1.7 1.7 0 003 14H2.8v-4H3a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 009 4a1.7 1.7 0 001-1.6v-.2h4v.2A1.7 1.7 0 0015 4a1.7 1.7 0 001.9.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 00-.3 1.9 1.7 1.7 0 001.6 1h.2v4H21a1.7 1.7 0 00-1.6 1z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 22a8 8 0 0116 0"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 2 .7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.5c.9.3 1.8.6 2.8.7A2 2 0 0122 16.9z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L8 18l-4 1 1-4z"/>',plus:'<path d="M12 5v14M5 12h14"/>'};return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(p[name]||p.overview)+'</svg>'}
crmDrawerRender=function(){const d=CRM.detail,b=d.brand,row=CRM.data?.rows.find(x=>x.brandCode===b.brandCode)||{};const tabs=[['overview','overview','개요'],['products','products','상품'],['activity','activity','영업 활동'],['archive','files','파일'],['profile','settings','설정']];$('.crm-drawer').innerHTML='<header class="crm-drawer-head"><div class="crm-brand-head"><div class="crm-brand-symbol">'+esc((b.brandName||'B').slice(0,1))+'</div><div class="crm-brand-title"><small>'+esc(b.companyName||'회사 미등록')+' · '+esc(b.brandCode)+'</small><h2>'+esc(b.brandName)+'</h2><div class="crm-brand-badges">'+crmChip(b.workflow||b.salesStage||'상태 확인')+crmChip(b.trade||'거래방식 미정')+'</div></div><div class="crm-head-actions"><button class="crm-icon-btn" aria-label="영업 활동 추가" title="영업 활동 추가" data-crm-go="activity">'+crmIcon('plus')+'</button><button class="crm-icon-btn" aria-label="브랜드 설정" title="브랜드 설정" data-crm-go="profile">'+crmIcon('edit')+'</button><button class="crm-icon-btn" aria-label="브랜드 상세 닫기" title="닫기" data-crm-close="1">'+crmIcon('close')+'</button></div></div></header><nav class="crm-tabs" aria-label="브랜드 상세 탭">'+tabs.map(x=>'<button class="crm-tab '+(CRM.tab===x[0]?'active':'')+'" data-crm-go="'+x[0]+'">'+crmIcon(x[1])+'<span>'+x[2]+'</span></button>').join('')+'</nav><main class="crm-drawer-body" id="crmBody"></main><div class="crm-save-status" id="crmDirty"><span class="crm-muted">변경사항은 뷰티오라DB에 저장됩니다.</span><span class="crm-muted">노션 원본 보존</span></div>';perfRenderDetailBody();$('#crmBody').addEventListener('input',e=>{if(!e.target.closest('form'))return;CRM.dirty=true;$('#crmDirty').innerHTML='<span>저장하지 않은 변경사항</span><span class="crm-muted">하단 저장 버튼을 눌러 주세요.</span>'})};
crmInfoRow_=function(icon,label,value){return '<div class="crm-info-row"><span class="crm-row-icon">'+crmIcon(icon)+'</span><div><small>'+esc(label)+'</small><strong>'+esc(value||'미등록')+'</strong></div></div>'};
crmOverview=function(){const d=CRM.detail,b=d.brand,row=CRM.data?.rows.find(x=>x.brandCode===b.brandCode)||{},acts=d.activities||[];const tasks=acts.filter(a=>a.nextAction&&!a.complete).map(a=>({text:a.nextAction,date:a.due}));if(b.task)tasks.unshift({text:b.task,date:b.taskDate});const next=tasks.sort((a,c)=>(a.date||'9999').localeCompare(c.date||'9999'))[0];const productCount=d.counts?.products??row.productCount??0,reviewCount=row.reviewCount||0,revisionCount=row.revisionCount||0;$('#crmBody').innerHTML='<div class="crm-glance"><button class="crm-glance-card" data-crm-go="products"><span class="crm-glance-icon">'+crmIcon('products')+'</span><small>등록 상품</small><strong>'+productCount+'개</strong></button><button class="crm-glance-card" data-crm-go="products"><span class="crm-glance-icon">'+crmIcon('overview')+'</span><small>검수·변경 요청</small><strong>'+(reviewCount+revisionCount)+'건</strong></button><button class="crm-glance-card" data-crm-go="activity"><span class="crm-glance-icon">'+crmIcon('activity')+'</span><small>영업 활동</small><strong>'+acts.length+'건</strong></button><button class="crm-glance-card" data-crm-go="activity"><span class="crm-glance-icon">'+crmIcon('calendar')+'</span><small>다음 일정</small><strong>'+esc(next?.date||b.nextDate||'미정')+'</strong></button></div><div class="crm-overview-grid"><section class="crm-section"><div class="crm-section-head"><h3>브랜드 정보</h3><button class="crm-btn" data-crm-go="profile">수정</button></div><div class="crm-info-grid">'+crmInfoRow_('briefcase','회사명',b.companyName)+crmInfoRow_('user','사내 담당자',b.owner)+crmInfoRow_('user','브랜드 담당자',b.contact)+crmInfoRow_('phone','연락처',b.phone)+crmInfoRow_('mail','이메일',b.email)+crmInfoRow_('products','카테고리',b.category)+crmInfoRow_('overview','거래 방식',b.trade)+crmInfoRow_('briefcase','희망 채널',b.channels)+'</div><div class="crm-quick-actions"><button class="crm-btn primary" data-crm-go="activity">'+crmIcon('plus')+' 상담 기록</button><button class="crm-btn" data-crm-go="products">상품 확인</button><button class="crm-btn" data-crm-go="profile">등록 링크·설정</button></div></section><div class="crm-overview-stack"><section class="crm-section"><div class="crm-section-head"><h3>다음 할 일</h3><span class="crm-muted">'+tasks.length+'건</span></div><div class="crm-task-list">'+(tasks.length?tasks.slice(0,4).map(t=>'<div class="crm-task-item"><strong>'+esc(t.text)+'</strong><small>'+esc(t.date||'일정 미정')+'</small></div>').join(''):'<div class="crm-empty">등록된 다음 할 일이 없습니다.</div>')+'</div></section><section class="crm-section"><div class="crm-section-head"><h3>최근 활동</h3><button class="crm-btn" data-crm-go="activity">전체 보기</button></div><div class="crm-activity-list">'+(acts.length?acts.slice(0,3).map(a=>'<div class="crm-activity-item"><small>'+esc(a.date||'날짜 미등록')+' · '+esc(a.method||a.source||'기록')+'</small><p>'+esc(a.content||a.title||a.result||'내용 없음')+'</p></div>').join(''):'<div class="crm-empty">아직 영업 활동이 없습니다.</div>')+'</div></section></div></div>'};
crmProducts=function(){const d=CRM.detail,all=d.products||[],req=d.requests||[],pages=Math.max(1,Math.ceil(all.length/24));d._productPage=Math.min(d._productPage||0,pages-1);const p=all.slice(d._productPage*24,d._productPage*24+24);$('#crmBody').innerHTML=(req.length?'<div class="crm-change-banner"><div><strong>브랜드 상품 변경 요청 '+req.length+'건</strong><span class="crm-muted">상품 검수에서 현재값과 요청값을 비교해 승인할 수 있습니다.</span></div><button class="crm-btn primary" data-crm-products-admin="1">검수하러 가기</button></div>':'')+'<section class="crm-section"><div class="crm-section-head"><h3>상품 컬렉션 <span class="crm-muted">'+all.length+'개</span></h3><div><button class="crm-btn" data-crm-go="terms">거래조건</button> <button class="crm-btn" data-crm-go="stock">재고</button></div></div><div class="crm-products-grid">'+p.map(x=>'<article class="crm-product">'+crmImage(x.image,x.name,'crm-card-cover')+'<div class="crm-card-body"><h4>'+esc(x.name)+'</h4><div class="crm-muted">'+esc(x.option||x.id)+'</div><div class="crm-product-meta">'+crmChip(x.trade||'거래 미정')+crmChip(x.status||'자료 수집')+'</div><p>소비자가 '+(Number(x.price)>0?esc(money(x.price)):'미등록')+'</p><div class="crm-card-footer">'+(x.url?crmLink(x.url,'상품 자료'):'<span class="crm-muted">자료 보완 필요</span>')+'<button class="crm-btn" data-term-product="'+esc(x.id)+'">조건</button></div></div></article>').join('')+'</div>'+(p.length?'':'<div class="crm-empty">등록된 상품이 없습니다.</div>')+perfPagination('perfProductPage',d._productPage,pages,all.length)+'</section>';$$('[data-term-product]').forEach(el=>el.onclick=async()=>{if(await crmTab('terms'))crmTermEdit(-1,el.dataset.termProduct)})};
crmArchive=function(){const d=CRM.detail;const files=d.files||[];const clean=n=>String(n||'자료').replace(/^PRD-[^_]+_/i,'').replace(/[0-9a-f]{8}-[0-9a-f-]{27,36}_?/ig,'').replace(/_+/g,' ').trim();const type=n=>(String(n||'').match(/.([^.]+)$/)?.[1]||'FILE').toUpperCase();$('#crmBody').innerHTML='<section class="crm-section"><div class="crm-section-head"><h3>브랜드 파일</h3><span class="crm-muted">'+files.length+'개</span></div><div class="crm-file-list">'+(files.length?files.map(f=>'<article class="crm-file-item"><span class="crm-file-type">'+esc(type(f['파일명']))+'</span><div><strong>'+esc(clean(f['파일명']))+'</strong><small>'+esc(f['상태']||'보관 자료')+'</small></div>'+(f['Drive주소']?crmLink(f['Drive주소'],'열기'):crmLink(f['원본페이지'],'원본'))+'</article>').join(''):'<div class="crm-empty">별도 파일이 없습니다.</div>')+'</div></section><section class="crm-section"><div class="crm-section-head"><h3>이관된 영업 자료</h3><span class="crm-muted">'+(d.archive||[]).length+'건</span></div>'+(d.archive||[]).map(a=>'<details><summary>'+esc(a.type)+' · '+esc(a.title)+'</summary><div class="crm-muted" style="margin:12px 0">'+crmLink(a.url,'노션 원본 열기')+'</div><div class="crm-raw">'+esc(crmBodyText(a.body)||'본문 내용 없음')+'</div></details>').join('')+'</section>'};
document.addEventListener('click',function(e){const goEl=e.target.closest('[data-crm-go]');if(goEl&&document.getElementById('crmDrawer')){e.preventDefault();crmTab(goEl.dataset.crmGo);return}const closeEl=e.target.closest('[data-crm-close]');if(closeEl){e.preventDefault();crmClose();return}const adminEl=e.target.closest('[data-crm-products-admin]');if(adminEl){e.preventDefault();crmClose(true);go('products',true)}});
</script>
