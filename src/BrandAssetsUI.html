<style>
.crm-drawer-backdrop{padding:20px;display:flex;align-items:center;justify-content:center;background:rgba(20,29,45,.38)}
.crm-drawer{width:min(1560px,96vw)!important;max-width:none!important;height:calc(100dvh - 40px)!important;max-height:none!important;border-radius:24px!important;display:flex;flex-direction:column;font-size:16px}
.crm-drawer-head{padding:28px 36px 20px!important;flex-shrink:0}
.crm-brand-title h2{font-size:32px!important}.crm-brand-symbol{width:68px;height:68px;font-size:28px}
.crm-drawer .crm-tabs{margin:0 36px 16px!important;flex-shrink:0}.crm-drawer .crm-tab{min-height:48px;font-size:15px}
.crm-drawer-body{padding:12px 36px 32px!important;overflow-y:auto;flex:1;min-height:0}
.crm-registration{margin-top:24px;padding:20px 24px;background:#edf3ff;border:1px solid #d9e5ff;border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.crm-registration strong{font-size:18px;display:block;color:#153968}.crm-registration p{margin:6px 0 0;color:#53647a;font-size:14px}.crm-registration-actions{display:flex;gap:10px;flex-wrap:wrap}.crm-registration .crm-btn{min-height:46px;padding:12px 18px}
.crm-product-row{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:24px;align-items:center;padding:24px 8px;border-bottom:1px solid #e6eaf0}.crm-product-row h4{font-size:18px;margin:0}.crm-product-row p{margin:8px 0 0}.crm-product-row .crm-btn{min-height:44px}
.crm-document-hub{background:#fff;border:1px solid #e5eaf2;border-radius:24px;max-width:960px;margin:28px auto;padding:64px 32px;text-align:center}.crm-document-icon{display:inline-flex;padding:20px;border-radius:20px;background:#edf3ff;color:#2464be}.crm-document-icon svg{width:36px;height:36px}.crm-document-hub h3{font-size:26px;margin:20px 0 12px}.crm-document-hub p{line-height:1.9;color:#64748b;margin-bottom:28px}.crm-document-hub .crm-btn{padding:16px 28px}.crm-document-types{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}.crm-document-types span{background:#f3f5f8;padding:10px 16px;border-radius:10px;color:#64748b;font-size:14px}
.product-thumb,.product-card-image{display:none!important}.product-card>.asset-folder-button{margin:0 20px 20px}.asset-folder-button{white-space:nowrap;margin-left:8px}.crm-save-status{flex-shrink:0}
@media(max-width:760px){.crm-drawer-backdrop{padding:0}.crm-drawer{width:100vw!important;height:100dvh!important;border-radius:0!important}.crm-drawer-head{padding:20px 16px 12px!important}.crm-drawer-body{padding:12px 16px 24px!important}.crm-drawer .crm-tabs{margin:0 16px 10px!important;overflow-x:auto}.crm-brand-title h2{font-size:24px!important}.crm-registration{padding:16px;align-items:flex-start;flex-direction:column;gap:14px;margin-top:18px}.crm-registration-actions{width:100%}.crm-product-row{grid-template-columns:1fr;gap:14px;padding:22px 0}.crm-product-row .crm-btn{justify-self:start}.crm-document-hub{padding:36px 20px;margin:8px 0}.crm-brand-symbol{width:48px;height:48px}.crm-head-actions{gap:4px}}
</style>
<script>
function crmRegistrationBar_(){
 const link=CRM.detail.link;
 return '<section class="crm-registration" aria-label="상품등록 링크 전달"><div><strong>브랜드에 상품등록 링크 전달</strong><p>'+(link?'링크를 복사해 브랜드 담당자에게 전달하세요.':'전용 링크를 발급하면 브랜드가 상품정보와 이미지를 등록할 수 있습니다.')+'</p></div><div class="crm-registration-actions">'+(link?'<button class="crm-btn primary" data-registration-copy>상품등록 링크 복사</button>'+crmLink(link.url,'상품등록 화면 열기'):'<button class="crm-btn primary" data-registration-issue>상품등록 링크 발급</button>')+'</div></section>';
}

async function openAssetFolder_(button,brandCode,productId){
 if(button.disabled)return;
 const label=button.textContent;
 button.disabled=true;button.textContent='폴더 준비 중…';
 // Reserve the window during the user gesture; asynchronous window.open is blocked by browsers.
 const popup=window.open('about:blank','_blank');
 if(popup)popup.opener=null;
 try{
  const result=await server('getAdminAssetFolder',{brandCode,productId:productId||'',kind:productId?'product':'documents'});
  if(!/^https:\/\/drive\.google\.com\/drive\/folders\/[\w-]+/.test(result.url||''))throw Error('폴더 주소를 확인할 수 없습니다.');
  if(popup)popup.location.href=result.url;
  else UI.modal('<h2>폴더 준비 완료</h2><p>'+crmLink(result.url,productId?'상품 이미지 폴더 열기':'브랜드 자료 폴더 열기')+'</p>');
  if(result.failed?.length)UI.toast(result.failed.length+'개 기존 파일을 정리하지 못했습니다. 기존 파일은 원래 위치에 유지됩니다.',true);
 }catch(error){if(popup)popup.close();UI.toast('폴더를 열지 못했습니다. '+error.message,true);}
 finally{button.disabled=false;button.textContent=label;}
}

document.addEventListener('click',async function(event){
 const folder=event.target.closest('[data-asset-product],[data-asset-documents]');
 if(folder){event.preventDefault();event.stopPropagation();await openAssetFolder_(folder,folder.dataset.assetBrand||folder.dataset.assetDocuments,folder.dataset.assetProduct);return;}
 const copy=event.target.closest('[data-registration-copy]');
 if(copy){await copyText(CRM.detail.link.url);return;}
 const issue=event.target.closest('[data-registration-issue]');
 if(issue){
  if(CRM.dirty){UI.toast('브랜드 정보를 먼저 저장해 주세요.',true);return;}
  const detail=CRM.detail;issue.disabled=true;
  try{const link=await server('saveAdminAction','issuePartnerLink',{brandCode:detail.brand.brandCode});if(CRM.detail===detail){detail.link=link;crmDrawerRender();}UI.toast('상품등록 링크를 발급했습니다.');}
  catch(error){UI.toast(error.message,true);issue.disabled=false;}
 }
},true);

const assetPaintMaster_=paintProductMaster_;
paintProductMaster_=function(){
 assetPaintMaster_();
 document.querySelectorAll('#masterTable [data-pid]').forEach(element=>{
  const product=(State.productRows||[]).find(p=>String(p.productId)===element.dataset.pid);
  if(!product)return;
  const button=document.createElement('button');button.className='small-button asset-folder-button';button.textContent='이미지 폴더 열기';button.dataset.assetProduct=product.productId;button.dataset.assetBrand=product.brandCode;
  if(element.tagName==='ARTICLE')element.appendChild(button);else element.parentElement.appendChild(button);
 });
};
</script>
