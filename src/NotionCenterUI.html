<style>
#opsLayout[hidden]{display:none!important}.bo-center .bo-list-tools .search-input{width:auto;flex:1 1 320px}.bo-center .bo-list-tools .field-select{width:220px;flex:0 1 220px}.bo-settings-dialog .panel-head{padding-right:40px}
.bo-center{display:grid;gap:22px}.bo-center-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:30px 32px;background:#f3f1e8;border:1px solid #e6e3d8;border-radius:22px}.bo-center-hero h2{margin:8px 0;font-size:30px;letter-spacing:-1px}.bo-center-hero p{margin:0;color:#77766e;line-height:1.6}.bo-kicker{font-size:11px;letter-spacing:2px;font-weight:700;color:#727064}.bo-center-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bo-icon{display:inline-flex;align-items:center;justify-content:center;gap:8px}.bo-icon svg,.bo-center svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;flex-shrink:0}.bo-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.bo-stat{border:1px solid #e4e5e0;border-radius:17px;background:#fff;text-align:left;padding:20px;display:grid;gap:12px;cursor:pointer;color:#30372d}.bo-stat>span{display:flex;align-items:center;gap:9px;color:#7a7e72;font-size:13px}.bo-stat strong{font-size:30px;font-weight:650}.bo-stat.active{border-color:#a7b788;background:#f4f7ed}.bo-notion-panel{padding:22px;border:1px solid #e4e5e0;border-radius:20px;background:#fff;min-width:0}.bo-list-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.bo-list-tools input{flex:1;min-width:160px}.bo-list-tools small{margin-left:auto;color:#7c8275}.bo-catalog-table{width:100%;border-collapse:collapse;font-size:13px}.bo-catalog-table th{color:#7c8275;background:#f8f9f5;font-weight:500;text-align:left;padding:13px 16px;white-space:nowrap}.bo-catalog-table td{padding:17px 16px;border-bottom:1px solid #eef0e9;max-width:260px;overflow-wrap:anywhere}.bo-catalog-table .bo-item-name{min-width:200px;text-align:left;border:0;background:none;padding:0;font:inherit;font-weight:650;color:#242f20;cursor:pointer;line-height:1.6}.bo-item-meta{display:block;font-size:11px;color:#858a7e;margin-top:5px}.bo-settings-table input:not([type=checkbox]),.bo-settings-table textarea{min-width:150px;width:100%;box-sizing:border-box}.bo-settings-table td{vertical-align:top;padding:12px}.bo-settings-table th{white-space:nowrap}.bo-settings-intro{font-size:13px;line-height:1.7;color:#767d70}.bo-property-toggles{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.bo-property-toggles label{padding:8px 10px;border:1px solid #e3e6dc;border-radius:9px;font-size:13px}.bo-body-editor{display:grid;gap:12px}.bo-body-block{padding-left:14px;border-left:2px solid #e2e7d9}.bo-body-block textarea{width:100%;min-height:75px;box-sizing:border-box}.bo-body-block small{display:block;color:#858b7c;margin-bottom:6px}.bo-body-block p{white-space:pre-wrap}.bo-warning{padding:12px 16px;border-radius:10px;background:#fff5db;color:#805c14;font-size:13px}.bo-settings-dialog .modal-card{width:min(1250px,94vw);max-width:none}.bo-center-empty{padding:52px;text-align:center;color:#7a8271}.bo-folder-links{display:flex;gap:8px;flex-wrap:wrap}.bo-folder-links a{font-size:12px;text-decoration:none;color:#52673a}.bo-center .data-table-wrap{overflow:auto}.bo-property-fields{display:grid;grid-template-columns:1fr;gap:18px}.bo-property-fields .field-group{min-width:0}.bo-center .product-pagination{margin-top:18px}.bo-center .search-input{max-width:none}.bo-section-tabs{display:flex;gap:10px;border-bottom:1px solid #e4e7de;padding-bottom:14px;margin-bottom:20px}.bo-section-tabs button{display:flex;align-items:center;gap:8px;border:0;background:#f2f4ed;border-radius:10px;padding:11px 16px;cursor:pointer;font:inherit}.bo-section-tabs button.active{background:#303c29;color:white}.bo-section-tabs b{background:#ffffff30;border-radius:6px;padding:2px 7px}.bo-db-note{line-height:1.8;font-size:14px;color:#69705f}.bo-text-wordmark{font-weight:750;letter-spacing:2px;font-size:21px}.bo-list-layout{display:flex;align-items:center;gap:8px}.bo-center-refresh{font-size:12px;color:#7c8275}
@media(max-width:760px){.bo-center-hero{padding:22px;align-items:flex-start;flex-direction:column}.bo-center-hero h2{font-size:25px}.bo-stats{gap:8px}.bo-stat{padding:15px 12px}.bo-stat strong{font-size:25px}.bo-stat>span{font-size:11px}.bo-notion-panel{padding:16px}.bo-list-tools small{width:100%}.bo-center-actions{width:100%}.bo-property-fields{grid-template-columns:1fr}}

<script>
const NC={products:[],productPage:0,query:'',filter:'all',view:'list',columns:null,schema:null,polling:false,updatedAt:0};
function ncIcon(name){return typeof crmIcon==='function'?crmIcon(name):'';}
function ncButton(label,icon,action,cls='secondary-button'){return `<button class="${cls} bo-icon" onclick="${action}">${ncIcon(icon)}${label}</button>`;}
function ncTimestamp(){return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}
function ncDisplayId(id){return String(id||'').replace(/^PRD-/,'');}
function ncReadCols(kind,defaults){try{return JSON.parse(localStorage.getItem('beautyora.notion.columns.'+kind))||defaults}catch(e){return defaults}}
function ncSaveCols(kind,cols){try{localStorage.setItem('beautyora.notion.columns.'+kind,JSON.stringify(cols))}catch(e){UI.toast('이 브라우저에서는 열 설정이 저장되지 않습니다.',true)}}
function ncReviewing(s){return ['신규 제출','검수 중'].includes(s.status);}

renderProducts=function(data){
 State.notionEnabled=!!data.notionEnabled;NC.reviewCount=data.reviewCount||0;NC.revisionCount=data.revisionCount||0;
 NC.view=State.productInitialView==='review'?'review':NC.view;State.productInitialView='';
 $('#content').innerHTML=`<div class="bo-center"><header class="bo-center-hero"><div><span class="bo-kicker">PRODUCTS</span><h2>상품 관리</h2><p>상품 정보와 검수 현황을 한곳에서 확인하세요.</p></div><div class="bo-center-actions">${ncButton('속성 설정','settings',"openNotionSettings_()")}${ncButton('배치 편집','overview',"ncToggleLayout_()")}</div></header><div class="bo-stats"><button class="bo-stat" onclick="ncProductView_('list')"><span>${ncIcon('products')}전체 상품</span><strong id="ncTotal">—</strong></button><button class="bo-stat" onclick="ncProductView_('review')"><span>${ncIcon('overview')}검수 대기</span><strong id="ncReview">${NC.reviewCount}</strong></button><button class="bo-stat" onclick="NC.reviewStatus='보완 필요';ncProductView_('review')"><span>${ncIcon('edit')}보완 필요</span><strong id="ncRevision">${NC.revisionCount}</strong></button></div><section class="bo-notion-panel"><nav class="bo-section-tabs"><button data-nc-view="list" onclick="ncProductView_('list')">${ncIcon('products')}상품 목록</button><button data-nc-view="review" onclick="NC.reviewStatus='';ncProductView_('review')">${ncIcon('overview')}검수 대기 <b id="reviewCount">${NC.reviewCount}</b></button></nav><div id="productWorkspace"></div></section></div>`;
 if(!State.notionEnabled){$('#productWorkspace').innerHTML=UI.empty('Notion 연결이 필요합니다.','설정에서 상품·브랜드 DB 연결을 확인해 주세요.');return;}
 ncProductView_(NC.view);if(NC.view!=='list')ncFetchProducts_(false);
};
async function ncProductView_(view){
 NC.view=view;$$('[data-nc-view]').forEach(b=>b.classList.toggle('active',b.dataset.ncView===view));
 if(view==='list'){await renderNotionProductList_();return;}
 const workspace=$('#productWorkspace');workspace.innerHTML='<p role="status">검수 목록을 불러오고 있습니다.</p>';
 try{const result=await server('getAdminSection','productSubmissions',{});if(State.route!=='products'||NC.view!==view||!workspace.isConnected)return;State.reviewFields=result.fields||[];State.sectionCache.productSubmissions={data:result.submissions,at:Date.now()};renderSubmissionList(result.submissions||[]);if(NC.reviewStatus){const button=$$('#productWorkspace [data-status]').find(b=>b.dataset.status===NC.reviewStatus);if(button)button.click();}ncCounts_(result.submissions||[]);}catch(e){if(workspace.isConnected)workspace.innerHTML=UI.empty('검수 조회 실패',e.message)}
}
function ncCounts_(rows){NC.reviewCount=rows.filter(ncReviewing).length;NC.revisionCount=rows.filter(r=>r.status==='보완 필요').length;[['ncReview',NC.reviewCount],['reviewCount',NC.reviewCount],['ncRevision',NC.revisionCount]].forEach(([id,v])=>{if($('#'+id))$('#'+id).textContent=v;});}
async function ncFetchProducts_(paint=true){
 const result=await server('getAdminSection','notionProducts',{});if(State.route!=='products')return;
 NC.products=result.products||[];NC.updatedAt=Date.now();State.sectionCache.notionProducts={data:result,at:Date.now()};
 if($('#ncTotal'))$('#ncTotal').textContent=NC.products.length;
 if(paint&&NC.view==='list'&&$('#notionProductTable'))ncPaintProducts_();
}
renderNotionProductList_=async function(){
 const workspace=$('#productWorkspace');
 workspace.innerHTML=`<div class="bo-list-tools"><input id="notionProductSearch" class="search-input" aria-label="상품 검색" placeholder="상품명·브랜드·바코드 검색" value="${esc(NC.query)}"><select id="ncProductStatus" class="field-select" aria-label="상품 등록 검수 상태"><option value="all">전체 상태</option>${['검수 대기','보완 필요','승인 완료','기존 상품'].map(x=>`<option ${NC.filter===x?'selected':''}>${x}</option>`).join('')}</select><small id="ncUpdated">최신 정보 조회 중</small></div><div id="notionProductTable"></div>`;
 $('#notionProductSearch').oninput=e=>{NC.query=e.target.value;NC.productPage=0;ncPaintProducts_();};$('#ncProductStatus').onchange=e=>{NC.filter=e.target.value;NC.productPage=0;ncPaintProducts_();};
 try{await ncFetchProducts_()}catch(e){if(workspace.isConnected&&NC.view==='list')workspace.innerHTML=UI.empty('Notion 상품 조회 실패',e.message)}
};
function ncProductDefs_(){const map=new Map();NC.products.forEach(p=>(p.properties||[]).forEach(f=>{if(!map.has(f.id))map.set(f.id,f);}));return [...map.values()];}
function ncPaintProducts_(){
 if(!$('#notionProductTable'))return;const q=NC.query.trim().toLowerCase();
 const rows=NC.products.filter(p=>(!q||[p.name,p.brandName,p.productId,p.displayId,p.barcode].join(' ').toLowerCase().includes(q))&&(NC.filter==='all'||(p.reviewStatus||'기존 상품')===NC.filter));
 const pages=Math.max(1,Math.ceil(rows.length/30));NC.productPage=Math.min(NC.productPage,pages-1);const shown=rows.slice(NC.productPage*30,NC.productPage*30+30);
 const defs=ncProductDefs_(),defaults=defs.filter(f=>['소비자가','카테고리','바코드(텍스트)'].includes(f.name)).map(f=>f.id);NC.columns=ncReadCols('product',defaults);const selected=defs.filter(f=>NC.columns.includes(f.id));
 $('#notionProductTable').innerHTML=shown.length?`<div class="data-table-wrap"><table class="bo-catalog-table"><thead><tr><th>상품 / 운영센터 ID</th><th>브랜드</th>${selected.map(f=>`<th>${esc(f.name)}</th>`).join('')}<th>등록 검수</th><th>자료</th></tr></thead><tbody>${shown.map(p=>`<tr><td><button class="bo-item-name" data-notion-page="${esc(p.pageId)}">${esc(p.name||'상품명 없음')}</button><small class="bo-item-meta">${esc(p.displayId||ncDisplayId(p.productId))}</small></td><td>${esc(p.brandName||'미연결')}</td>${selected.map(f=>`<td>${esc((p.properties||[]).find(x=>x.id===f.id)?.value||'—')}</td>`).join('')}<td>${UI.status(p.reviewStatus||'기존 상품')}</td><td><button class="small-button bo-icon" data-notion-page="${esc(p.pageId)}">${ncIcon('files')}상세</button></td></tr>`).join('')}</tbody></table></div><nav class="product-pagination" aria-label="상품 목록 페이지"><span>${rows.length}개 · ${NC.productPage+1} / ${pages} 페이지</span><div><button class="small-button" ${NC.productPage===0?'disabled':''} onclick="NC.productPage--;ncPaintProducts_()">이전</button><button class="small-button" ${NC.productPage+1>=pages?'disabled':''} onclick="NC.productPage++;ncPaintProducts_()">다음</button></div></nav>`:UI.empty('해당 상품이 없습니다.','검색어와 필터를 확인해 주세요.');
 $$('[data-notion-page]').forEach(b=>b.onclick=()=>openNotionProduct_(b.dataset.notionPage));if($('#ncUpdated'))$('#ncUpdated').textContent='Notion · '+ncTimestamp()+' 확인';
}
function ncToggleLayout_(){const button=$('#opsLayout');if(button)button.click();else UI.toast('배치 편집을 준비하고 있습니다.');}

async function openNotionSettings_(){
 UI.modal('<h2>상품 속성 설정</h2><p role="status">Notion 속성을 불러오는 중입니다.</p>');$('#modal').classList.add('bo-settings-dialog');
 try{const data=await server('getAdminSection','settings',{});NC.schema=data;ncSettingsForm_(data,true)}catch(e){$('#modalBody').innerHTML=UI.empty('설정 조회 실패',e.message)}
}
function ncSettingsForm_(data,modal){
 const fields=data.fields||[],defs=ncProductDefs_();
 const html=`<div class="panel-head"><div><span class="bo-kicker">NOTION PROPERTIES</span><h2>상품 속성 설정</h2></div>${ncButton('변경 저장','settings','saveNotionFields_()','primary-button')}</div><p class="bo-settings-intro">속성명·형식·순서는 Notion에서 가져옵니다. 등록센터의 필수 여부와 입력 예시를 설정하세요. 선택지는 | 기호로 구분하며 새 선택지는 Notion에도 추가됩니다.</p>${data.orderWarning?`<p class="bo-warning">${esc(data.orderWarning)}</p>`:''}${modal?`<details open><summary>목록에 표시할 속성</summary><div class="bo-property-toggles">${defs.map(f=>`<label><input type="checkbox" data-nc-column="${esc(f.id)}" ${(NC.columns||[]).includes(f.id)?'checked':''}> ${esc(f.name)}</label>`).join('')}</div></details>`:''}<div class="data-table-wrap"><table class="bo-catalog-table bo-settings-table"><thead><tr><th>Notion 속성</th><th>등록센터 사용</th><th>필수</th><th>선택지 / 입력 예시</th><th>안내 문구</th></tr></thead><tbody id="ncFieldRows">${fields.map(f=>`<tr data-property-id="${esc(f.propertyId)}"><td><strong>${esc(f.label)}</strong><small class="bo-item-meta">${esc(f.notionType||f.type)}</small></td><td><input type="checkbox" class="nc-active" aria-label="${esc(f.label)} 등록센터 사용" ${f.active?'checked':''} ${f.id==='product_name'?'disabled':''}></td><td><input type="checkbox" class="nc-required" aria-label="${esc(f.label)} 필수" ${f.required?'checked':''} ${f.id==='product_name'?'disabled':''}></td><td><textarea class="field-textarea nc-examples" aria-label="${esc(f.label)} 선택지 또는 예시" rows="2">${esc(['select','multi_select'].includes(f.type)?f.options:f.examples||'')}</textarea></td><td><textarea class="field-textarea nc-help" aria-label="${esc(f.label)} 안내 문구" rows="2">${esc(f.help||'')}</textarea></td></tr>`).join('')}</tbody></table></div>${modal?'<div class="modal-actions"><button class="secondary-button" onclick="UI.closeModal()">닫기</button><button class="primary-button" onclick="saveNotionFields_()">설정 저장</button></div>':''}`;
 (modal?$('#modalBody'):$('#ncSettings')).innerHTML=html;
 $$('[data-nc-column]').forEach(input=>input.onchange=()=>{NC.columns=$$('[data-nc-column]:checked').map(x=>x.dataset.ncColumn);ncSaveCols('product',NC.columns);ncPaintProducts_();});
}
async function saveNotionFields_(){
 if(!NC.schema)return;const fields=$$('#ncFieldRows tr').map(row=>{const f=NC.schema.fields.find(f=>f.propertyId===row.dataset.propertyId),examples=row.querySelector('.nc-examples').value;return {propertyId:f.propertyId,active:row.querySelector('.nc-active').checked,required:row.querySelector('.nc-required').checked,options:['select','multi_select'].includes(f.type)?examples:f.options,examples:['select','multi_select'].includes(f.type)?'':examples,help:row.querySelector('.nc-help').value};});
 try{await server('saveAdminAction','saveNotionFields',{version:NC.schema.fieldVersion,fields});UI.toast('Notion 상품 입력 설정을 저장했습니다.');if(!$('#modal').classList.contains('hidden'))UI.closeModal();if(State.route==='settings')go('settings',true);}catch(e){UI.toast(e.message,true)}
}
renderSettings=function(data){NC.schema=data;$('#content').innerHTML=`<div class="bo-center"><section class="bo-notion-panel"><div class="panel-head"><div><h2>관리자 계정</h2><p class="subtle">운영센터에 접근할 계정을 관리합니다.</p></div><button class="primary-button" onclick="saveAdminEmails()">관리자 저장</button></div><input id="adminEmails" class="field-input" aria-label="관리자 이메일" value="${esc((data.adminEmails||[]).join(', '))}"></section><section class="bo-notion-panel" id="ncSettings"></section><section class="bo-notion-panel"><h2>기존 구글 DB 정리 제안</h2><p class="bo-db-note">상품·브랜드의 기준 데이터는 Notion입니다. 기존 상품 마스터·노션 복제 시트·필드 설정은 백업 후 사용 중지를 권장합니다. 현재 접수 이력, 등록 링크, 파일 목록, 입점 신청과 재고 기록은 사용 중이므로 함께 삭제하지 마세요.</p><div class="bo-center-actions"><button class="secondary-button" onclick="runCheck()">연결 상태 점검</button><button class="secondary-button" onclick="ncMigrationPreview_()">기존 파일 링크를 폴더로 전환</button></div></section></div>`;if(data.notionEnabled)ncSettingsForm_(data,false);else $('#ncSettings').innerHTML=UI.empty('Notion 연결 필요','상품 DB 연결 후 속성 설정을 사용할 수 있습니다.');};

function ncBodyHtml_(blocks){return (blocks||[]).map(b=>`<div class="bo-body-block">${b.editable?`<small>${esc(({paragraph:'문단',heading_1:'제목 1',heading_2:'제목 2',heading_3:'제목 3',bulleted_list_item:'목록',numbered_list_item:'번호 목록',to_do:'할 일',quote:'인용',callout:'콜아웃',toggle:'접기',code:'코드'})[b.type]||b.type)}</small><textarea class="field-textarea" data-notion-block="${esc(b.id)}" aria-label="상품 본문 ${esc(b.type)}">${esc(b.text)}</textarea>`:notionBlockHtml_({...b,children:[]})}${ncBodyHtml_(b.children)}</div>`).join('');}
openNotionProduct_=async function(pageId){
 UI.modal('<h2>상품 상세</h2><p role="status">Notion 속성과 본문을 불러오는 중입니다.</p>');$('#modal').classList.add('bo-settings-dialog');
 try{const detail=await server('getNotionProductDetail',{pageId});State.notionProductDetail=detail;
 $('#modalBody').innerHTML=`<div class="review-modal-head"><div><span class="bo-kicker">PRODUCT DETAILS</span><h2>상품 정보</h2></div><a class="small-button" href="${esc(detail.url)}" target="_blank" rel="noopener noreferrer">Notion에서 열기</a></div><p class="bo-settings-intro">속성과 본문을 수정하면 Notion에 반영됩니다. 노션 보기 순서에 맞춰 표시합니다.</p>${detail.orderWarning?`<p class="bo-warning">${esc(detail.orderWarning)}</p>`:''}<div class="bo-property-fields">${detail.properties.map(p=>`<div class="field-group"><label>${esc(p.name)}${p.assetFolder?' · 폴더 URL':''}</label>${notionProductInput_(p)}${p.assetFolder&&reviewHttp_(p.value)?`<a class="field-help" href="${esc(p.value)}" target="_blank" rel="noopener noreferrer">${p.folderWarning?'기존 파일 열기 · 폴더 확인 필요':'폴더 열기'}</a>`:''}</div>`).join('')}</div><section class="review-info-section"><h3>상품 본문</h3><p class="subtle">문단별 텍스트를 수정합니다. 수정한 문단은 일반 텍스트로 저장되며 이미지·첨부파일은 유지됩니다.</p><div class="bo-body-editor">${ncBodyHtml_(detail.blocks)}<label>본문 추가<textarea id="ncAppendBody" class="field-textarea" rows="3" placeholder="새 문단을 입력하세요."></textarea></label></div></section><div class="modal-actions"><button class="secondary-button" onclick="UI.closeModal()">닫기</button><button class="primary-button" onclick="saveNotionProduct_('${esc(pageId)}')">Notion에 변경 저장</button></div>`;
 }catch(e){$('#modalBody').innerHTML=UI.empty('상품 조회 실패',e.message)}
};
saveNotionProduct_=async function(pageId){
 const detail=State.notionProductDetail;if(!detail||detail.pageId!==pageId)return;
 const changes=detail.properties.filter(p=>p.editable).map(p=>{const input=$$('[data-notion-property]').find(el=>el.dataset.notionProperty===p.id);if(!input)return null;const value=p.type==='checkbox'?input.checked:p.type==='multi_select'?input.value.split(',').map(x=>x.trim()).filter(Boolean):input.value.trim();const original=p.type==='checkbox'?p.value==='예':p.type==='multi_select'?p.value.split(',').map(x=>x.trim()).filter(Boolean):(p.assetFolder&&!p.folderWarning?p.originalValue:p.value);return JSON.stringify(value)===JSON.stringify(original)?null:{id:p.id,value};}).filter(Boolean);
 const blocks=[];function flatten(items){items.forEach(b=>{blocks.push(b);flatten(b.children||[]);});}flatten(detail.blocks||[]);
 const blockChanges=$$('[data-notion-block]').map(input=>{const block=blocks.find(b=>b.id===input.dataset.notionBlock);return block&&input.value!==block.text?{id:block.id,original:block.text,text:input.value}:null;}).filter(Boolean),appendText=$('#ncAppendBody').value.trim();
 if(!changes.length&&!blockChanges.length&&!appendText){UI.toast('변경된 내용이 없습니다.');return;}
 try{await server('saveAdminAction','updateNotionProduct',{pageId,lastEditedAt:detail.lastEditedAt,changes,blockChanges,appendText});UI.closeModal();UI.toast('Notion 상품 정보를 저장했습니다.');await go('products',true);}catch(e){UI.toast(e.message,true)}
};

crmRender=function(){
 const rows=CRM.data.rows;$('#pageSubtitle').textContent='Notion 브랜드 정보와 상품·자료를 관리하세요.';
 $('#content').innerHTML=`<div class="bo-center"><header class="bo-center-hero"><div><span class="bo-kicker">BRANDS</span><h2>브랜드 관리</h2><p>브랜드 정보와 등록 상품을 확인하세요.</p></div><div class="bo-center-actions">${ncButton('표시 속성','settings',"ncBrandColumns_()")}${ncButton('배치 편집','overview',"ncToggleLayout_()")}</div></header><div class="bo-stats">${[['전체 브랜드',rows.length,'all','briefcase'],['상품 보유',rows.filter(b=>b.productCount>0).length,'products','products'],['상품 미등록',rows.filter(b=>!b.productCount).length,'missing','files']].map(([label,n,filter,icon])=>`<button class="bo-stat ${CRM.view===filter?'active':''}" onclick="CRM.view='${filter}';CRM.page=1;crmRender()"><span>${ncIcon(icon)}${label}</span><strong>${n}</strong></button>`).join('')}</div><section class="bo-notion-panel"><div class="bo-list-tools"><input id="crmSearch" class="search-input" aria-label="브랜드 검색" placeholder="브랜드·회사·담당자 검색" value="${esc(CRM.query)}"><select id="crmCategory" class="field-select" aria-label="카테고리">${crmOptions(rows.flatMap(b=>(b.category||'').split(',').map(s=>s.trim())),CRM.category,'전체 카테고리')}</select><small>Notion · ${ncTimestamp()} 확인</small></div><div id="crmTable"></div></section></div>`;
 $('#crmSearch').oninput=e=>{CRM.query=e.target.value;CRM.page=1;crmPaint();};$('#crmCategory').onchange=e=>{CRM.category=e.target.value;CRM.page=1;crmPaint();};crmPaint();
};
crmFiltered=function(){const q=CRM.query.trim().toLowerCase();return CRM.data.rows.filter(b=>(!q||[b.brandName,b.companyName,b.contact,b.brandCode].join(' ').toLowerCase().includes(q))&&(!CRM.category||(b.category||'').includes(CRM.category))&&(CRM.view==='all'||CRM.view==='products'&&b.productCount>0||CRM.view==='missing'&&!b.productCount));};
function ncBrandDefs_(){const map=new Map();CRM.data.rows.forEach(b=>(b.properties||[]).forEach(p=>{if(!map.has(p.id))map.set(p.id,p);}));return [...map.values()];}
function ncBrandColumns_(){const defs=ncBrandDefs_(),cols=ncReadCols('brand',defs.filter(p=>['브랜드 담당자','카테고리','진행 단계'].includes(p.name)).map(p=>p.id));UI.modal(`<h2>브랜드 표시 속성</h2><div class="bo-property-toggles">${defs.map(p=>`<label><input type="checkbox" data-brand-column="${esc(p.id)}" ${cols.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div>`);$$('[data-brand-column]').forEach(input=>input.onchange=()=>{ncSaveCols('brand',$$('[data-brand-column]:checked').map(x=>x.dataset.brandColumn));crmPaint();});}
crmPaint=function(){
 const list=crmFiltered(),pages=Math.max(1,Math.ceil(list.length/25));CRM.page=Math.min(CRM.page,pages);const shown=list.slice((CRM.page-1)*25,CRM.page*25),defs=ncBrandDefs_(),cols=ncReadCols('brand',defs.filter(p=>['브랜드 담당자','카테고리','진행 단계'].includes(p.name)).map(p=>p.id)),selected=defs.filter(p=>cols.includes(p.id));
 $('#crmTable').innerHTML=shown.length?`<div class="data-table-wrap"><table class="bo-catalog-table"><thead><tr><th>브랜드 / 회사</th>${selected.map(p=>`<th>${esc(p.name)}</th>`).join('')}<th>상품</th><th>검수 대기</th></tr></thead><tbody>${shown.map(b=>`<tr><td><button class="bo-item-name" data-brand="${esc(b.brandCode)}">${esc(b.brandName)}</button><small class="bo-item-meta">${esc(b.companyName)} · ${esc(b.brandCode)}</small></td>${selected.map(p=>`<td>${esc((b.properties||[]).find(x=>x.id===p.id)?.value||'—')}</td>`).join('')}<td>${b.productCount}개</td><td>${b.reviewCount||0}건</td></tr>`).join('')}</tbody></table></div><nav class="product-pagination" aria-label="브랜드 목록 페이지"><span>${list.length}개 · ${CRM.page} / ${pages} 페이지</span><div><button class="small-button" ${CRM.page===1?'disabled':''} onclick="CRM.page--;crmPaint()">이전</button><button class="small-button" ${CRM.page===pages?'disabled':''} onclick="CRM.page++;crmPaint()">다음</button></div></nav>`:UI.empty('해당 브랜드가 없습니다.','검색어와 필터를 확인해 주세요.');$$('[data-brand]').forEach(b=>b.onclick=()=>crmOpen(b.dataset.brand));
};
crmOverview=function(){const b=CRM.detail.brand;$('#crmBody').innerHTML=`<section class="crm-section"><div class="crm-section-head"><h3>브랜드 정보</h3><button class="crm-btn" data-crm-go="profile">Notion 정보 수정</button></div><div class="crm-info-grid">${crmInfoRow_('briefcase','회사명',b.companyName)+crmInfoRow_('user','브랜드 담당자',b.contact)+crmInfoRow_('phone','연락처',b.phone)+crmInfoRow_('mail','이메일',b.email)+crmInfoRow_('products','카테고리',b.category)+crmInfoRow_('overview','거래 방식',b.trade)}</div><p class="crm-muted">${esc(b.memo||b.features||'')}</p><div class="crm-quick-actions"><button class="crm-btn" data-crm-go="products">${ncIcon('products')}상품 확인</button><button class="crm-btn" data-crm-go="archive">${ncIcon('files')}브랜드 자료</button></div></section>`;};

// Poll only visible, idle lists. Forms and detail editors are never repainted by a background read.
async function ncRefreshVisible_(){
 if(State.view!=='admin'||document.hidden||NC.polling||Busy.count||OPS.editing||CRM.detail||!$('#modal').classList.contains('hidden'))return;
 if(!['dashboard','brands','products'].includes(State.route))return;
 const route=State.route;NC.polling=true;
 try{
  if(route==='brands'){const data=await server('getBrandWorkspace');if(State.route===route&&!CRM.detail){CRM.data=data;CRM.loadedAt=Date.now();const focused=document.activeElement?.id;if(focused!=='crmSearch')crmRender();}}
  else if(route==='products'){if(NC.view==='list')await ncFetchProducts_();const result=await server('getAdminSection','productSubmissions',{});if(State.route===route){ncCounts_(result.submissions||[]);if(NC.view==='review'){const status=$('#productWorkspace [data-status].active')?.dataset.status||'';renderSubmissionList(result.submissions||[]);$('#productWorkspace [data-status]').find(b=>b.dataset.status===status)?.click();}} }
  else{const data=await server('getAdminSection','dashboard',{});if(State.route===route){State.sectionCache.dashboard={data,at:Date.now()};renderDashboard(data);}}
 }catch(e){const el=$('#ncUpdated');if(el)el.textContent='갱신 지연 · 새로고침으로 다시 시도';}finally{NC.polling=false;}
}
setInterval(ncRefreshVisible_,30000);window.addEventListener('focus',ncRefreshVisible_);
const ncCloseModal=UI.closeModal;UI.closeModal=function(){ncCloseModal();$('#modal').classList.remove('bo-settings-dialog');};

let ncMigrationPlan=[];
async function ncMigrationPreview_(){
 UI.modal('<h2>상품 자료 폴더 링크 전환</h2><p>기존 파일 링크와 접근 가능한 폴더를 확인하고 있습니다.</p>');
 try{const data=await server('getNotionAssetMigration');ncMigrationPlan=data.items||[];
 $('#modalBody').innerHTML='<h2>상품 자료 폴더 링크 전환</h2><p>대표 이미지·상세페이지의 파일 주소를 해당 파일이 있는 폴더 주소로 변경합니다.</p><p>전환 가능: '+ncMigrationPlan.length+'개 상품 · 접근 확인 필요: '+(data.unresolved||[]).length+'개 링크</p><ul>'+ncMigrationPlan.map(p=>'<li>'+esc(p.name)+'</li>').join('')+'</ul><div id="ncMigrationStatus"></div><div class="modal-actions"><button class="secondary-button" onclick="UI.closeModal()">닫기</button><button class="primary-button" id="ncMigrationRun" '+(ncMigrationPlan.length?'':'disabled')+' onclick="ncMigrationRun_()">폴더 링크로 전환</button></div>';
 }catch(e){$('#modalBody').innerHTML=UI.empty('폴더 확인 실패',e.message)}
}
async function ncMigrationRun_(){
 const button=$('#ncMigrationRun');button.disabled=true;let done=0,failures=[];
 try{for(let i=0;i<ncMigrationPlan.length;i+=5){const response=await server('saveAdminAction','normalizeNotionAssetFolders',{items:ncMigrationPlan.slice(i,i+5)});done+=response.results.filter(r=>r.ok).length;failures=failures.concat(response.results.filter(r=>!r.ok));$('#ncMigrationStatus').textContent=done+'개 상품 전환 완료';}
 $('#ncMigrationStatus').textContent=done+'개 상품 전환 완료'+(failures.length?' · 실패 '+failures.length+'개: '+failures.map(r=>r.message).join('; '):'');
 }catch(e){$('#ncMigrationStatus').textContent=done+'개 상품 전환 후 중단: '+e.message;button.disabled=false;}
}
</script>
