<script>
/* 브랜드 상품등록센터. 링크 토큰으로만 동작하며 자기 브랜드 데이터만 보입니다. */
'use strict';
const P = { boot: null, tab: 'products', drafts: [], selected: new Set(), current: '', thumbs: {}, busy: false };

const draftKey = () => 'bo2-drafts-' + P.boot.brand.code;
const saveDrafts = () => { if (!Store.set(draftKey(), P.drafts)) Toast.show('이 브라우저는 임시 저장을 막고 있습니다. 제출 전 창을 닫지 마세요.'); };
const fields = () => P.boot.fields.filter((f) => f.type !== 'asset');
const assetField = (code) => P.boot.fields.find((f) => f.asset === code);
const REVIEW_TEXT = { '검수 대기': '검수 중', '보완 필요': '보완 필요', '반려': '반려', '승인 완료': '등록 완료' };

/* ---------- 틀 ---------- */
function renderPartnerShell() {
  const b = P.boot.brand;
  $('#root').innerHTML =
    '<div class="p-shell"><header class="p-top"><div class="p-top-inner">' +
      '<div class="row between wrap"><div><div class="logo" style="padding:0"><strong>BEAUTYORA</strong><span>상품등록센터</span></div></div><div class="row"><span class="pill pill-brand">' + esc(b.name) + '</span><span class="small muted hide-sm">' + esc(b.company) + '</span></div></div>' +
      '<nav class="tabs" role="tablist" id="ptabs"></nav>' +
    '</div></header><main class="p-main" id="pview"></main></div>';
  $('#ptabs').addEventListener('click', (e) => { const t = e.target.closest('[data-ptab]'); if (t) go(t.dataset.ptab); });
  renderTabs();
}

function renderTabs() {
  const counts = { drafts: P.drafts.length, status: P.boot.products.filter((p) => p.review === '보완 필요' || p.change === '보완 필요').length };
  const tabs = [['products', '상품 목록'], ['drafts', '작성·제출'], ['status', '검수 결과'], ['docs', '브랜드 서류']];
  $('#ptabs').innerHTML = tabs.map((t) => '<button class="tab" role="tab" data-ptab="' + t[0] + '" aria-selected="' + (P.tab === t[0]) + '">' + esc(t[1]) + (counts[t[0]] ? ' <span class="count' + (t[0] === 'status' ? '' : ' quiet') + '">' + counts[t[0]] + '</span>' : '') + '</button>').join('');
}

function go(tab) {
  P.tab = tab;
  renderTabs();
  const old = $('#pview');
  const view = old.cloneNode(false);
  old.replaceWith(view);
  ({ products: viewProducts, drafts: viewDrafts, status: viewStatus, docs: viewDocs })[tab](view);
  window.scrollTo(0, 0);
}

/* ---------- 상품 목록 ---------- */
function productActions(p) {
  if (P.drafts.some((d) => d.id === p.productId)) return '<button class="btn btn-sm" data-open-draft="' + esc(p.productId) + '">작성 중인 내용 보기</button>';
  if (p.review === '보완 필요' || p.review === '반려') return '<button class="btn btn-sm btn-primary" data-edit="' + esc(p.productId) + '">보완해서 다시 제출</button>';
  if (p.change === '검수 대기') return '<span class="small muted">변경 검수 중</span>';
  if (p.review === '검수 대기') return '<button class="btn btn-sm" data-edit="' + esc(p.productId) + '">내용 고치기</button>';
  return '<button class="btn btn-sm" data-edit="' + esc(p.productId) + '">수정 요청</button>';
}

function viewProducts(view) {
  const list = P.boot.products;
  view.innerHTML =
    '<section class="card card-pad stack"><div class="row between wrap"><div><h2 style="font-size:18px">상품 등록 방법</h2><div class="steps" style="margin-top:6px"><span><b>1</b>상품 정보 작성</span><span><b>2</b>대표 이미지·상세페이지 올리기</span><span><b>3</b>선택해서 제출</span><span><b>4</b>뷰티오라 검수 후 등록</span></div></div>' +
      '<div class="row wrap"><button class="btn" id="csvTemplate">' + icon('file') + '엑셀 양식</button><label class="btn" for="importFile">' + icon('upload') + '엑셀·CSV로 여러 개</label><input type="file" id="importFile" accept=".csv,.xlsx" class="sr-only"><button class="btn btn-primary" id="newProduct">' + icon('plus') + '새 상품 등록</button></div></div>' +
      '<p class="small muted">작성 중인 내용은 이 브라우저에만 임시 저장됩니다. 제출해야 뷰티오라에 전달됩니다.</p></section>' +
    '<div class="toolbar"><input class="input search" id="pq" type="search" placeholder="상품명·바코드 검색" aria-label="검색"><span class="grow"></span><span class="small muted">' + list.length + '개</span></div>' +
    '<section class="card" id="plist"></section>';
  const paint = () => {
    const q = $('#pq').value.trim().toLowerCase();
    const rows = list.filter((p) => !q || [p.name, p.barcode, p.option].join(' ').toLowerCase().includes(q));
    $('#plist').innerHTML = rows.length ? '<div class="list">' + rows.map((p) => '<div class="list-item">' + '<span class="thumb" data-thumb="' + esc(p.mainFileId) + '">' + (P.thumbs[p.mainFileId] ? '<img src="' + esc(P.thumbs[p.mainFileId]) + '" alt="" onerror="this.remove()">' : icon('box')) + '</span>' + '<div class="grow"><div class="cell-title ellipsis">' + esc(p.name) + '</div><div class="cell-sub">' + esc([p.option, p.barcode].filter(Boolean).join(' · ') || '—') + '</div>' + (p.reviewNote ? '<div class="small" style="color:var(--bad)">' + esc(p.reviewNote) + '</div>' : '') + '</div>' + pill(REVIEW_TEXT[p.review] || '등록됨', p.review === '승인 완료' || !p.review ? 'ok' : p.review === '검수 대기' ? 'warn' : 'bad') + (p.change === '검수 대기' ? pill('변경 검수 중', 'warn') : p.change === '보완 필요' || p.change === '반려' ? pill('변경 ' + p.change, 'bad') : '') + productActions(p) + '</div>').join('') + '</div>' : UI.empty(list.length ? '검색 결과가 없습니다' : '아직 등록한 상품이 없습니다', list.length ? '' : '"새 상품 등록"을 눌러 시작해 주세요.');
    loadThumbs(rows.map((p) => p.mainFileId));
  };
  $('#pq').addEventListener('input', paint);
  $('#plist').addEventListener('click', (e) => {
    const edit = e.target.closest('[data-edit]');
    if (edit) { editExisting(edit.dataset.edit); return; }
    const open = e.target.closest('[data-open-draft]');
    if (open) { P.current = open.dataset.openDraft; go('drafts'); }
  });
  $('#newProduct').addEventListener('click', () => { newDraft(); go('drafts'); });
  $('#csvTemplate').addEventListener('click', downloadTemplate);
  $('#importFile').addEventListener('change', (e) => importFile(e.target));
  paint();
}

function loadThumbs(ids) {
  const need = ids.filter((id) => id && !Object.prototype.hasOwnProperty.call(P.thumbs, id)).slice(0, 24);
  if (!need.length) return;
  need.forEach((id) => { P.thumbs[id] = ''; });
  Api.call('partner.thumbnails', { fileIds: need }).then((r) => {
    Object.keys(r.thumbnails).forEach((id) => {
      P.thumbs[id] = r.thumbnails[id];
      $$('[data-thumb="' + id + '"]').forEach((el) => { if (r.thumbnails[id]) el.innerHTML = '<img src="' + esc(r.thumbnails[id]) + '" alt="" onerror="this.remove()">'; });
    });
  }).catch(() => {});
}

/* ---------- 초안 ---------- */
function newDraft(data) {
  const draft = { id: uid('PRD'), mode: 'new', data: data || {}, uploads: [], updatedAt: Date.now() };
  P.drafts.unshift(draft);
  P.current = draft.id;
  saveDrafts();
  return draft;
}

async function editExisting(productId) {
  const p = P.boot.products.find((x) => x.productId === productId);
  if (!p) return;
  const mode = p.review === '승인 완료' || !p.review ? 'change' : 'revision';
  const draft = { id: p.productId, mode, name: p.name, data: JSON.parse(JSON.stringify(p.values || {})), uploads: [], existing: [], reviewNote: p.reviewNote, updatedAt: Date.now() };
  P.drafts = P.drafts.filter((d) => d.id !== productId);
  P.drafts.unshift(draft);
  P.current = draft.id;
  saveDrafts();
  go('drafts');
}

function draftIssues(d) {
  const issues = [];
  fields().forEach((f) => {
    const v = d.data[f.id];
    const empty = v == null || v === '' || (Array.isArray(v) && !v.length);
    if (f.required && empty && f.notionType !== 'checkbox') issues.push(f.label);
    else if (!empty && f.notionType === 'number' && !isFinite(Number(String(v).replace(/[,\s원]/g, '')))) issues.push(f.label + '(숫자)');
    else if (!empty && f.notionType === 'url' && !/^https?:\/\/\S+$/i.test(String(v))) issues.push(f.label + '(주소)');
  });
  const has = (code) => d.uploads.some((u) => u.code === code && u.fileId) || (d.existing || []).some((a) => a.categoryCode === code);
  ['main', 'detail'].forEach((code) => { const f = assetField(code); if (f && f.required && !has(code)) issues.push(f.label.replace(/ Drive URL$/, '')); });
  if (d.uploads.some((u) => u.state === 'uploading')) issues.push('업로드 진행 중');
  return issues;
}

function viewDrafts(view) {
  if (!P.drafts.length) {
    view.innerHTML = '<section class="card">' + UI.empty('작성 중인 상품이 없습니다', '새 상품을 등록하거나 상품 목록에서 수정할 상품을 골라 주세요.', '<button class="btn btn-primary" id="dNew">' + icon('plus') + '새 상품 등록</button>') + '</section>';
    $('#dNew').addEventListener('click', () => { newDraft(); go('drafts'); });
    return;
  }
  if (!P.drafts.some((d) => d.id === P.current)) P.current = P.drafts[0].id;
  view.innerHTML = '<div class="editor"><aside class="card draft-list"><div class="card-head"><h3>작성 중 ' + P.drafts.length + '</h3><button class="btn btn-sm" id="dAdd">' + icon('plus') + '추가</button></div><div class="list" id="dList"></div><div class="sticky-actions" style="justify-content:space-between"><label class="check small"><input type="checkbox" id="dAll"> 모두 선택</label><button class="btn btn-primary" id="dSubmit">선택 제출</button></div></aside><section id="dEditor"></section></div>';
  const paintList = () => {
    $('#dList').innerHTML = P.drafts.map((d) => {
      const issues = draftIssues(d);
      return '<div class="list-item' + (d.id === P.current ? ' selected' : '') + '" style="padding:10px 12px' + (d.id === P.current ? ';background:var(--brand-soft)' : '') + '"><input type="checkbox" data-sel="' + esc(d.id) + '"' + (P.selected.has(d.id) ? ' checked' : '') + ' aria-label="제출 선택"><button class="grow btn-ghost" style="border:0;background:none;text-align:left;cursor:pointer;padding:0" data-pick="' + esc(d.id) + '"><div class="cell-title ellipsis">' + esc(d.data.product_name || d.name || '이름 없는 상품') + '</div><div class="cell-sub">' + ({ new: '새 상품', revision: '보완 재제출', change: '수정 요청' })[d.mode] + ' · ' + (issues.length ? '<span style="color:var(--bad)">' + issues.length + '개 남음</span>' : '<span style="color:var(--ok)">제출 가능</span>') + '</div></button></div>';
    }).join('');
    $('#dAll').checked = P.drafts.length > 0 && P.drafts.every((d) => P.selected.has(d.id));
    $('#dSubmit').textContent = P.selected.size ? '선택 ' + P.selected.size + '개 제출' : '선택 제출';
  };
  $('#dList').addEventListener('click', (e) => {
    const pick = e.target.closest('[data-pick]');
    if (pick) { P.current = pick.dataset.pick; paintList(); paintEditor(); }
  });
  $('#dList').addEventListener('change', (e) => {
    const sel = e.target.closest('[data-sel]');
    if (!sel) return;
    if (sel.checked) P.selected.add(sel.dataset.sel); else P.selected.delete(sel.dataset.sel);
    paintList();
  });
  $('#dAll').addEventListener('change', (e) => { P.drafts.forEach((d) => (e.target.checked ? P.selected.add(d.id) : P.selected.delete(d.id))); paintList(); });
  $('#dAdd').addEventListener('click', () => { newDraft(); paintList(); paintEditor(); });
  $('#dSubmit').addEventListener('click', submitDialog);
  P.paintDraftList = paintList;
  paintList();
  paintEditor();
}

function fieldInput(f, value) {
  const id = 'f-' + f.id;
  const attrs = ' id="' + esc(id) + '" data-field="' + esc(f.id) + '"';
  const v = value == null ? '' : value;
  switch (f.notionType) {
    case 'select': return '<select class="select"' + attrs + '>' + UI.options(f.options, v, '선택해 주세요') + '</select>';
    case 'multi_select': return '<div class="chips-select"' + attrs + ' data-multi role="group" aria-label="' + esc(f.label) + '">' + f.options.map((o) => '<label><input type="checkbox" value="' + esc(o) + '"' + ((Array.isArray(v) ? v : String(v).split(',').map((x) => x.trim())).indexOf(o) >= 0 ? ' checked' : '') + '>' + esc(o) + '</label>').join('') + '</div>';
    case 'checkbox': return '<label class="check"><input type="checkbox"' + attrs + (v === true ? ' checked' : '') + '> 예</label>';
    case 'number': return '<input class="input num" inputmode="decimal"' + attrs + ' value="' + esc(v) + '" placeholder="' + esc(f.examples || '숫자만 입력') + '">';
    case 'date': return '<input class="input" type="date"' + attrs + ' value="' + esc(String(v).slice(0, 10)) + '">';
    case 'url': return '<input class="input" type="url" inputmode="url"' + attrs + ' value="' + esc(v) + '" placeholder="https://">';
    case 'email': return '<input class="input" type="email"' + attrs + ' value="' + esc(v) + '">';
    default: return f.type === 'textarea' ? '<textarea class="textarea" rows="3"' + attrs + ' placeholder="' + esc(f.examples) + '">' + esc(v) + '</textarea>' : '<input class="input"' + attrs + ' value="' + esc(v) + '" placeholder="' + esc(f.examples) + '">';
  }
}

const ASSET_SLOTS = [
  { code: 'main', label: '대표 이미지', accept: 'image/jpeg,image/png,image/webp', help: '정사각형에 가까운 제품 단독 이미지 1장' },
  { code: 'extra', label: '추가 이미지', accept: 'image/jpeg,image/png,image/webp', help: '여러 장 올릴 수 있습니다' },
  { code: 'detail', label: '상세페이지', accept: 'image/jpeg,image/png,image/webp,application/pdf', help: '이미지 또는 PDF, 여러 개 가능' }
];

function paintEditor() {
  const d = P.drafts.find((x) => x.id === P.current);
  const previous = $('#dEditor');
  if (!d || !previous) return;
  // 다시 그릴 때마다 새 요소를 써서 업로드 처리기가 겹치지 않게 한다.
  const box = previous.cloneNode(false);
  previous.replaceWith(box);
  const issues = draftIssues(d);
  box.innerHTML = '<div class="card">' +
    '<div class="card-head"><div class="grow"><h2 style="font-size:17px">' + esc(d.data.product_name || d.name || '새 상품') + '</h2><div class="small muted">' + ({ new: '새 상품 등록', revision: '보완해서 다시 제출', change: '등록된 상품 수정 요청 — 검수 후 반영됩니다' })[d.mode] + '</div></div><button class="btn btn-sm btn-danger" id="dDelete">' + icon('trash') + '삭제</button></div>' +
    '<div class="card-body stack-lg">' +
      (d.reviewNote ? '<div class="notice bad">' + icon('alert') + '<div><strong>뷰티오라 검수 메모</strong><div class="pre">' + esc(d.reviewNote) + '</div></div></div>' : '') +
      '<div><h3 class="section-title">상품 정보</h3><div class="form-grid" id="dForm">' + fields().map((f) => UI.field(f.label, fieldInput(f, d.data[f.id]), { for: 'f-' + f.id, required: f.required, help: f.help, full: f.type === 'textarea' || f.notionType === 'multi_select' })).join('') + '</div></div>' +
      '<div><h3 class="section-title">이미지·상세페이지</h3><div class="stack">' + ASSET_SLOTS.map((slot) => {
        const f = assetField(slot.code);
        const mine = d.uploads.filter((u) => u.code === slot.code);
        const existing = (d.existing || []).filter((a) => a.categoryCode === slot.code);
        return '<div class="field"><span class="field-label">' + esc(slot.label) + (f && f.required ? '<span class="req">*</span>' : '') + ' <span class="field-help">' + esc(slot.help) + '</span></span>' +
          '<div class="files">' + existing.map((a) => '<div class="file-row">' + icon('file') + '<span class="grow ellipsis">' + esc(a.name) + '</span><span class="small muted">등록됨</span></div>').join('') +
          mine.map((u) => '<div class="file-row">' + (u.preview ? '<span class="thumb" style="width:36px;height:36px"><img src="' + esc(u.preview) + '" alt=""></span>' : icon('file')) + '<span class="grow ellipsis">' + esc(u.name) + '</span>' + (u.state === 'uploading' ? '<span class="small muted">올리는 중…</span>' : u.state === 'error' ? '<span class="small" style="color:var(--bad)">' + esc(u.error) + '</span><button class="btn btn-sm" data-remove="' + esc(u.uploadId) + '">지우기</button>' : '<span class="small" style="color:var(--ok)">완료</span>') + '</div>').join('') + '</div>' +
          '<label class="dropzone" data-drop="' + slot.code + '">' + icon('upload') + '<span>눌러서 파일 선택 또는 끌어다 놓기</span><span class="small">JPG·PNG·WEBP' + (slot.code === 'detail' ? '·PDF' : '') + ', 파일당 8MB 이하</span><input type="file" class="sr-only" accept="' + slot.accept + '"' + (slot.code === 'main' ? '' : ' multiple') + ' data-upload="' + slot.code + '"></label></div>';
      }).join('') + '</div></div>' +
    '</div>' +
    '<div class="sticky-actions">' + (issues.length ? '<span class="small grow" style="color:var(--bad)">남은 항목: ' + esc(issues.slice(0, 5).join(', ')) + (issues.length > 5 ? ' 외 ' + (issues.length - 5) + '개' : '') + '</span>' : '<span class="small grow" style="color:var(--ok)">제출할 수 있습니다</span>') + '<button class="btn btn-primary" id="dSubmitOne"' + (issues.length ? ' disabled' : '') + '>이 상품 제출</button></div>' +
  '</div>';
  const form = $('#dForm', box);
  const onEdit = () => {
    fields().forEach((f) => {
      const el = form.querySelector('[data-field="' + f.id + '"]');
      if (!el) return;
      d.data[f.id] = el.hasAttribute('data-multi') ? $$('input:checked', el).map((i) => i.value) : el.type === 'checkbox' ? el.checked : el.value;
    });
    d.updatedAt = Date.now();
    saveDrafts();
    clearTimeout(P.listTimer);
    P.listTimer = setTimeout(() => { if (P.paintDraftList) P.paintDraftList(); const issuesNow = draftIssues(d); const btn = $('#dSubmitOne'); if (btn) btn.disabled = !!issuesNow.length; const hint = btn && btn.previousElementSibling; if (hint) { hint.style.color = issuesNow.length ? 'var(--bad)' : 'var(--ok)'; hint.textContent = issuesNow.length ? '남은 항목: ' + issuesNow.slice(0, 5).join(', ') : '제출할 수 있습니다'; } }, 250);
  };
  form.addEventListener('input', onEdit);
  form.addEventListener('change', onEdit);
  box.addEventListener('change', (e) => { const input = e.target.closest('[data-upload]'); if (input) uploadFiles(d, input.dataset.upload, Array.from(input.files)); });
  $$('[data-drop]', box).forEach((zone) => {
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('over'); uploadFiles(d, zone.dataset.drop, Array.from(e.dataTransfer.files)); });
  });
  box.addEventListener('click', (e) => {
    const rm = e.target.closest('[data-remove]');
    if (rm) { d.uploads = d.uploads.filter((u) => u.uploadId !== rm.dataset.remove); saveDrafts(); paintEditor(); }
  });
  $('#dDelete', box).addEventListener('click', async () => {
    if (!await Modal.confirm('작성 중인 상품 삭제', '이 브라우저에 저장된 작성 내용을 지웁니다. 이미 제출한 상품에는 영향이 없습니다.', '삭제', 'btn-danger')) return;
    P.drafts = P.drafts.filter((x) => x.id !== d.id);
    P.selected.delete(d.id);
    saveDrafts();
    renderTabs();
    go('drafts');
  });
  $('#dSubmitOne', box).addEventListener('click', () => { P.selected = new Set([d.id]); submitDialog(); });
  if ((d.mode === 'change' || d.mode === 'revision') && !d.existingLoaded) {
    d.existingLoaded = true;
    Api.call('partner.assets', { productId: d.id }).then((r) => { d.existing = r.assets; saveDrafts(); if (P.current === d.id) paintEditor(); if (P.paintDraftList) P.paintDraftList(); }).catch(() => { d.existingLoaded = false; });
  }
}

async function uploadFiles(d, code, files) {
  const slot = ASSET_SLOTS.find((s) => s.code === code);
  const label = slot.label;
  for (const original of files) {
    if (!slot.accept.split(',').includes(original.type)) { Toast.error(original.name + ': ' + (code === 'detail' ? 'JPG·PNG·WEBP·PDF' : 'JPG·PNG·WEBP') + ' 파일만 올릴 수 있습니다.'); continue; }
    const file = await shrinkImage(original);
    if (file.size > P.boot.limits.maxUploadBytes) { Toast.error(original.name + ': 8MB를 넘습니다. 용량을 줄여 주세요.'); continue; }
    const entry = { uploadId: uid('UP'), code, name: file.name, state: 'uploading', preview: /^image\//.test(file.type) ? URL.createObjectURL(file) : '' };
    if (code === 'main') d.uploads = d.uploads.filter((u) => u.code !== 'main');
    d.uploads.push(entry);
    if (P.current === d.id) paintEditor();
    try {
      const base64 = await fileToBase64(file);
      const r = await Api.call('partner.upload', { kind: 'asset', productId: d.id, category: label, uploadId: entry.uploadId, fileName: file.name, mimeType: file.type, base64 });
      entry.fileId = r.file.id;
      entry.state = 'done';
    } catch (e) {
      entry.state = 'error';
      entry.error = e.message;
    }
    entry.preview = entry.state === 'done' && entry.preview ? entry.preview : '';
    saveDrafts();
    if (P.current === d.id) paintEditor();
    if (P.paintDraftList) P.paintDraftList();
  }
}

function submitDialog() {
  const picked = P.drafts.filter((d) => P.selected.has(d.id));
  if (!picked.length) { Toast.error('제출할 상품을 선택해 주세요.'); return; }
  const blocked = picked.filter((d) => draftIssues(d).length);
  if (blocked.length) { Toast.error('입력이 끝나지 않은 상품이 있습니다: ' + blocked.map((d) => d.data.product_name || '이름 없는 상품').join(', ')); return; }
  if (picked.length > P.boot.limits.maxProducts) { Toast.error('한 번에 ' + P.boot.limits.maxProducts + '개까지 제출할 수 있습니다.'); return; }
  const contact = Store.get('bo2-contact', { name: '', phone: '' });
  const m = Modal.open({
    title: picked.length + '개 상품 제출',
    body: '<ul class="small">' + picked.map((d) => '<li>' + esc(d.data.product_name) + ' — ' + ({ new: '새 상품', revision: '보완 재제출', change: '수정 요청' })[d.mode] + '</li>').join('') + '</ul>' +
      '<div class="form-grid">' + UI.field('제출하시는 분', '<input class="input" id="sName" value="' + esc(contact.name) + '" autocomplete="name">', { for: 'sName', required: true }) + UI.field('연락처', '<input class="input" id="sPhone" value="' + esc(contact.phone) + '" autocomplete="tel" inputmode="tel">', { for: 'sPhone' }) + '</div>' +
      '<p class="small muted">제출 후 뷰티오라가 검수합니다. 결과는 "검수 결과" 탭에서 확인할 수 있습니다.</p>',
    foot: '<button class="btn" data-close>취소</button><button class="btn btn-primary" id="sGo">제출</button>'
  });
  const requestId = uid('SUB');
  $('#sGo', m).addEventListener('click', (e) => busy(e.currentTarget, async () => {
    const name = $('#sName', m).value.trim();
    if (!name) { Toast.error('이름을 입력해 주세요.'); return; }
    Store.set('bo2-contact', { name, phone: $('#sPhone', m).value.trim() });
    try {
      const r = await Api.call('partner.submit', { requestId, contactName: name, contactPhone: $('#sPhone', m).value.trim(), products: picked.map((d) => ({ productId: d.id, data: d.data })) });
      if (!r.ok) {
        Modal.close();
        Modal.open({ title: '제출하지 못했습니다', body: '<p>아래 내용을 고친 뒤 다시 제출해 주세요. (아무것도 저장되지 않았습니다)</p><ul>' + r.problems.map((p) => '<li><strong>' + esc(p.name) + '</strong>: ' + esc(p.messages.join(' / ')) + '</li>').join('') + '</ul>' });
        return;
      }
      Modal.close();
      const done = new Set(r.results.map((x) => x.productId));
      P.drafts = P.drafts.filter((d) => !done.has(d.id));
      P.selected.clear();
      saveDrafts();
      Toast.ok(r.results.length + '개 상품을 제출했습니다. 검수 결과는 "검수 결과" 탭에서 확인해 주세요.');
      await refreshBoot();
      go('status');
    } catch (err) { Toast.error(err); }
  }));
}

      const upload = await shrinkImage(file);
      if (upload.size > P.boot.limits.maxUploadBytes) throw new Error('8MB를 넘습니다. 용량을 줄여 주세요.');

/* ---------- 엑셀·CSV ---------- */
function downloadTemplate() {
  const cols = fields();
  const header = cols.map((f) => f.label + (f.required ? ' *' : ''));
  const example = cols.map((f) => f.examples || (f.notionType === 'multi_select' || f.notionType === 'select' ? (f.options[0] || '') : ''));
  const csv = '﻿' + [header, example].map((row) => row.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = P.boot.brand.name + '_상품등록_양식.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  Toast.show('두 번째 줄의 예시는 지우고 작성해 주세요. 이미지는 등록 화면에서 올립니다.');
}

function parseCsv(text) {
  const rows = []; let row = []; let cell = ''; let quoted = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') quoted = false; else cell += c; }
    else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function mapRows(values) {
  const cols = fields();
  const norm = (h) => String(h).replace(/\s*\*$/, '').trim();
  const headerRow = values.findIndex((row) => row.some((c) => norm(c) === '상품명' || norm(c) === 'product_name'));
  if (headerRow < 0) throw new Error('"상품명" 머리글을 찾지 못했습니다. 양식을 내려받아 사용해 주세요.');
  const headers = values[headerRow].map(norm);
  const index = {};
  cols.forEach((f) => { const short = f.label.replace(/\s*\([^)]*\)\s*$/, ''); const i = headers.findIndex((h) => h === f.label || h === f.id || h === short); if (i >= 0) index[f.id] = i; });
  return values.slice(headerRow + 1).filter((r) => r.some((c) => String(c).trim())).map((r) => {
    const data = {};
    Object.keys(index).forEach((id) => {
      const f = cols.find((x) => x.id === id);
      const v = String(r[index[id]] == null ? '' : r[index[id]]).trim();
      data[id] = f.notionType === 'multi_select' ? v.split(',').map((x) => x.trim()).filter(Boolean) : f.notionType === 'checkbox' ? /^(y|yes|true|예|o|1)$/i.test(v) : v;
    });
    return data;
  });
}

async function importFile(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  try {
    let rows;
    if (/\.csv$/i.test(file.name)) rows = mapRows(parseCsv(await file.text()));
    else if (/\.xlsx$/i.test(file.name)) {
      Toast.show('엑셀 파일을 읽는 중입니다…');
      rows = (await Api.call('partner.importWorkbook', { fileName: file.name, base64: await fileToBase64(file) })).rows;
    } else throw new Error('CSV 또는 xlsx 파일을 골라 주세요.');
    rows = rows.filter((r) => r.product_name);
    if (!rows.length) throw new Error('상품명이 있는 행이 없습니다.');
    rows.slice(0, 300).reverse().forEach((data) => newDraft(data));
    Toast.ok(rows.length + '개 상품을 불러왔습니다. 이미지를 올린 뒤 제출해 주세요.');
    go('drafts');
  } catch (e) { Toast.error(e); }
}

/* ---------- 시작 ---------- */
async function refreshBoot() {
  const data = await Api.call('partner.bootstrap');
  P.boot = data;
  renderTabs();
}

async function bootPartner() {
  if (!App.token) {
    $('#root').innerHTML = '<div class="boot"><strong style="color:var(--ink);font-size:17px">상품등록 링크가 필요합니다</strong><p>뷰티오라 담당자에게 받은 링크로 다시 접속해 주세요.</p></div>';
    return;
  }
  try {
    P.boot = await Api.call('partner.bootstrap');
    P.drafts = Store.get(draftKey(), []).filter((d) => d && d.id && d.data);
    P.drafts.forEach((d) => { d.uploads = (d.uploads || []).filter((u) => u.state === 'done').map((u) => Object.assign(u, { preview: '' })); });
    document.title = P.boot.brand.name + ' · 뷰티오라 상품등록센터';
    renderPartnerShell();
    go(P.drafts.length ? 'drafts' : 'products');
  } catch (e) {
    $('#root').innerHTML = '<div class="boot"><strong style="color:var(--ink);font-size:17px">상품등록센터를 열 수 없습니다</strong><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">다시 시도</button></div>';
  }
}
bootPartner();
