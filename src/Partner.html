<script>
/* 브랜드 상품등록센터. 링크 토큰으로만 동작하며 자기 브랜드 데이터만 보입니다. */
'use strict';
const P = { boot: null, tab: 'products', drafts: [], selected: new Set(), current: '', thumbs: {}, busy: false };

const draftKey = () => 'bo2-drafts-' + P.boot.brand.code;
const saveDrafts = () => { if (!Store.set(draftKey(), P.drafts)) Toast.show('이 브라우저는 임시 저장을 막고 있습니다. 제출 전 창을 닫지 마세요.'); };
const fields = () => P.boot.fields.filter((f) => f.type !== 'asset');
const assetField = (code) => P.boot.fields.find((f) => f.asset === code);
const REVIEW_TEXT = { '검수 대기': '검수 중', '보완 필요': '보완 필요', '반려': '반려', '승인 완료': '등록 완료' };

/* ---------- 틀 ---------- */
function renderPartnerShell() {
  const b = P.boot.brand;
  $('#root').innerHTML =
    '<div class="p-shell"><header class="p-top"><div class="p-top-inner">' +
      '<div class="row between wrap"><div><div class="logo" style="padding:0">' + LOGO_SVG + '<span>상품등록센터</span></div></div><div class="row"><span class="small muted hide-sm" id="pLinkInfo"></span><span class="pill pill-brand">' + esc(b.name) + '</span><span class="small muted hide-sm">' + esc(b.company) + '</span></div></div>' +
      '<div class="row between" style="gap:12px"><nav class="tabs grow" role="tablist" id="ptabs"></nav><button class="btn btn-sm btn-primary" id="pNew" aria-label="새 상품 등록">' + icon('plus') + '<span class="hide-sm">새 상품 등록</span></button></div>' +
    '</div></header><main class="p-main" id="pview"></main></div>';
  $('#ptabs').addEventListener('click', (e) => { const t = e.target.closest('[data-ptab]'); if (t) go(t.dataset.ptab); });
  $('#pNew').addEventListener('click', () => { newDraft(); go('drafts'); });
  renderTabs();
}

function renderTabs() {
  const counts = { products: P.boot.products.filter((p) => statusKey(p) === 'revision').length, drafts: P.drafts.length };
  const tabs = [['products', '상품 관리'], ['drafts', '요청함 · 작성 중'], ['docs', '브랜드 서류']];
  const active = P.tab === 'bulk' ? 'products' : P.tab;
  $('#ptabs').innerHTML = tabs.map((t) => '<button class="tab" role="tab" data-ptab="' + t[0] + '" aria-selected="' + (active === t[0]) + '">' + esc(t[1]) + (counts[t[0]] ? ' <span class="count' + (t[0] === 'products' ? '' : ' quiet') + '">' + counts[t[0]] + '</span>' : '') + '</button>').join('');
}

function go(tab) {
  // 이전 탭에 예약된 목록 다시 그리기를 취소한다(사라진 요소를 그리지 않게).
  clearTimeout(P.listTimer);
  P.paintDraftList = null;
  if (P.tab === 'bulk' && tab !== 'bulk') cleanupAutoDrafts();
  P.tab = tab;
  renderTabs();
  const old = $('#pview');
  const view = old.cloneNode(false);
  old.replaceWith(view);
  view.classList.toggle('p-wide', tab === 'products' || tab === 'bulk');
  ({ products: viewProducts, drafts: viewDrafts, docs: viewDocs, bulk: viewBulk })[tab](view);
  window.scrollTo(0, 0);
}

/* ---------- 상품 상태 ---------- */
/** 목록 상태: revision(보완 필요) · pending(검수 중) · change(수정 요청 검토 중) · done(등록 완료) */
function statusKey(p) {
  if (p.review === '보완 필요' || p.review === '반려' || p.change === '보완 필요' || p.change === '반려') return 'revision';
  if (p.change === '검수 대기') return 'change';
  if (p.review === '검수 대기') return 'pending';
  return 'done';
}
const STATUS_LABEL = { revision: '보완 필요', pending: '검수 중', change: '수정 요청 검토 중', done: '등록 완료' };
const P_TONE = { revision: 'bad', pending: 'warn', change: 'info', done: 'ok' };
function statusLabel(p) {
  const k = statusKey(p);
  if (k === 'revision' && (p.change === '보완 필요' || p.change === '반려')) return '수정 ' + p.change;
  if (k === 'revision' && p.review === '반려') return '반려';
  return STATUS_LABEL[k];
}
const hasMainImage = (p) => !!(p.mainFileId || (p.linked && p.linked.main));
const productCategories = (p) => { const v = (p.values || {}).category; return Array.isArray(v) ? v : v ? String(v).split(',').map((x) => x.trim()).filter(Boolean) : []; };
const fmtWon = (v) => (v == null || v === '' ? '—' : isFinite(Number(String(v).replace(/[,\s원]/g, ''))) ? Number(String(v).replace(/[,\s원]/g, '')).toLocaleString('ko-KR') + '원' : esc(v));
const supplyOf = (p) => { const v = p.values || {}; return v.consignment_price != null && v.consignment_price !== '' ? v.consignment_price : v.purchase_price; };

/* ---------- 상품 관리 ---------- */
const PAGE_SIZE = 50;
P.filter = { status: 'all', category: '', flag: '', q: '', sort: 'edited', page: 1 };
P.sel = new Set();

function filteredProducts() {
  const f = P.filter;
  const q = f.q.trim().toLowerCase();
  const digits = q.replace(/\D/g, '');
  const list = P.boot.products.filter((p) =>
    (f.status === 'all' || statusKey(p) === f.status) &&
    (!f.category || productCategories(p).indexOf(f.category) >= 0) &&
    (!f.flag || (f.flag === 'noMain' ? !hasMainImage(p) : !p.barcode)) &&
    (!q || [p.name, p.option, p.barcode].join(' ').toLowerCase().includes(q) || (digits.length >= 4 && String(p.barcode || '').replace(/\D/g, '').includes(digits))));
  const by = { edited: (a, b) => String(b.edited).localeCompare(String(a.edited)), name: (a, b) => String(a.name).localeCompare(String(b.name), 'ko'), submitted: (a, b) => String(b.submittedAt || '').localeCompare(String(a.submittedAt || '')) }[f.sort];
  return list.slice().sort(by);
}

function rowAction(p) {
  if (P.drafts.some((d) => d.id === p.productId && !d.auto)) return { label: '작성 중 보기', primary: false };
  const k = statusKey(p);
  if (k === 'change') return { label: '검토 중', disabled: true };
  if (k === 'revision') return { label: '보완하기', primary: true };
  if (k === 'pending') return { label: '내용 고치기' };
  return { label: '수정' };
}

function viewProducts(view) {
  const all = P.boot.products;
  const counts = { all: all.length, revision: 0, pending: 0, change: 0, done: 0 };
  all.forEach((p) => { counts[statusKey(p)]++; });
  const cats = {};
  all.forEach((p) => productCategories(p).forEach((c) => { cats[c] = (cats[c] || 0) + 1; }));
  const noMain = all.filter((p) => !hasMainImage(p)).length;
  const noBarcode = all.filter((p) => !p.barcode).length;
  const railBtn = (group, value, label, n, tone) => '<button class="rail-item' + (P.filter[group] === value ? ' on' : '') + (tone ? ' tone-' + tone : '') + '" data-rail="' + group + '" data-value="' + esc(value) + '" aria-pressed="' + (P.filter[group] === value) + '"><span>' + esc(label) + '</span><span class="rail-n">' + Fmt.num(n) + '</span></button>';
  view.innerHTML =
    '<div class="pm">' +
    '<aside class="pm-rail" aria-label="상품 거르기">' +
      '<div class="rail-group"><span class="rail-title">상태</span>' + railBtn('status', 'all', '전체', counts.all) + railBtn('status', 'revision', '보완 필요', counts.revision, counts.revision ? 'bad' : '') + railBtn('status', 'pending', '검수 중', counts.pending) + railBtn('status', 'change', '수정 요청 검토 중', counts.change) + railBtn('status', 'done', '등록 완료', counts.done) + '</div>' +
      (Object.keys(cats).length ? '<div class="rail-group"><span class="rail-title">카테고리</span>' + railBtn('category', '', '전체', all.length) + Object.keys(cats).sort((a, b) => cats[b] - cats[a]).map((c) => railBtn('category', c, c, cats[c])).join('') + '</div>' : '') +
      '<div class="rail-group"><span class="rail-title">확인이 필요한 상품</span>' + railBtn('flag', 'noMain', '대표 이미지 없음', noMain, noMain ? 'warn' : '') + railBtn('flag', 'noBarcode', '바코드 없음', noBarcode, noBarcode ? 'warn' : '') + (P.filter.flag ? railBtn('flag', '', '거르기 해제', all.length) : '') + '</div>' +
    '</aside>' +
    '<div class="pm-main">' +
      (counts.revision ? '<div class="notice warn pm-banner">' + icon('alert') + '<div class="grow"><strong>보완이 필요한 상품 ' + counts.revision + '개</strong>가 있습니다. 검수 메모를 확인하고 고쳐 주세요.</div>' + (P.filter.status !== 'revision' ? '<button class="btn btn-sm btn-primary" data-rail="status" data-value="revision">보완 필요만 보기</button>' : '') + '</div>' : '') +
      '<div class="pm-tools">' +
        '<label class="pm-search">' + icon('search') + '<input id="pq" type="search" placeholder="상품명, 바코드, 옵션으로 찾기" aria-label="상품 검색" value="' + esc(P.filter.q) + '"><kbd class="hide-sm">/</kbd></label>' +
        '<select class="select" id="psort" aria-label="정렬">' + UI.options([{ value: 'edited', label: '최근 수정순' }, { value: 'name', label: '상품명순' }, { value: 'submitted', label: '최근 제출순' }], P.filter.sort) + '</select>' +
        '<button class="btn" id="pExport">' + icon('file') + '<span class="hide-sm">엑셀로 내려받기</span></button>' +
        '<label class="btn" for="importFile">' + icon('upload') + '<span class="hide-sm">엑셀 올리기</span></label><input type="file" id="importFile" accept=".csv,.xlsx" class="sr-only">' +
      '</div>' +
      '<div id="pselbar"></div>' +
      '<section class="card pm-list" id="plist"></section>' +
      '<p class="small muted">엑셀로 내려받아 고친 뒤 다시 올리면 바뀐 상품만 수정 요청으로 담깁니다. 새 상품은 <a href="#" id="csvTemplate">엑셀 양식</a>으로 여러 개를 한 번에 등록할 수 있습니다. 사진은 <b>바코드_대표.jpg</b>처럼 이름을 붙여 요청함의 <b>사진 한꺼번에</b>로 올립니다.</p>' +
    '</div></div>' +
    (counts.revision ? '<button class="pm-fab" data-rail="status" data-value="revision"><span>보완 필요 ' + counts.revision + '개부터 고치기</span><span class="pm-fab-go">시작</span></button>' : '');

  const paint = () => {
    const list = filteredProducts();
    P.visible = list.map((p) => p.productId);
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (P.filter.page > pages) P.filter.page = pages;
    const start = (P.filter.page - 1) * PAGE_SIZE;
    const rows = list.slice(start, start + PAGE_SIZE);
    const selectable = (p) => statusKey(p) !== 'change';
    const pageIds = rows.filter(selectable).map((p) => p.productId);
    const allOn = pageIds.length && pageIds.every((id) => P.sel.has(id));
    $('#plist').innerHTML = rows.length ?
      '<div class="pm-row pm-head"><input type="checkbox" id="pAll" aria-label="이 페이지 모두 선택"' + (allOn ? ' checked' : '') + '><span>상품</span><span class="pm-c-bar">바코드</span><span class="pm-c-num">소비자가</span><span class="pm-c-num pm-c-sup">공급가</span><span>상태</span><span class="pm-c-ed">최근 수정</span><span></span></div>' +
      rows.map((p) => {
        const act = rowAction(p);
        const on = P.sel.has(p.productId);
        return '<div class="pm-row' + (on ? ' on' : '') + '" data-open="' + esc(p.productId) + '">' +
          (selectable(p) ? '<input type="checkbox" data-sel="' + esc(p.productId) + '"' + (on ? ' checked' : '') + ' aria-label="' + esc(p.name) + ' 선택">' : '<span></span>') +
          '<div class="pm-prod"><span class="thumb' + (hasMainImage(p) ? '' : ' thumb-missing') + '" data-thumb="' + esc(p.mainFileId) + '">' + (P.thumbs[p.mainFileId] ? '<img src="' + esc(P.thumbs[p.mainFileId]) + '" alt="" onerror="this.remove()">' : icon('box')) + '</span>' +
            '<div class="grow"><div class="cell-title ellipsis">' + esc(p.name) + '</div><div class="cell-sub ellipsis">' + esc([p.option, productCategories(p).join(', ')].filter(Boolean).join(' · ') || '—') + '<span class="pm-m-only"> · ' + fmtWon((p.values || {}).retail_price) + '</span></div>' +
            (p.reviewNote && statusKey(p) === 'revision' ? '<div class="small pm-memo">검수 메모: ' + esc(p.reviewNote) + '</div>' : '') + '</div></div>' +
          '<span class="pm-c-bar mono">' + esc(p.barcode || '—') + '</span>' +
          '<span class="pm-c-num num">' + fmtWon((p.values || {}).retail_price) + '</span>' +
          '<span class="pm-c-num pm-c-sup num">' + fmtWon(supplyOf(p)) + '</span>' +
          '<span class="pm-c-st">' + pill(statusLabel(p), P_TONE[statusKey(p)]) + '</span>' +
          '<span class="pm-c-ed small muted">' + esc(Fmt.ago(p.edited)) + '</span>' +
          '<button class="btn btn-sm' + (act.primary ? ' btn-primary' : '') + '" data-act="' + esc(p.productId) + '"' + (act.disabled ? ' disabled' : '') + '>' + esc(act.label) + '</button>' +
        '</div>';
      }).join('') +
      '<div class="pm-foot"><span class="grow">' + Fmt.num(all.length) + '개 중 ' + (list.length !== all.length ? '조건에 맞는 ' + Fmt.num(list.length) + '개 · ' : '') + (start + 1) + '–' + (start + rows.length) + '</span>' + pager(P.filter.page, pages) + '</div>'
      : UI.empty(all.length ? '조건에 맞는 상품이 없습니다' : '아직 등록한 상품이 없습니다', all.length ? '거르기를 바꾸거나 검색어를 지워 보세요.' : '"새 상품 등록"이나 엑셀 양식으로 시작해 주세요.');
    paintSelBar();
    loadThumbs(rows.map((p) => p.mainFileId));
  };
  const paintSelBar = () => {
    const n = P.sel.size;
    $('#pselbar').innerHTML = n ? '<div class="pm-selbar"><strong>' + n + '개 선택됨</strong><span class="hide-sm pm-selbar-sub">선택한 상품만 한 번에 고칠 수 있어요</span><span class="grow"></span><button class="btn btn-sm btn-accent" data-bulk="all">표로 한꺼번에 수정</button><button class="btn btn-sm pm-ghost" data-bulk="price">가격만 바꾸기</button><button class="btn btn-sm btn-ghost pm-clear" id="pClear">선택 해제</button></div>' : '';
  };
  P.repaintProducts = paint;
  view.addEventListener('click', (e) => {
    const r = e.target.closest('[data-rail]');
    if (r) { P.filter[r.dataset.rail] = r.dataset.value; P.filter.page = 1; go('products'); return; }
    const pg = e.target.closest('[data-page]');
    if (pg) { P.filter.page = Number(pg.dataset.page); paint(); window.scrollTo(0, 0); return; }
    const bulk = e.target.closest('[data-bulk]');
    if (bulk) { openBulk(Array.from(P.sel), bulk.dataset.bulk === 'price'); return; }
    if (e.target.closest('#pClear')) { P.sel.clear(); paint(); return; }
    if (e.target.closest('#csvTemplate')) { e.preventDefault(); downloadTemplate(); return; }
    if (e.target.closest('input[type="checkbox"]')) return;
    const act = e.target.closest('[data-act]');
    const row = e.target.closest('[data-open]');
    const id = act ? act.dataset.act : row ? row.dataset.open : '';
    if (!id) return;
    const d = P.drafts.find((x) => x.id === id && !x.auto);
    if (act && d && act.textContent === '작성 중 보기') { P.current = id; go('drafts'); return; }
    const p = P.boot.products.find((x) => x.productId === id);
    if (p && statusKey(p) !== 'change') openProductDrawer(id);
    else if (p) Toast.show('수정 요청을 검토하고 있습니다. 검토가 끝난 뒤 다시 고칠 수 있어요.');
  });
  view.addEventListener('change', (e) => {
    const sel = e.target.closest('[data-sel]');
    if (sel) {
      if (sel.checked && P.sel.size >= P.boot.limits.maxProducts) { sel.checked = false; Toast.error('한 번에 ' + P.boot.limits.maxProducts + '개까지 고를 수 있습니다.'); return; }
      if (sel.checked) P.sel.add(sel.dataset.sel); else P.sel.delete(sel.dataset.sel);
      sel.closest('.pm-row').classList.toggle('on', sel.checked);
      paintSelBar();
      return;
    }
    if (e.target.id === 'pAll') {
      const boxes = $$('[data-sel]', $('#plist'));
      boxes.forEach((b) => { if (e.target.checked && !P.sel.has(b.dataset.sel) && P.sel.size >= P.boot.limits.maxProducts) return; if (e.target.checked) P.sel.add(b.dataset.sel); else P.sel.delete(b.dataset.sel); });
      paint();
      return;
    }
    if (e.target.id === 'psort') { P.filter.sort = e.target.value; P.filter.page = 1; paint(); }
  });
  let t = null;
  $('#pq').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { P.filter.q = e.target.value; P.filter.page = 1; paint(); }, 150); });
  $('#pExport').addEventListener('click', exportProducts);
  $('#importFile').addEventListener('change', (e) => importFile(e.target));
  paint();
}

function pager(page, pages) {
  if (pages <= 1) return '';
  const btn = (n, label, aria) => '<button class="btn btn-sm' + (n === page && !aria ? ' btn-primary' : ' btn-ghost') + '" data-page="' + n + '"' + (aria ? ' aria-label="' + aria + '"' : '') + (n < 1 || n > pages ? ' disabled' : '') + '>' + label + '</button>';
  const nums = [];
  for (let n = 1; n <= pages; n++) if (n === 1 || n === pages || Math.abs(n - page) <= 1) nums.push(n); else if (nums[nums.length - 1] !== '…') nums.push('…');
  return '<div class="row" style="gap:4px">' + btn(page - 1, '‹', '이전 페이지') + nums.map((n) => n === '…' ? '<span class="muted">…</span>' : btn(n, n)).join('') + btn(page + 1, '›', '다음 페이지') + '</div>';
}

document.addEventListener('keydown', (e) => {
  if (!P.boot || e.target.closest && e.target.closest('input, textarea, select')) return;
  if (e.key === '/' && P.tab === 'products' && !$('#drawer') && $('#pq')) { e.preventDefault(); $('#pq').focus(); }
  if ($('#drawer') && P.drawerId && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); stepDrawer(e.key === 'ArrowLeft' ? -1 : 1); }
});

/* ---------- 수정 패널(목록 위에서 고치기) ---------- */
/** 자동으로 만든 초안 중 아무것도 바꾸지 않은 것은 요청함에서 뺀다. */
function cleanupAutoDrafts(keepId) {
  const before = P.drafts.length;
  P.drafts = P.drafts.filter((d) => !d.auto || d.id === keepId || draftChanged(d));
  P.drafts.forEach((d) => { if (d.auto && draftChanged(d)) delete d.auto; });
  if (P.drafts.length !== before) saveDrafts();
}

function sameValue(f, a, b) {
  const norm = (v) => Array.isArray(v) ? v.slice().sort().join('|') : v == null ? '' : f && f.notionType === 'number' ? String(v).replace(/[,\s원]/g, '') : f && f.notionType === 'checkbox' ? String(!!v) : String(v).trim();
  return norm(a) === norm(b);
}
const describe = (v) => (v == null || v === '' || (Array.isArray(v) && !v.length)) ? '(비어 있음)' : Array.isArray(v) ? v.join(', ') : v === true ? '예' : v === false ? '아니오' : String(v);
function changedFields(d) { return d.base ? fields().filter((f) => !sameValue(f, d.data[f.id], d.base[f.id])) : []; }
function draftChanged(d) { return !d.base || changedFields(d).length > 0 || d.uploads.some((u) => u.fileId || u.state === 'uploading'); }

function openProductDrawer(productId) {
  const p = P.boot.products.find((x) => x.productId === productId);
  if (!p) return;
  if (P.drawerId && P.drawerId !== productId) cleanupAutoDrafts(productId);
  let d = P.drafts.find((x) => x.id === productId);
  if (!d) { d = draftForProduct(p); d.auto = true; }
  P.current = d.id;
  P.drawerId = productId;
  P.inDrawer = true;
  const list = P.visible || [];
  const idx = list.indexOf(productId);
  const panel = Drawer.open(
    '<div class="drawer-head pd-head"><div class="grow stack" style="gap:12px">' +
      '<div class="row wrap" style="gap:8px"><button class="btn btn-sm" data-step="-1"' + (idx <= 0 ? ' disabled' : '') + '>‹ 이전</button><button class="btn btn-sm" data-step="1"' + (idx < 0 || idx >= list.length - 1 ? ' disabled' : '') + '>다음 ›</button>' + (idx >= 0 ? '<span class="small muted">' + (idx + 1) + ' / ' + list.length + '<span class="hide-sm"> · 키보드 ← → 로도 넘길 수 있어요</span></span>' : '') + '</div>' +
      '<div class="row" style="align-items:center;gap:14px"><span class="thumb thumb-lg" data-thumb="' + esc(p.mainFileId) + '">' + (P.thumbs[p.mainFileId] ? '<img src="' + esc(P.thumbs[p.mainFileId]) + '" alt="">' : icon('box')) + '</span><div class="grow"><h2>' + esc(p.name) + '</h2><div class="row wrap" style="margin-top:6px">' + pill(statusLabel(p), P_TONE[statusKey(p)]) + '<span class="small muted">' + esc([p.barcode, productCategories(p).join(', ')].filter(Boolean).join(' · ')) + '</span></div></div></div>' +
      (d.mode === 'change' ? '<div class="notice info">' + icon('alert') + '<div>등록된 상품이라 바로 바뀌지 않고, 뷰티오라가 확인한 뒤 반영됩니다.</div></div>' : d.reviewNote ? '' : '<div class="notice warn">' + icon('alert') + '<div>검수 중인 상품입니다. 고쳐서 제출하면 바로 다시 검수합니다.</div></div>') +
    '</div><button class="btn btn-ghost btn-icon" data-drawer-close aria-label="닫기">' + icon('x') + '</button></div>' +
    '<div class="drawer-body pd-body"><section id="dEditor"></section></div>',
    () => { P.inDrawer = false; P.drawerId = ''; cleanupAutoDrafts(); renderTabs(); if (P.tab === 'products' && P.repaintProducts) P.repaintProducts(); });
  panel.classList.add('pd');
  panel.addEventListener('click', (e) => { const s = e.target.closest('[data-step]'); if (s) stepDrawer(Number(s.dataset.step)); });
  paintEditor();
}

function stepDrawer(delta) {
  const list = P.visible || [];
  const i = list.indexOf(P.drawerId);
  let j = i + delta;
  while (j >= 0 && j < list.length) {
    const p = P.boot.products.find((x) => x.productId === list[j]);
    if (p && statusKey(p) !== 'change') { openProductDrawer(list[j]); return; }
    j += delta;
  }
  Toast.show(delta > 0 ? '마지막 상품입니다.' : '첫 상품입니다.');
}

/** 수정 패널 아래쪽 버튼. */
function drawerFooter(d) {
  const changed = changedFields(d);
  const files = d.uploads.filter((u) => u.fileId).length;
  const n = changed.length + (files ? 1 : 0);
  return '<div class="sticky-actions pd-foot"><div class="grow small">' + (n ? '<strong>바뀐 항목 ' + changed.length + '개' + (files ? ' · 새 파일 ' + files + '개' : '') + '</strong><div class="muted ellipsis">' + esc(changed.map((f) => f.label).join(', ')) + '</div>' : '<span class="muted">아직 바뀐 내용이 없습니다</span>') + '</div>' +
    '<button class="btn btn-ghost" id="pdReset"' + (n ? '' : ' disabled') + '>되돌리기</button>' +
    '<button class="btn" id="pdNext">' + (n ? '요청함에 담고 다음' : '다음 상품') + '</button>' +
    '<button class="btn btn-primary" id="pdSubmit"' + (n ? '' : ' disabled') + '>' + (d.mode === 'change' ? '바로 수정 요청' : '바로 제출') + '</button></div>';
}

function bindDrawerFooter(box, d) {
  const reset = $('#pdReset', box), next = $('#pdNext', box), submit = $('#pdSubmit', box);
  if (reset) reset.addEventListener('click', () => {
    const p = P.boot.products.find((x) => x.productId === d.id);
    d.data = JSON.parse(JSON.stringify(d.base || (p && p.values) || {}));
    d.uploads = []; d.replace = [];
    saveDrafts(); paintEditor(); Toast.show('처음 내용으로 되돌렸습니다.');
  });
  if (next) next.addEventListener('click', () => {
    if (draftChanged(d)) { delete d.auto; saveDrafts(); renderTabs(); Toast.ok('요청함에 담았습니다.'); }
    stepDrawer(1);
  });
  if (submit) submit.addEventListener('click', () => { delete d.auto; saveDrafts(); P.selected = new Set([d.id]); submitDialog(); });
}

/* ---------- 표로 한꺼번에 수정 ---------- */
function openBulk(ids, priceOnly) {
  if (!ids.length) return;
  P.bulk = { ids: ids.slice(0, P.boot.limits.maxProducts), priceOnly };
  go('bulk');
}

function bulkFields(priceOnly) {
  const nums = fields().filter((f) => f.notionType === 'number');
  const price = nums.filter((f) => /가|price/i.test(f.label + f.id));
  if (priceOnly) return price.length ? price : nums;
  return fields().filter((f) => f.id === 'product_name' || f.id === 'option_name').concat(nums);
}

function viewBulk(view) {
  const cfg = P.bulk || { ids: [] };
  const drafts = cfg.ids.map((id) => {
    const p = P.boot.products.find((x) => x.productId === id);
    if (!p) return null;
    let d = P.drafts.find((x) => x.id === id);
    if (!d) { d = draftForProduct(p); d.auto = true; }
    return d;
  }).filter(Boolean);
  const cols = bulkFields(cfg.priceOnly);
  const numCols = cols.filter((f) => f.notionType === 'number');
  view.innerHTML =
    '<div class="row wrap" style="gap:12px"><button class="btn btn-sm btn-ghost" id="bBack">‹ 상품 관리</button><h2 style="font-size:22px">' + drafts.length + '개 상품 ' + (cfg.priceOnly ? '가격 바꾸기' : '한꺼번에 수정') + '</h2><span class="small muted hide-sm">칸을 눌러 고치고, Tab·Enter로 옆칸·아래칸으로 이동합니다.</span></div>' +
    (numCols.length ? '<section class="card card-pad row wrap bk-tools"><strong class="small">한 번에 적용</strong><select class="select" id="bkField" aria-label="바꿀 항목">' + UI.options(numCols.map((f) => ({ value: f.id, label: f.label })), numCols[0].id) + '</select><select class="select" id="bkMode" aria-label="방식">' + UI.options([{ value: 'down', label: '% 내리기' }, { value: 'up', label: '% 올리기' }, { value: 'set', label: '같은 값으로' }], 'down') + '</select><input class="input num" id="bkVal" inputmode="decimal" style="width:110px" aria-label="값" placeholder="10"><button class="btn btn-accent" id="bkApply">선택한 ' + drafts.length + '개에 적용</button></section>' : '') +
    '<section class="card bk-grid-wrap"><div class="table-wrap"><table class="table bk-grid"><thead><tr><th>상품</th>' + cols.map((f) => '<th' + (f.notionType === 'number' ? ' class="right"' : '') + '>' + esc(f.label) + '</th>').join('') + '<th>처리</th></tr></thead><tbody id="bkBody"></tbody></table></div></section>' +
    '<div class="grid-3" id="bkSum"></div>' +
    '<div class="sticky-actions bk-foot"><span class="small grow muted">큰 폭으로 바꿀 때는 <b>엑셀로 내려받기</b> → 고친 뒤 <b>엑셀 올리기</b>도 쓸 수 있어요.</span><button class="btn btn-ghost" id="bkReset">모두 되돌리기</button><button class="btn btn-primary" id="bkSubmit">제출</button></div>';
  const paintBody = () => {
    $('#bkBody').innerHTML = drafts.map((d) => {
      const p = P.boot.products.find((x) => x.productId === d.id) || {};
      return '<tr><td><div class="row"><span class="thumb" data-thumb="' + esc(p.mainFileId) + '">' + (P.thumbs[p.mainFileId] ? '<img src="' + esc(P.thumbs[p.mainFileId]) + '" alt="">' : icon('box')) + '</span><div class="grow"><div class="cell-title ellipsis" style="max-width:220px">' + esc(p.name) + '</div><div class="cell-sub">' + esc(p.barcode || '') + '</div></div></div></td>' +
        cols.map((f) => {
          const changed = d.base && !sameValue(f, d.data[f.id], d.base[f.id]);
          return '<td class="bk-cell' + (changed ? ' changed' : '') + '"><input class="input' + (f.notionType === 'number' ? ' num right' : '') + '" data-cell="' + esc(d.id) + '|' + esc(f.id) + '" value="' + esc(d.data[f.id] == null ? '' : d.data[f.id]) + '" aria-label="' + esc(p.name + ' ' + f.label) + '"' + (f.notionType === 'number' ? ' inputmode="decimal"' : '') + '>' + (changed ? '<s class="bk-old">' + esc(f.notionType === 'number' ? fmtWon(d.base[f.id]) : describe(d.base[f.id])) + '</s>' : '') + '</td>';
        }).join('') +
        '<td>' + (draftChanged(d) ? pill(d.mode === 'change' ? '수정 요청으로' : '바로 반영', d.mode === 'change' ? 'info' : 'warn') : '<span class="small muted">변경 없음</span>') + '</td></tr>';
    }).join('');
    loadThumbs(drafts.map((d) => (P.boot.products.find((x) => x.productId === d.id) || {}).mainFileId));
    paintSum();
  };
  const paintSum = () => {
    const changed = drafts.filter(draftChanged);
    const cells = drafts.reduce((n, d) => n + changedFields(d).filter((f) => cols.indexOf(f) >= 0).length, 0);
    const direct = changed.filter((d) => d.mode !== 'change').length;
    $('#bkSum').innerHTML = '<div class="card card-pad"><span class="small muted">바뀐 칸</span><strong style="font-size:22px">' + cells + '칸 · ' + changed.length + '개 상품</strong></div>' +
      '<div class="card card-pad"><span class="small muted">바로 반영</span><span>검수 중·보완 상품 ' + direct + '개 — 제출하면 바로 고쳐집니다</span></div>' +
      '<div class="card card-pad"><span class="small muted">수정 요청</span><span>등록 완료 상품 ' + (changed.length - direct) + '개 — 뷰티오라 확인 후 반영됩니다</span></div>';
    const btn = $('#bkSubmit');
    btn.disabled = !changed.length;
    btn.textContent = changed.length ? changed.length + '개 상품 제출' : '바뀐 상품이 없습니다';
  };
  view.addEventListener('input', (e) => {
    const c = e.target.closest('[data-cell]');
    if (!c) return;
    const [id, fid] = c.dataset.cell.split('|');
    const d = drafts.find((x) => x.id === id);
    const f = cols.find((x) => x.id === fid);
    d.data[fid] = c.value;
    const changed = d.base && !sameValue(f, d.data[fid], d.base[fid]);
    const td = c.closest('td');
    td.classList.toggle('changed', !!changed);
    let old = td.querySelector('.bk-old');
    if (changed && !old) { old = document.createElement('s'); old.className = 'bk-old'; old.textContent = f.notionType === 'number' ? fmtWon(d.base[fid]).replace(/<[^>]*>/g, '') : describe(d.base[fid]); td.appendChild(old); }
    if (!changed && old) old.remove();
    const status = td.closest('tr').lastElementChild;
    status.innerHTML = draftChanged(d) ? pill(d.mode === 'change' ? '수정 요청으로' : '바로 반영', d.mode === 'change' ? 'info' : 'warn') : '<span class="small muted">변경 없음</span>';
    saveDrafts();
    paintSum();
  });
  view.addEventListener('keydown', (e) => {
    const c = e.target.closest('[data-cell]');
    if (!c || e.key !== 'Enter') return;
    e.preventDefault();
    const inputs = $$('[data-cell]', view);
    const i = inputs.indexOf(c);
    const next = inputs[i + cols.length];
    if (next) next.focus();
  });
  $('#bBack').addEventListener('click', () => go('products'));
  const apply = $('#bkApply');
  if (apply) apply.addEventListener('click', () => {
    const fid = $('#bkField').value, mode = $('#bkMode').value;
    const v = Number(String($('#bkVal').value).replace(/[,\s원%]/g, ''));
    if (!isFinite(v) || $('#bkVal').value === '') { Toast.error('값을 숫자로 입력해 주세요.'); return; }
    drafts.forEach((d) => {
      const cur = Number(String(d.data[fid] == null ? '' : d.data[fid]).replace(/[,\s원]/g, ''));
      if (mode === 'set') d.data[fid] = String(v);
      else if (isFinite(cur) && String(d.data[fid]).trim() !== '') d.data[fid] = String(Math.round(cur * (mode === 'up' ? 1 + v / 100 : 1 - v / 100)));
    });
    saveDrafts();
    paintBody();
    Toast.ok('적용했습니다. 바뀐 칸은 노란색으로 표시됩니다.');
  });
  $('#bkReset').addEventListener('click', () => {
    drafts.forEach((d) => { if (d.base) cols.forEach((f) => { d.data[f.id] = d.base[f.id]; }); });
    saveDrafts();
    paintBody();
  });
  $('#bkSubmit').addEventListener('click', async (e) => {
    const changed = drafts.filter(draftChanged);
    if (!changed.length) return;
    // 사진 조건을 확인하려고 기존 파일 목록을 불러온다(Notion에 이미지 링크가 없는 상품만).
    await busy(e.currentTarget, async () => {
      const need = changed.filter((d) => !d.existingLoaded && !(d.linked && d.linked.main && d.linked.detail));
      for (let i = 0; i < need.length; i += 4) {
        await Promise.all(need.slice(i, i + 4).map((d) => Api.call('partner.assets', { productId: d.id }).then((r) => { d.existing = r.assets; d.existingLoaded = true; }).catch(() => {})));
      }
    });
    changed.forEach((d) => { delete d.auto; });
    saveDrafts();
    P.selected = new Set(changed.map((d) => d.id));
    submitDialog();
  });
  paintBody();
}

function loadThumbs(ids) {
  const need = ids.filter((id) => id && !Object.prototype.hasOwnProperty.call(P.thumbs, id)).slice(0, 24);
  if (!need.length) return;
  need.forEach((id) => { P.thumbs[id] = ''; });
  Api.call('partner.thumbnails', { fileIds: need }).then((r) => {
    Object.keys(r.thumbnails).forEach((id) => {
      P.thumbs[id] = r.thumbnails[id];
      $$('[data-thumb="' + id + '"]').forEach((el) => { if (r.thumbnails[id]) el.innerHTML = '<img src="' + esc(r.thumbnails[id]) + '" alt="" onerror="this.remove()">'; });
    });
  }).catch(() => {});
}

/* ---------- 초안 ---------- */
function newDraft(data) {
  const draft = { id: uid('PRD'), mode: 'new', data: data || {}, uploads: [], updatedAt: Date.now() };
  P.drafts.unshift(draft);
  P.current = draft.id;
  saveDrafts();
  return draft;
}

/** 등록된 상품을 고치는 초안(승인·상태 없음 → 수정 요청, 그 외 → 보완 재제출). */
function draftForProduct(p) {
  const mode = p.review === '승인 완료' || !p.review ? 'change' : 'revision';
  const draft = { id: p.productId, mode, name: p.name, data: JSON.parse(JSON.stringify(p.values || {})), base: JSON.parse(JSON.stringify(p.values || {})), uploads: [], existing: [], replace: [], linked: p.linked || {}, reviewNote: p.reviewNote, updatedAt: Date.now() };
  P.drafts = P.drafts.filter((d) => d.id !== p.productId);
  P.drafts.unshift(draft);
  return draft;
}

async function editExisting(productId) {
  const p = P.boot.products.find((x) => x.productId === productId);
  if (!p) return;
  const draft = draftForProduct(p);
  P.current = draft.id;
  saveDrafts();
  go('drafts');
}

function draftIssues(d) {
  const issues = [];
  fields().forEach((f) => {
    const v = d.data[f.id];
    const empty = v == null || v === '' || (Array.isArray(v) && !v.length);
    if (f.required && empty && f.notionType !== 'checkbox') issues.push(f.label);
    else if (!empty && f.notionType === 'number' && !isFinite(Number(String(v).replace(/[,\s원]/g, '')))) issues.push(f.label + '(숫자)');
    else if (!empty && f.notionType === 'url' && !/^https?:\/\/\S+$/i.test(String(v))) issues.push(f.label + '(주소)');
  });
  const has = (code) => d.uploads.some((u) => u.code === code && u.fileId) || (d.existing || []).some((a) => a.categoryCode === code) || (d.mode === 'change' && d.linked && d.linked[code]);
  ['main', 'detail'].forEach((code) => { const f = assetField(code); if (f && f.required && !has(code)) issues.push(f.label.replace(/ Drive URL$/, '')); });
  if (d.uploads.some((u) => u.state === 'uploading')) issues.push('업로드 진행 중');
  return issues;
}

function viewDrafts(view) {
  if (!P.drafts.length) {
    view.innerHTML = '<section class="card">' + UI.empty('작성 중인 상품이 없습니다', '새 상품을 등록하거나 상품 목록에서 수정할 상품을 골라 주세요.', '<button class="btn btn-primary" id="dNew">' + icon('plus') + '새 상품 등록</button>') + '</section>';
    $('#dNew').addEventListener('click', () => { newDraft(); go('drafts'); });
    return;
  }
  if (!P.drafts.some((d) => d.id === P.current)) P.current = P.drafts[0].id;
  view.innerHTML = '<div class="editor"><aside class="card draft-list"><div class="card-head" style="flex-wrap:wrap"><h3 class="nowrap">작성 중 ' + P.drafts.length + '</h3><div class="row wrap"><button class="btn btn-sm" id="dPhotos">' + icon('upload') + '사진 한꺼번에</button><button class="btn btn-sm" id="dAdd">' + icon('plus') + '추가</button></div></div><div class="list" id="dList"></div><div class="sticky-actions" style="justify-content:space-between"><label class="check small"><input type="checkbox" id="dAll"> 모두 선택</label><button class="btn btn-primary" id="dSubmit">선택 제출</button></div></aside><section id="dEditor"></section></div>';
  const paintList = () => {
    if (!$('#dList')) return;
    $('#dList').innerHTML = P.drafts.map((d) => {
      const issues = draftIssues(d);
      return '<div class="list-item' + (d.id === P.current ? ' selected' : '') + '" style="padding:10px 12px' + (d.id === P.current ? ';background:var(--brand-soft)' : '') + '"><input type="checkbox" data-sel="' + esc(d.id) + '"' + (P.selected.has(d.id) ? ' checked' : '') + ' aria-label="제출 선택"><button class="grow btn-ghost" style="border:0;background:none;text-align:left;cursor:pointer;padding:0" data-pick="' + esc(d.id) + '"><div class="cell-title ellipsis">' + esc(d.data.product_name || d.name || '이름 없는 상품') + '</div><div class="cell-sub">' + ({ new: '새 상품', revision: '보완 재제출', change: '수정 요청' })[d.mode] + ' · ' + (issues.length ? '<span style="color:var(--bad)">' + issues.length + '개 남음</span>' : '<span style="color:var(--ok)">제출 가능</span>') + '</div></button></div>';
    }).join('');
    $('#dAll').checked = P.drafts.length > 0 && P.drafts.every((d) => P.selected.has(d.id));
    $('#dSubmit').textContent = P.selected.size ? '선택 ' + P.selected.size + '개 제출' : '선택 제출';
  };
  $('#dList').addEventListener('click', (e) => {
    const pick = e.target.closest('[data-pick]');
    if (pick) { P.current = pick.dataset.pick; paintList(); paintEditor(); }
  });
  $('#dList').addEventListener('change', (e) => {
    const sel = e.target.closest('[data-sel]');
    if (!sel) return;
    if (sel.checked) P.selected.add(sel.dataset.sel); else P.selected.delete(sel.dataset.sel);
    paintList();
  });
  $('#dAll').addEventListener('change', (e) => { P.drafts.forEach((d) => (e.target.checked ? P.selected.add(d.id) : P.selected.delete(d.id))); paintList(); });
  $('#dAdd').addEventListener('click', () => { newDraft(); paintList(); paintEditor(); });
  $('#dPhotos').addEventListener('click', bulkPhotoDialog);
  $('#dSubmit').addEventListener('click', submitDialog);
  P.paintDraftList = paintList;
  paintList();
  paintEditor();
}

function fieldInput(f, value) {
  const id = 'f-' + f.id;
  const attrs = ' id="' + esc(id) + '" data-field="' + esc(f.id) + '"';
  const v = value == null ? '' : value;
  switch (f.notionType) {
    case 'select': return '<select class="select"' + attrs + '>' + UI.options(f.options, v, '선택해 주세요') + '</select>';
    case 'multi_select': return '<div class="chips-select"' + attrs + ' data-multi role="group" aria-label="' + esc(f.label) + '">' + f.options.map((o) => '<label><input type="checkbox" value="' + esc(o) + '"' + ((Array.isArray(v) ? v : String(v).split(',').map((x) => x.trim())).indexOf(o) >= 0 ? ' checked' : '') + '>' + esc(o) + '</label>').join('') + '</div>';
    case 'checkbox': return '<label class="check"><input type="checkbox"' + attrs + (v === true ? ' checked' : '') + '> 예</label>';
    case 'number': return '<input class="input num" inputmode="decimal"' + attrs + ' value="' + esc(v) + '" placeholder="' + esc(f.examples || '숫자만 입력') + '">';
    case 'date': return '<input class="input" type="date"' + attrs + ' value="' + esc(String(v).slice(0, 10)) + '">';
    case 'url': return '<input class="input" type="url" inputmode="url"' + attrs + ' value="' + esc(v) + '" placeholder="https://">';
    case 'email': return '<input class="input" type="email"' + attrs + ' value="' + esc(v) + '">';
    default: return f.type === 'textarea' ? '<textarea class="textarea" rows="3"' + attrs + ' placeholder="' + esc(f.examples) + '">' + esc(v) + '</textarea>' : '<input class="input"' + attrs + ' value="' + esc(v) + '" placeholder="' + esc(f.examples) + '">';
  }
}

/** 이 분류의 기존 파일이 제출 후 교체되는지(대표는 새 파일이 있으면 항상 교체). */
function willReplace(d, code) {
  const hasNew = d.uploads.some((u) => u.code === code && u.fileId);
  return hasNew && (code === 'main' || (d.replace || []).indexOf(code) >= 0);
}

/** 등록된 상품을 고칠 때 바뀐 칸을 노란색으로, 원래 값을 아래에 보여 준다. */
function fieldWithDiff(d, f, html) {
  if (!d.base) return html;
  const changed = !sameValue(f, d.data[f.id], d.base[f.id]);
  return '<div class="diff-wrap' + (changed ? ' changed' : '') + (f.type === 'textarea' || f.notionType === 'multi_select' ? ' full' : '') + '" data-diff="' + esc(f.id) + '">' + html + '<span class="diff-note"><span class="diff-badge">변경됨</span> 지금: ' + esc(f.notionType === 'number' ? fmtWon(d.base[f.id]) : describe(d.base[f.id])) + '</span></div>';
}

/** 원본 파일 내용의 SHA-256(같은 파일을 두 번 올리지 않기 위해). 계산할 수 없으면 빈 값. */
async function fileHash(file) {
  try {
    const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return ''; }
}

async function uploadFiles(d, code, files) {
  const slot = ASSET_SLOTS.find((s) => s.code === code);
  const label = slot.label;
  for (const original of files) {
    if (!slot.accept.split(',').includes(original.type)) { Toast.error(original.name + ': ' + (code === 'detail' ? 'JPG·PNG·WEBP·PDF' : 'JPG·PNG·WEBP') + ' 파일만 올릴 수 있습니다.'); continue; }
    const hash = await fileHash(original);
    const file = await shrinkImage(original);
    if (file.size > P.boot.limits.maxUploadBytes) { Toast.error(original.name + ': 8MB를 넘습니다. 용량을 줄여 주세요.'); continue; }
    const entry = { uploadId: uid('UP'), code, name: file.name, hash, state: 'uploading', preview: /^image\//.test(file.type) ? URL.createObjectURL(file) : '' };
    if (code === 'main') d.uploads = d.uploads.filter((u) => u.code !== 'main');
    d.uploads.push(entry);
    if (P.current === d.id) paintEditor();
    try {
      const base64 = await fileToBase64(file);
      const r = await Api.call('partner.upload', { kind: 'asset', productId: d.id, category: label, uploadId: entry.uploadId, fileName: file.name, mimeType: file.type, base64, contentHash: hash });
      entry.fileId = r.file.id;
      entry.state = 'done';
    } catch (e) {
      entry.state = 'error';
      entry.error = e.message;
    }
    entry.preview = entry.state === 'done' && entry.preview ? entry.preview : '';
    saveDrafts();
    if (P.current === d.id) paintEditor();
    if (P.paintDraftList) P.paintDraftList();
  }
}

/* ---------- 사진 한꺼번에 올리기 ---------- */
const PHOTO_KINDS = [
  ['상세페이지', 'detail'], ['상세이미지', 'detail'], ['상세컷', 'detail'], ['상세', 'detail'], ['detail', 'detail'],
  ['대표이미지', 'main'], ['메인이미지', 'main'], ['썸네일', 'main'], ['thumbnail', 'main'], ['thumb', 'main'], ['대표', 'main'], ['메인', 'main'], ['main', 'main'],
  ['추가이미지', 'extra'], ['서브', 'extra'], ['추가', 'extra'], ['extra', 'extra'], ['sub', 'extra']
];
const PHOTO_RE = new RegExp('^(.+?)[\\s_-]*(' + PHOTO_KINDS.map((k) => k[0]).join('|') + ')(?:[\\s_-]*\\(?\\d+\\)?)?$', 'i');

/** 파일 이름 → { key, code }. 예: 8801234567890_대표.jpg, 8801234567890-상세 (2).png, 3_추가.jpg, 수분크림썸네일.jpg */
function parsePhotoName(name) {
  const base = String(name).normalize('NFC').replace(/\.[a-z0-9]+$/i, '').trim();
  const m = base.match(PHOTO_RE);
  if (!m) return null;
  const kind = PHOTO_KINDS.find((k) => k[0].toLowerCase() === m[2].toLowerCase());
  return { key: m[1].replace(/[\s_-]+$/, '').trim(), code: kind[1] };
}

const normName = (v) => String(v || '').normalize('NFC').replace(/[\s_\-·()]+/g, '').toLowerCase();

/**
 * 파일 이름의 열쇠(바코드·엑셀 행 번호·상품명)로 대상을 찾는다.
 * 작성 중 상품을 먼저 보고, 없으면 등록된 상품을 본다. → { draftId } | { productId } | null
 */
function matchTarget(key) {
  const digits = String(key).replace(/\D/g, '');
  const byBarcode = digits.length >= 6;
  const same = (v) => String(v || '').replace(/\D/g, '') === digits;
  if (byBarcode) {
    const d = P.drafts.find((x) => same(x.data.barcode));
    if (d) return { draftId: d.id };
    const p = P.boot.products.find((x) => same(x.barcode));
    if (p) return { productId: p.productId };
  }
  if (/^\d{1,4}$/.test(key)) { const d = P.drafts.find((x) => x.row === Number(key)); if (d) return { draftId: d.id }; }
  const d = P.drafts.find((x) => normName(x.data.product_name || x.name) === normName(key));
  if (d) return { draftId: d.id };
  const p = P.boot.products.find((x) => normName(x.name) === normName(key));
  return p ? { productId: p.productId } : null;
}

    for (let i = 0; i < need.length; i += 4) {
      checking++; paint();
      await Promise.all(need.slice(i, i + 4).map((id) => Api.call('partner.assets', { productId: id }).then((r) => { existingHashes[id] = new Set(r.assets.map((a) => a.hash).filter(Boolean)); }).catch(() => {})));
      checking--; paint();
    }
  };
  const add = async (files) => {
    const items = await Promise.all(files.map(async (file) => {
      const parsed = parsePhotoName(file.name);
      let target = parsed ? matchTarget(parsed.key) : null;
      let blocked = '';
      if (target && target.productId) {
        const p = productOf(target.productId);
        if (p && p.change === '검수 대기') { blocked = '변경 검수 중인 상품 — 끝난 뒤 올려 주세요'; target = null; }
      }
      return { file, hash: await fileHash(file), draftId: target && target.draftId || '', productId: target && target.productId || '', code: parsed ? parsed.code : '', blocked };
    }));
    plan = plan.concat(items);
    paint();
    loadExisting(Array.from(new Set(items.map(idOf))));
  };
  const zone = $('#bpDrop', m);
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('over'); add(Array.from(e.dataTransfer.files)); });
  $('#bpFiles', m).addEventListener('change', (e) => { add(Array.from(e.target.files)); e.target.value = ''; });
  m.addEventListener('change', (e) => {
    const t = e.target.closest('[data-bp-target]');
    if (t) {
      const x = plan[Number(t.dataset.bpTarget)];
      x.draftId = t.value.indexOf('d:') === 0 ? t.value.slice(2) : '';
      x.productId = t.value.indexOf('p:') === 0 ? t.value.slice(2) : '';
      x.blocked = '';
      paint();
      loadExisting([idOf(x)]);
    }
    const c = e.target.closest('[data-bp-code]'); if (c) { plan[Number(c.dataset.bpCode)].code = c.value; paint(); }
  });
  $('#bpGo', m).addEventListener('click', (e) => busy(e.currentTarget, async () => {
    const replace = ($('input[name="bpMode"]:checked', m) || {}).value !== 'add';
    const ready = plan.filter((x) => (x.draftId || x.productId) && x.code && !x.dup);
    const seenMain = new Set();
    let skipped = 0, created = 0;
    for (const x of ready) {
      let d = x.draftId ? P.drafts.find((y) => y.id === x.draftId) : P.drafts.find((y) => y.id === x.productId);
      if (!d && x.productId) { const p = productOf(x.productId); if (p) { d = draftForProduct(p); created++; } }
      if (!d) continue;
      if (x.code === 'main') { if (seenMain.has(d.id)) { skipped++; continue; } seenMain.add(d.id); }
      if (replace && (x.code === 'detail' || x.code === 'extra')) d.replace = Array.from(new Set((d.replace || []).concat([x.code])));
      await uploadFiles(d, x.code, [x.file]);
    }
    saveDrafts();
    Modal.close();
    const failed = P.drafts.reduce((n, d) => n + d.uploads.filter((u) => u.state === 'error').length, 0);
    Toast.ok((ready.length - skipped) + '개 파일을 올렸습니다.' + (created ? ' 등록 상품 ' + created + '개는 수정 요청으로 담았습니다.' : '') + (skipped ? ' (대표 이미지는 상품당 1장 — ' + skipped + '개 건너뜀)' : '') + (failed ? ' 실패 ' + failed + '개는 상품 화면에서 확인해 주세요.' : '') + ' "선택 제출"로 보내 주세요.');
    renderTabs();
    go('drafts');
  }));
}

function submitDialog() {
  const picked = P.drafts.filter((d) => P.selected.has(d.id));
  if (!picked.length) { Toast.error('제출할 상품을 선택해 주세요.'); return; }
  const blocked = picked.filter((d) => draftIssues(d).length);
  if (blocked.length) { Toast.error('입력이 끝나지 않은 상품이 있습니다: ' + blocked.map((d) => d.data.product_name || '이름 없는 상품').join(', ')); return; }
  if (picked.length > P.boot.limits.maxProducts) { Toast.error('한 번에 ' + P.boot.limits.maxProducts + '개까지 제출할 수 있습니다.'); return; }
  const contact = Store.get('bo2-contact', { name: '', phone: '' });
  const m = Modal.open({
    title: picked.length + '개 상품 제출',
    body: '<ul class="small">' + picked.map((d) => '<li>' + esc(d.data.product_name) + ' — ' + ({ new: '새 상품', revision: '보완 재제출', change: '수정 요청' })[d.mode] + '</li>').join('') + '</ul>' +
      '<div class="form-grid">' + UI.field('제출하시는 분', '<input class="input" id="sName" value="' + esc(contact.name) + '" autocomplete="name">', { for: 'sName', required: true }) + UI.field('연락처', '<input class="input" id="sPhone" value="' + esc(contact.phone) + '" autocomplete="tel" inputmode="tel">', { for: 'sPhone' }) + '</div>' +
      '<p class="small muted">제출 후 뷰티오라가 검수합니다. 결과는 "상품 관리"의 상태에서 확인할 수 있습니다.</p>',
    foot: '<button class="btn" data-close>취소</button><button class="btn btn-primary" id="sGo">제출</button>'
  });
  const requestId = uid('SUB');
  $('#sGo', m).addEventListener('click', (e) => busy(e.currentTarget, async () => {
    const name = $('#sName', m).value.trim();
    if (!name) { Toast.error('이름을 입력해 주세요.'); return; }
    Store.set('bo2-contact', { name, phone: $('#sPhone', m).value.trim() });
    try {
      const r = await Api.call('partner.submit', { requestId, contactName: name, contactPhone: $('#sPhone', m).value.trim(), products: picked.map((d) => ({ productId: d.id, data: d.data, replace: d.replace || [], newFiles: d.uploads.filter((u) => u.fileId).map((u) => u.fileId) })) });
      if (!r.ok) {
        Modal.close();
        Modal.open({ title: '제출하지 못했습니다', body: '<p>아래 내용을 고친 뒤 다시 제출해 주세요. (아무것도 저장되지 않았습니다)</p><ul>' + r.problems.map((p) => '<li><strong>' + esc(p.name) + '</strong>: ' + esc(p.messages.join(' / ')) + '</li>').join('') + '</ul>' });
        return;
      }
      Modal.close();
      const done = new Set(r.results.map((x) => x.productId));
      P.drafts = P.drafts.filter((d) => !done.has(d.id));
      P.selected.clear();
      saveDrafts();
      Toast.ok(r.results.length + '개 상품을 제출했습니다. 검수 결과는 "상품 관리"에서 확인해 주세요.');
      done.forEach((id) => P.sel.delete(id));
      Drawer.close(true); P.inDrawer = false; P.drawerId = '';
      await refreshBoot();
      P.filter.status = 'all'; P.filter.sort = 'edited'; P.filter.page = 1;
      go('products');
    } catch (err) { Toast.error(err); }
  }));
}

/* ---------- 엑셀·CSV ---------- */
function downloadTemplate() {
  const cols = fields();
  const header = cols.map((f) => f.label + (f.required ? ' *' : ''));
  const example = cols.map((f) => f.examples || (f.notionType === 'multi_select' || f.notionType === 'select' ? (f.options[0] || '') : ''));
  const csv = '﻿' + [header, example].map((row) => row.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = P.boot.brand.name + '_상품등록_양식.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  Toast.show('두 번째 줄의 예시는 지우고 작성해 주세요. 사진은 파일 이름을 "바코드_대표.jpg"처럼 붙여 한꺼번에 올릴 수 있습니다.');
}

/** 지금 보고 있는 상품 목록을 엑셀(CSV)로 내려받는다. '상품 ID' 열이 있어 고친 뒤 다시 올리면 같은 상품을 찾아간다. */
function exportProducts() {
  const cols = fields();
  const list = filteredProducts();
  if (!list.length) { Toast.error('내려받을 상품이 없습니다.'); return; }
  const cell = (f, v) => Array.isArray(v) ? v.join(', ') : v === true ? '예' : v === false ? '' : v == null ? '' : String(v);
  const rows = [['상품 ID'].concat(cols.map((f) => f.label + (f.required ? ' *' : '')))].concat(list.map((p) => [p.productId].concat(cols.map((f) => cell(f, (p.values || {})[f.id])))));
  const csv = '\ufeff' + rows.map((row) => row.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = P.boot.brand.name + '_상품목록_' + Fmt.today() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  Toast.show(list.length + '개 상품을 내려받았습니다. 고친 뒤 "엑셀 올리기"로 올리면 바뀐 상품만 수정 요청으로 담깁니다. "상품 ID" 열은 지우지 마세요.');
}

function parseCsv(text) {
  const rows = []; let row = []; let cell = ''; let quoted = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') quoted = false; else cell += c; }
    else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function mapRows(values) {
  const cols = fields();
  const norm = (h) => String(h).replace(/\s*\*$/, '').trim();
  const headerRow = values.findIndex((row) => row.some((c) => norm(c) === '상품명' || norm(c) === 'product_name'));
  if (headerRow < 0) throw new Error('"상품명" 머리글을 찾지 못했습니다. 양식을 내려받아 사용해 주세요.');
  const headers = values[headerRow].map(norm);
  const index = {};
  const idCol = headers.findIndex((h) => h === '상품 ID' || h === '운영센터 상품 ID');
  cols.forEach((f) => { const short = f.label.replace(/\s*\([^)]*\)\s*$/, ''); const i = headers.findIndex((h) => h === f.label || h === f.id || h === short); if (i >= 0) index[f.id] = i; });
  return values.map((r, i) => ({ r, row: i + 1 })).slice(headerRow + 1).filter((x) => x.r.some((c) => String(c).trim())).map(({ r, row }) => {
    const data = {};
    Object.keys(index).forEach((id) => {
      const f = cols.find((x) => x.id === id);
      const v = String(r[index[id]] == null ? '' : r[index[id]]).trim();
      data[id] = f.notionType === 'multi_select' ? v.split(',').map((x) => x.trim()).filter(Boolean) : f.notionType === 'checkbox' ? /^(y|yes|true|예|o|1)$/i.test(v) : v;
    });
    return { data, row, productId: idCol >= 0 ? String(r[idCol] || '').trim() : '' };
  });
}

async function importFile(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  try {
    let rows;
    if (/\.csv$/i.test(file.name)) rows = mapRows(parseCsv(await file.text()));
    else if (/\.xlsx$/i.test(file.name)) {
      Toast.show('엑셀 파일을 읽는 중입니다…');
      const r = await Api.call('partner.importWorkbook', { fileName: file.name, base64: await fileToBase64(file) });
      rows = r.rows.map((data, i) => ({ data, row: (r.rowNumbers || [])[i] || 0, productId: (r.productIds || [])[i] || '' }));
    } else throw new Error('CSV 또는 xlsx 파일을 골라 주세요.');
    rows = rows.filter((r) => r.data.product_name || r.productId);
    if (!rows.length) throw new Error('상품명이 있는 행이 없습니다.');
    // 상품 ID(없으면 바코드)가 등록 상품과 맞으면 그 상품의 수정 요청으로, 아니면 새 상품으로 담는다.
    const byId = {}, byBarcode = {};
    P.boot.products.forEach((p) => { byId[p.productId] = p; if (p.barcode) byBarcode[String(p.barcode).replace(/\D/g, '')] = p; });
    let created = 0, changed = 0, same = 0, blocked = 0;
    rows.slice(0, 300).reverse().forEach((r) => {
      const p = byId[r.productId] || (r.data.barcode ? byBarcode[String(r.data.barcode).replace(/\D/g, '')] : null);
      if (!p) { if (r.data.product_name) { newDraft(r.data).row = r.row; created++; } return; }
      if (statusKey(p) === 'change') { blocked++; return; }
      const existing = P.drafts.find((d) => d.id === p.productId);
      const d = existing || draftForProduct(p);
      d.data = Object.assign({}, d.data, r.data);
      d.row = r.row;
      if (draftChanged(d)) { delete d.auto; changed++; }
      else { same++; if (!existing) P.drafts = P.drafts.filter((x) => x !== d); }
    });
    saveDrafts();
    Toast.ok([created ? '새 상품 ' + created + '개' : '', changed ? '수정 요청 ' + changed + '개' : '', same ? '변경 없음 ' + same + '개' : '', blocked ? '검토 중이라 건너뜀 ' + blocked + '개' : ''].filter(Boolean).join(' · ') + (created || changed ? ' — 요청함에서 확인한 뒤 제출해 주세요.' : ''));
    go(created || changed ? 'drafts' : 'products');
  } catch (e) { Toast.error(e); }
}

/* ---------- 시작 ---------- */
async function refreshBoot() {
  const data = await Api.call('partner.bootstrap');
  P.boot = data;
  renderTabs();
}

async function bootPartner() {
  if (!App.token) {
    $('#root').innerHTML = '<div class="boot"><strong style="color:var(--ink);font-size:17px">상품등록 링크가 필요합니다</strong><p>뷰티오라 담당자에게 받은 링크로 다시 접속해 주세요.</p></div>';
    return;
  }
  try {
    P.boot = await Api.call('partner.bootstrap');
    P.drafts = Store.get(draftKey(), []).filter((d) => d && d.id && d.data);
    P.drafts.forEach((d) => { d.uploads = (d.uploads || []).filter((u) => u.state === 'done').map((u) => Object.assign(u, { preview: '' })); });
    document.title = P.boot.brand.name + ' · 뷰티오라 상품등록센터';
    renderPartnerShell();
    go('products');
  } catch (e) {
    $('#root').innerHTML = '<div class="boot"><strong style="color:var(--ink);font-size:17px">상품등록센터를 열 수 없습니다</strong><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">다시 시도</button></div>';
  }
}
bootPartner();
