name: Optimization regression tests

on:
  push:
    branches: [main, audit/main-optimization]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/optimization.test.cjs
      - run: node tests/performance-regression.test.cjs
      - run: node tests/partner-center.test.cjs
      - run: node tests/notion-review.test.cjs
