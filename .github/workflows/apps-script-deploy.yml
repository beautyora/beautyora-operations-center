name: Apps Script 배포

on:
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상"
        required: true
        type: choice
        options:
          - test
          - production
      description:
        description: "배포 설명"
        required: true
        default: "UI/기능 업데이트"
      mode:
        description: "기존 주소 갱신 또는 새 웹앱 주소 생성"
        required: true
        type: choice
        options:
          - existing
          - new
        default: existing
      additional_deployment_id:
        description: "함께 갱신할 추가 웹앱 배포 ID (선택)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: apps-script-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: apps-script-${{ inputs.target }}

    steps:
      - name: 운영 배포 보호
        if: inputs.target == 'production' && github.ref_name != 'main'
        run: |
          echo "운영 배포는 main 브랜치에서만 가능합니다."
          exit 1

      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 서버 테스트
        # Apps Script에 쓰기 전에 가짜 Notion·Drive로 전체 흐름을 검증한다.
        run: node --test tests/*.test.cjs

      - name: 배포 환경 선택
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          TEST_SCRIPT_ID: ${{ secrets.TEST_SCRIPT_ID }}
          TEST_DEPLOYMENT_ID: ${{ secrets.TEST_DEPLOYMENT_ID }}
          PROD_SCRIPT_ID: ${{ secrets.PROD_SCRIPT_ID }}
          PROD_DEPLOYMENT_ID: ${{ secrets.PROD_DEPLOYMENT_ID }}
        run: |
          # 인증 파일 생성 및 clasp push 전에 일치 여부만 검사한다.
          node scripts/verify-deploy-target.cjs
          if [ "$TARGET" = "production" ]; then
            SCRIPT_ID="$PROD_SCRIPT_ID"
            DEPLOYMENT_ID="$PROD_DEPLOYMENT_ID"
          else
            SCRIPT_ID="$TEST_SCRIPT_ID"
            DEPLOYMENT_ID="$TEST_DEPLOYMENT_ID"
          fi

          if [ -z "$SCRIPT_ID" ] || { [ "${{ inputs.mode }}" = "existing" ] && [ -z "$DEPLOYMENT_ID" ]; }; then
            echo "대상 환경의 SCRIPT_ID 또는 기존 배포용 DEPLOYMENT_ID Secret이 없습니다."
            exit 1
          fi

          printf '{"scriptId":"%s","rootDir":"src"}\n' "$SCRIPT_ID" > .clasp.json
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Google 인증 준비
        shell: bash
        env:
          CLASPRC_JSON_BASE64: ${{ secrets.CLASPRC_JSON_BASE64 }}
        run: |
          if [ -z "$CLASPRC_JSON_BASE64" ]; then
            echo "CLASPRC_JSON_BASE64 Secret이 없습니다."
            exit 1
          fi
          echo "$CLASPRC_JSON_BASE64" | base64 --decode > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Apps Script 코드 반영
        run: npx --yes @google/clasp@3 push --force

      - name: 기존 웹앱을 새 버전으로 갱신
        if: inputs.mode == 'existing'
        env:
          DEPLOY_DESCRIPTION: ${{ inputs.description }}
        run: |
          npx --yes @google/clasp@3 create-deployment \
            --deploymentId "$DEPLOYMENT_ID" \
            --description "$DEPLOY_DESCRIPTION"

      - name: 추가 운영 웹앱도 갱신
        if: inputs.target == 'production' && inputs.mode == 'existing' && inputs.additional_deployment_id != ''
        env:
          DEPLOY_DESCRIPTION: ${{ inputs.description }}
          ADDITIONAL_DEPLOYMENT_ID: ${{ inputs.additional_deployment_id }}
        run: |
          if [[ ! "$ADDITIONAL_DEPLOYMENT_ID" =~ ^AKfy[a-zA-Z0-9_-]+$ ]]; then
            echo "추가 배포 ID 형식이 올바르지 않습니다."
            exit 1
          fi
          npx --yes @google/clasp@3 create-deployment \
            --deploymentId "$ADDITIONAL_DEPLOYMENT_ID" \
            --description "$DEPLOY_DESCRIPTION - 추가 운영 웹앱"

      - name: 새 웹앱 배포 생성
        if: inputs.mode == 'new'
        shell: bash
        env:
          DEPLOY_DESCRIPTION: ${{ inputs.description }}
        run: |
          npx --yes @google/clasp@3 create-deployment \
            --description "$DEPLOY_DESCRIPTION" --json > deployment.json
          DEPLOYMENT_ID=$(jq -r '.deploymentId // empty' deployment.json)
          VERSION=$(jq -r '.versionNumber // empty' deployment.json)
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "새 배포 ID를 확인하지 못했습니다."
            exit 1
          fi
          WEBAPP_URL="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          echo "새 웹앱 배포 ID: $DEPLOYMENT_ID"
          echo "새 웹앱 URL: $WEBAPP_URL"
          {
            echo "### 새 Apps Script 웹앱 배포"
            echo "- 대상: ${{ inputs.target }}"
            echo "- 버전: $VERSION"
            echo "- 배포 ID: \`$DEPLOYMENT_ID\`"
            echo "- 웹앱 URL: $WEBAPP_URL"
            echo "- 커밋: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과
        run: |
          echo "배포 대상: ${{ inputs.target }}"
          echo "배포 방식: ${{ inputs.mode }}"
          echo "브랜치: ${{ github.ref_name }}"
          echo "커밋: ${{ github.sha }}"


